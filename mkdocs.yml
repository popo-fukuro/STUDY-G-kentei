site_name: G検定 合格ラボ
site_description: G検定（JDLA Deep Learning for GENERAL）合格のための講義資料とQ&Aノート。シラバス2024 第1.4版の全キーワードを図解で学ぶ。
site_url: https://popo-fukuro.github.io/STUDY-G-kentei/
repo_url: https://github.com/popo-fukuro/STUDY-G-kentei
repo_name: popo-fukuro/STUDY-G-kentei
edit_uri: edit/main/docs/
copyright: 解説・図はすべてオリジナル。外部の資料はリンクと出典で紹介しています。

theme:
  name: material
  language: ja
  font:
    text: Noto Sans JP
    code: JetBrains Mono
  icon:
    logo: material/robot-happy-outline
    repo: fontawesome/brands/github
    admonition:
      note: material/notebook-outline
      tip: material/lightbulb-on-outline
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替え
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips
    - toc.follow

plugins:
  - search:
      lang: ja
  - tags

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.smartsymbols
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - https://unpkg.com/katex@0.16.11/dist/katex.min.css
  - stylesheets/extra.css

extra_javascript:
  - javascripts/katex-init.js
  - https://unpkg.com/katex@0.16.11/dist/katex.min.js
  - https://unpkg.com/katex@0.16.11/dist/contrib/auto-render.min.js
  - javascripts/print.js

extra:
  generator: false

nav:
  - ホーム: index.md
  - 試験範囲マップ: map/index.html
  - 試験ガイド:
      - guide/index.md
      - 学習計画: guide/study-plan.md
  - 講義:
      - lectures/index.md
      - デザイン見本: lectures/style-guide.md
  - Q&Aノート:
      - notes/index.md
  - 網羅チェック表: coverage/index.md
  - 一問一答: quiz/index.md
  - タグ: tags.md
