"id":"T27-12","name":"word2vec","desc":"周りの単語との関係から、単語を意味が反映されたベクトル（分散表現）で表す手法。2013年に発表された。","sup":false,"aka":[],"note":null},{"id":"T27-13","name":"感情分析","desc":"文章が肯定的か否定的かなど、書き手の感情や評価を判定すること。","sup":false,"aka":[],"note":null},{"id":"T27-14","name":"機械翻訳","desc":"ある言語の文章を、別の言語にコンピュータで翻訳すること。","sup":false,"aka":[],"note":null},{"id":"T27-15","name":"形態素解析","desc":"文章を意味をもつ最小の単位（形態素）に分け、品詞などを判定すること。","sup":false,"aka":[],"note":null},{"id":"T27-16","name":"構文解析","desc":"文の中の語どうしの文法的な関係（係り受けなど）を解析すること。","sup":false,"aka":[],"note":null},{"id":"T27-17","name":"質問応答","desc":"質問文に対して、適切な答えを返すこと。","sup":false,"aka":[],"note":null},{"id":"T27-18","name":"情報検索","desc":"大量の文書から、目的に合う情報を探し出すこと。","sup":false,"aka":[],"note":null},{"id":"T27-19","name":"スキップグラム","desc":"真ん中の単語から周りの単語を予測して、単語の分散表現を学ぶword2vecの方法。","sup":false,"aka":[],"note":null},{"id":"T27-20","name":"単語埋め込み","desc":"単語を、意味の近さが距離に表れる数値のベクトルに変換すること。","sup":false,"aka":[],"note":null},{"id":"T27-21","name":"分散表現","desc":"単語などを、多くの次元に意味が分散した密なベクトルで表す方法。","sup":false,"aka":[],"note":null},{"id":"T27-22","name":"文書要約","desc":"長い文章から重要な内容を取り出し、短くまとめること。","sup":false,"aka":[],"note":null},{"id":"T27-23","name":"ワンホットベクトル","desc":"1つの要素だけが1で、残りがすべて0のベクトル。単語を区別するだけで、意味の近さは表せない。","sup":false,"aka":[],"note":null},{"id":"T27-24","name":"大規模言語モデル (LLM)","desc":"大量の文章で事前学習した、とても多くのパラメータをもつ言語モデル。文章の生成・要約・質問応答などを幅広くこなす。","sup":false,"aka":[],"note":null},{"id":"T27-25","name":"統計的機械翻訳","desc":"対訳データから単語や句の対応の確率を学んで訳す機械翻訳。ニューラル機械翻訳が登場する前の主流。","sup":false,"aka":[],"note":null},{"name":"スケーリング則","desc":"モデルの大きさ・データの量・計算量を増やすほど、性能が一定の法則に従って上がるという経験則。JDLA公式の例題Q11の題材だが、シラバス1.4版のキーワードにはない。","sup":true,"aka":[],"note":null,"id":"T27-x1"},{"name":"ChatGPT・GPT-n","desc":"OpenAIの大規模言語モデル（GPT）と、それを使った対話サービス。シラバス1.4版でキーワードから削除された。","sup":true,"aka":[],"note":null,"id":"T27-x2"}]},{"id":"T32","name":"マルチモーダル","short":"マルチモーダル","category":"ディープラーニングの応用例","area":"技術分野","lecture":{"number":19,"title":"マルチモーダル・モデルの解釈性・軽量化","status":"planned","page":null},"terms":[{"id":"T32-1","name":"CLIP","desc":"画像とその説明文の組を大量に学び、画像と文章を同じ空間で比べられるようにしたモデル。2021年にOpenAIが発表した。","sup":false,"aka":[],"note":null},{"id":"T32-2","name":"DALL-E","desc":"文章の指示から画像を生成する、OpenAIのモデル。","sup":false,"aka":[],"note":null},{"id":"T32-3","name":"Flamingo","desc":"画像と文章を組み合わせた入力を扱う、DeepMindの視覚言語モデル。少しの例を見せるだけで新しい課題に対応する。","sup":false,"aka":[],"note":null},{"id":"T32-4","name":"Image Captioning","desc":"画像の内容を説明する文章を、自動で作ること。","sup":false,"aka":[],"note":null},{"id":"T32-5","name":"Text-To-Image","desc":"文章から画像を生成すること。","sup":false,"aka":[],"note":null},{"id":"T32-6","name":"Visual Question Answering","desc":"画像についての質問に、文章で答えること。","sup":false,"aka":[],"note":null},{"id":"T32-7","name":"Unified-IO","desc":"画像・文章などさまざまな入出力の課題を、1つのモデルで扱えるようにしたモデル。","sup":false,"aka":[],"note":null},{"id":"T32-8","name":"Zero-shot","desc":"学習のときに見ていないクラスや課題に、例を与えずに対応すること。","sup":false,"aka":["ゼロショット"],"note":null},{"id":"T32-9","name":"基盤モデル","desc":"大量で多様なデータで事前学習され、さまざまな課題に合わせて使える大規模なモデル。","sup":false,"aka":[],"note":null},{"id":"T32-10","name":"マルチタスク学習","desc":"関連する複数の課題を1つのモデルで同時に学習し、性能を互いに高めること。","sup":false,"aka":[],"note":null}]}]},{"id":"gen","order":12,"domain":"dlapp","color":"#5B34AA","name":"深層強化学習とデータ生成","short":"深層強化学習と生成","shortLines":["深層強化学習","と生成"],"priority":"mid","badges":["revised"],"summary":"強化学習にディープラーニングを組み合わせた深層強化学習と、画像・文章・音声などを作り出す生成モデル。ゲームAIやロボット、画像生成AIの裏側にある技術。","themes":["DQNとその改良（ダブルDQN・デュエリングネットワーク・ノイジーネットワーク・Rainbow）","分散学習と方策の学習（A3C・APE-X・PPO）、ゲームAI（AlphaStar・OpenAI Five・Agent57）","現実への応用（sim2real・ドメインランダマイゼーション・オフライン強化学習・残差強化学習）","RLHFによる言語モデルの調整","生成モデル（GAN・DCGAN・Pix2Pix・CycleGAN・Diffusion Model・NeRF）"],"keywords":["DQN","ダブルDQN","Rainbow","PPO","RLHF","sim2real","ドメインランダマイゼーション","敵対的生成ネットワーク (GAN)","CycleGAN","Diffusion Model","NeRF"],"examPoint":"手法と改良点の組合せ（DQNの何をダブルDQNが直したか）や、生成モデルの仕組みの違いを問う。","examTrap":"Pix2Pixは対になった画像が必要、CycleGANは対になったデータがなくても変換できる。","priorityReason":"シラバス2024の改訂ポイントで生成AIに必要な技術としてRLHF・Diffusion Model・NeRFが追加され、1.3版でマルチエージェント強化学習（MARL）の表記が改められた。JDLA公式の例題で直接の題材になった問はない。キーワード数は29語。","items":["T29","T30"],"subs":[{"id":"T29","name":"深層強化学習","short":"深層強化学習","category":"ディープラーニングの応用例","area":"技術分野","lecture":{"number":17,"title":"深層強化学習","status":"planned","page":null},"terms":[{"id":"T29-1","name":"A3C","desc":"複数のエージェントが並列に環境とやり取りし、非同期にActor-Criticで学習する手法。","sup":false,"aka":[],"note":null},{"id":"T29-2","name":"Agent57","desc":"DeepMindの深層強化学習のエージェント。2020年に、Atariの57種類すべてのゲームで人間の基準を上回った。","sup":false,"aka":[],"note":null},{"id":"T29-3","name":"APE-X","desc":"経験を集める役と学習する役を分け、多数のエージェントを並列に動かして大量の経験を集める分散型の深層強化学習。","sup":false,"aka":[],"note":null},{"id":"T29-4","name":"DQN","desc":"Q学習の行動価値関数を、深層ニューラルネットワークで近似した手法。Atariのゲームで人間並みの成績を出した。","sup":false,"aka":[],"note":null},{"id":"T29-5","name":"OpenAI Five","desc":"OpenAIが開発した、対戦ゲームDota 2で5体が協力して戦うAI。プロのチームに勝った。","sup":false,"aka":[],"note":null},{"id":"T29-6","name":"PPO","desc":"方策を一度に変えすぎないよう更新の幅を制限し、安定して学習できるようにした方策勾配法。RLHFでも使われる。","sup":false,"aka":[],"note":null},{"id":"T29-7","name":"Rainbow","desc":"DQNの複数の改良（ダブルDQN・デュエリングネットワーク・ノイジーネットワークなど）を組み合わせた手法。","sup":false,"aka":[],"note":null},{"id":"T29-8","name":"RLHF","desc":"人の評価から報酬モデルを作り、強化学習でモデルを調整する手法。大規模言語モデルを人の好みに合わせるのに使う。","sup":false,"aka":[],"note":null},{"id":"T29-9","name":"sim2real","desc":"シミュレーションの中で学習した方策を、現実のロボットなどに移して使うこと。","sup":false,"aka":[],"note":null},{"id":"T29-10","name":"アルファスター (AlphaStar)","desc":"DeepMindが開発した、リアルタイム戦略ゲームStarCraft IIのAI。トップレベルのプレイヤーに勝った。","sup":false,"aka":[],"note":null},{"id":"T29-11","name":"オフライン強化学習","desc":"環境とやり取りせずに、あらかじめ集めたデータだけで方策を学習する強化学習。","sup":false,"aka":[],"note":null},{"id":"T29-12","name":"残差強化学習","desc":"従来の制御の方策に、強化学習で学んだ補正（残差）を足して動作を改善する方法。","sup":false,"aka":[],"note":null},{"id":"T29-13","name":"状態表現学習","desc":"画像などの観測から、強化学習に役立つ状態の表し方を学ぶこと。","sup":false,"aka":[],"note":null},{"id":"T29-14","name":"ダブルDQN","desc":"行動の選択と評価に別のネットワークを使い、DQNが行動価値を大きく見積もりすぎる問題を和らげた手法。","sup":false,"aka":[],"note":null},{"id":"T29-15","name":"デュエリングネットワーク","desc":"行動価値を、状態そのものの価値と、行動ごとの有利さに分けて推定するDQNの構造。","sup":false,"aka":[],"note":null},{"id":"T29-16","name":"ドメインランダマイゼーション","desc":"シミュレーションの見た目や物理の条件をランダムに変えて学習し、現実との違いに強くする方法。","sup":false,"aka":[],"note":null},{"id":"T29-17","name":"ノイジーネットワーク","desc":"ネットワークの重みにノイズを加えて、探索を促すDQNの改良。","sup":false,"aka":[],"note":null},{"id":"T29-18","name":"報酬成形","desc":"学習しやすくなるよう、本来の報酬に途中経過への報酬などを加えて設計し直すこと。","sup":false,"aka":[],"note":null},{"id":"T29-19","name":"マルチエージェント強化学習 (MARL)","desc":"複数のエージェントが同じ環境で協力したり競争したりしながら学習する強化学習。","sup":false,"aka":[],"note":null},{"id":"T29-20","name":"連続値制御","desc":"ロボットの関節の角度のように、行動が連続した値をとる制御の問題。","sup":false,"aka":[],"note":null}]},{"id":"T30","name":"データ生成","short":"データ生成","category":"ディープラーニングの応用例","area":"技術分野","lecture":{"number":18,"title":"データ生成（生成モデル）と転移学習","status":"planned","page":null},"terms":[{"id":"T30-1","name":"CycleGAN","desc":"対になったデータがなくても、2つの画像の分野（例：馬としま馬）を互いに変換できるGAN。","sup":false,"aka":[],"note":null},{"id":"T30-2","name":"DCGAN","desc":"生成器と識別器に畳み込みニューラルネットワークを使い、学習を安定させたGAN。","sup":false,"aka":[],"note":null},{"id":"T30-3","name":"Diffusion Model","desc":"データにノイズを少しずつ加える過程を逆にたどり、ノイズから少しずつデータを復元して生成するモデル（拡散モデル）。","sup":false,"aka":["拡散モデル"],"note":null},{"id":"T30-4","name":"NeRF","desc":"いくつかの方向から撮った写真から3次元の空間をニューラルネットワークで表し、新しい視点の画像を作る手法。","sup":false,"aka":[],"note":null},{"id":"T30-5","name":"Pix2Pix","desc":"対になった画像のデータで学習し、線画を写真風にするなど、ある画像を別の画像に変換するGAN。","sup":false,"aka":[],"note":null},{"id":"T30-6","name":"音声生成","desc":"音声をAIで作り出すこと。","sup":false,"aka":[],"note":null},{"id":"T30-7","name":"画像生成","desc":"画像をAIで作り出すこと。","sup":false,"aka":[],"note":null},{"id":"T30-8","name":"敵対的生成ネットワーク (GAN)","desc":"偽物を作る生成器と、本物か偽物かを見分ける識別器を競わせて学習する生成モデル。2014年にグッドフェローらが発表した。","sup":false,"aka":[],"note":null},{"id":"T30-9","name":"文章生成","desc":"文章をAIで作り出すこと。","sup":false,"aka":[],"note":null}]}]},{"id":"practical","order":13,"domain":"dlapp","color":"#853C9F","name":"転移学習・モデルの解釈性・モデルの軽量化","short":"転移・解釈・軽量化","shortLines":["転移・解釈・","軽量化"],"priority":"mid","badges":[],"summary":"学習済みのモデルを使い回す転移学習、AIの判断の理由を示す解釈性、スマホなどで動かすための軽量化。ディープラーニングを実際の現場で使うための工夫が集まった分野。","themes":["転移学習とファインチューニング、事前学習済みモデル","少ないラベルで学ぶ方法（Few-shot・One-shot・半教師あり学習・自己教師あり学習）と破滅的忘却","判断の根拠の可視化（CAM・Grad-CAM）と特徴量の重要度（LIME・SHAP・Permutation Importance）","モデルの軽量化（蒸留・プルーニング・量子化・宝くじ仮説）とエッジAI"],"keywords":["事前学習済みモデル","自己教師あり学習","破滅的忘却","Few-shot","Grad-CAM","LIME","SHAP","蒸留","プルーニング","量子化","エッジAI"],"examPoint":"軽量化の手法の名前と中身（蒸留・プルーニング・量子化）、説明の手法の名前と特徴を問う。","examTrap":"蒸留は小さなモデルに学ばせる、プルーニングは重みを取り除く、量子化は数値のビット数を減らす。シラバスの表記は「破滅的忘却」（1.4版で「破壊的忘却」から変更）。","priorityReason":"JDLA公式の例題Q12（G2024#4、量子化）が題材にしている。シラバス2024で自己教師あり学習・破壊的忘却が追加され、1.4版で「破滅的忘却」に改められた。キーワード数は19語。","items":["T31","T33","T34"],"subShort":{"T31":"転移学習・微調整"},"subs":[{"id":"T31","name":"転移学習・ファインチューニング","short":"転移学習・微調整","category":"ディープラーニングの応用例","area":"技術分野","lecture":{"number":18,"title":"データ生成（生成モデル）と転移学習","status":"planned","page":null},"terms":[{"id":"T31-1","name":"Few-shot","desc":"少しの例だけで、新しい課題に対応すること。","sup":false,"aka":[],"note":null},{"id":"T31-2","name":"One-shot","desc":"1つの例だけで、新しい課題に対応すること。","sup":false,"aka":[],"note":null},{"id":"T31-3","name":"自己教師あり学習","desc":"人がラベルを付けなくても、データ自身から作った課題（隠した部分の予測など）で学習する方法。","sup":false,"aka":[],"note":null},{"id":"T31-4","name":"事前学習","desc":"大量のデータで汎用的な特徴を学んでおくこと。その後のファインチューニングの土台になる。","sup":false,"aka":[],"note":null},{"id":"T31-5","name":"事前学習済みモデル","desc":"大量のデータですでに学習され、公開・再利用できるモデル。","sup":false,"aka":[],"note":null},{"id":"T31-6","name":"破滅的忘却","desc":"新しい課題を学習すると、以前に学習した課題の性能が大きく下がってしまう現象。","sup":false,"aka":[],"note":null},{"id":"T31-7","name":"半教師あり学習","desc":"少しのラベル付きデータと、大量のラベルなしデータを組み合わせて学習する方法。","sup":false,"aka":[],"note":null}]},{"id":"T33","name":"モデルの解釈性","short":"モデルの解釈性","category":"ディープラーニングの応用例","area":"技術分野","lecture":{"number":19,"title":"マルチモーダル・モデルの解釈性・軽量化","status":"planned","page":null},"terms":[{"id":"T33-1","name":"CAM","desc":"最後の畳み込み層の特徴マップと出力の重みから、画像のどこが判断の根拠になったかを示す手法。GAPのある構造で使う。","sup":false,"aka":[],"note":null},{"id":"T33-2","name":"Grad-CAM","desc":"勾配の情報を使って、判断の根拠となった画像の領域を示す手法。CAMより幅広いモデルに使える。","sup":false,"aka":[],"note":null},{"id":"T33-3","name":"LIME","desc":"説明したい1つの予測の周りを簡単なモデルで近似して、どの特徴が効いたかを示す手法。","sup":false,"aka":[],"note":null},{"id":"T33-4","name":"Permutation Importance","desc":"ある特徴量の値をシャッフルしたときの精度の下がり方から、その特徴量の重要度を測る手法。","sup":false,"aka":[],"note":null},{"id":"T33-5","name":"SHAP","desc":"ゲーム理論のシャプレイ値を使い、各特徴量が予測にどれだけ貢献したかを公平に配分して示す手法。","sup":false,"aka":[],"note":null},{"id":"T33-6","name":"説明可能AI (XAI)","desc":"AIの判断の理由や根拠を、人が理解できるように示す技術や研究。","sup":false,"aka":[],"note":null}]},{"id":"T34","name":"モデルの軽量化","short":"モデルの軽量化","category":"ディープラーニングの応用例","area":"技術分野","lecture":{"number":19,"title":"マルチモーダル・モデルの解釈性・軽量化","status":"planned","page":null},"terms":[{"id":"T34-1","name":"エッジAI","desc":"クラウドではなく、スマホやカメラなど現場の機器（エッジ）の中でAIの処理を行うこと。","sup":false,"aka":[],"note":null},{"id":"T34-2","name":"蒸留","desc":"大きなモデル（教師）の出力を目標に、小さなモデル（生徒）を学習させて性能を引き継ぐ方法。","sup":false,"aka":[],"note":null},{"id":"T34-3","name":"宝くじ仮説","desc":"大きなネットワークの中には、それだけで同じくらいの性能を出せる小さな部分ネットワークが含まれているという仮説。","sup":false,"aka":[],"note":null},{"id":"T34-4","name":"プルーニング","desc":"重要でない重みやニューロンを取り除いて、モデルを小さくする方法（枝刈り）。","sup":false,"aka":[],"note":null},{"id":"T34-5","name":"モデル圧縮","desc":"性能をなるべく落とさずに、モデルの大きさや計算量を減らす方法の総称。","sup":false,"aka":[],"note":null},{"id":"T34-6","name":"量子化","desc":"重みなどの数値を、より少ないビット数で表してモデルを軽くする方法。","sup":false,"aka":[],"note":null}]}]},{"id":"project","order":14,"domain":"social","color":"#8A5300","name":"AIの社会実装（プロジェクトの進め方とデータ）","short":"プロジェクトとデータ","shortLines":["プロジェクト","とデータ"],"priority":"mid","badges":[],"summary":"AIを実際の事業に組み込むまでの進め方と、学習に使うデータの集め方・扱い方。技術だけでなく、関係者との合意やデータの品質がプロジェクトの成否を分ける。","themes":["AIプロジェクトの流れ（課題設定→PoC→開発→運用）とCRISP-DM・CRISP-ML","MLOpsと開発の環境（Python・Jupyter Notebook・Docker・クラウド・Web API）","開発の進め方（アジャイルとウォーターフォール）と、外部との連携（オープン・イノベーション・産学連携）","データの準備（アノテーション・コーパス・オープンデータセット）とデータリーケージ"],"keywords":["AIプロジェクトの進め方","PoC","CRISP-DM","MLOps","アジャイル","アノテーション","オープンデータセット","データリーケージ"],"examPoint":"プロジェクトの各段階で何をするか、データの扱いで起きる問題（データリーケージなど）の原因と影響を問う。","examTrap":"データリーケージがあると検証では精度が高く見えるが、実際に使うと精度が出ない。過学習とは原因が違う。","priorityReason":"JDLA公式の例題Q14（G2022#1、データリーケージの影響）が題材にしている。キーワード数は23語。シラバスの改訂履歴で、この分野の変更はない。","items":["T35","T36"],"subShort":{"T36":"データの収集と加工"},"subs":[{"id":"T35","name":"AIプロジェクトの進め方","short":"AIプロジェクトの進め方","category":"AIの社会実装に向けて","area":"技術分野","lecture":{"number":20,"title":"AIプロジェクトの進め方とデータ","status":"planned","page":null},"terms":[{"id":"T35-1","name":"AIのビジネス活用","desc":"AIを使って、業務の効率化や新しい製品・サービスなど、事業の価値を生み出すこと。","sup":false,"aka":[],"note":null},{"id":"T35-2","name":"AIプロジェクトの進め方","desc":"課題の設定からデータの収集、PoC、開発、運用と改善までを段階的に進めていく流れ。","sup":false,"aka":[],"note":null},{"id":"T35-3","name":"BPR","desc":"業務の流れを根本から見直して、つくり直すこと（ビジネスプロセス・リエンジニアリング）。","sup":false,"aka":[],"note":null},{"id":"T35-4","name":"CRISP-DM","desc":"ビジネスの理解から、データの理解・準備、モデルの作成、評価、展開へと進む、データ分析の標準的な進め方。","sup":false,"aka":[],"note":null},{"id":"T35-5","name":"CRISP-ML","desc":"CRISP-DMを機械学習向けに広げ、品質の確認や運用・監視の段階も含めた進め方。","sup":false,"aka":[],"note":null},{"id":"T35-6","name":"Docker","desc":"アプリと実行環境をコンテナにまとめて、どこでも同じように動かせるようにするツール。","sup":false,"aka":[],"note":null},{"id":"T35-7","name":"Jupyter Notebook","desc":"コードと実行結果、説明の文章を1つのノートにまとめ、対話的に実行できるツール。","sup":false,"aka":[],"note":null},{"id":"T35-8","name":"MLOps","desc":"機械学習のモデルの開発から運用・監視・再学習までを、継続的に回すための仕組みと考え方。","sup":false,"aka":[],"note":null},{"id":"T35-9","name":"PoC","desc":"本格的な開発の前に、アイデアや技術が本当に役立つかを小さく試して確かめること（概念実証）。","sup":false,"aka":[],"note":null},{"id":"T35-10","name":"Python","desc":"機械学習のライブラリが充実していて、AIの開発で広く使われるプログラミング言語。","sup":false,"aka":[],"note":null},{"id":"T35-11","name":"Web API","desc":"ネットワーク越しに、ほかのシステムの機能やデータを呼び出して使うための窓口。","sup":false,"aka":[],"note":null},{"id":"T35-12","name":"アジャイル","desc":"短い期間で開発と確認を繰り返し、変化に合わせながら進める開発の方法。","sup":false,"aka":[],"note":null},{"id":"T35-13","name":"ウォーターフォール","desc":"要件定義から設計・開発・テストへと工程を順に進め、原則として前の工程に戻らない開発の方法。","sup":false,"aka":[],"note":null},{"id":"T35-14","name":"オープン・イノベーション","desc":"社外の技術やアイデアを取り入れたり外部と協力したりして、新しい価値を生み出すこと。","sup":false,"aka":[],"note":null},{"id":"T35-15","name":"クラウド","desc":"サーバや計算の資源を、インターネット経由で必要な分だけ使う仕組み。","sup":false,"aka":[],"note":null},{"id":"T35-16","name":"産学連携","desc":"企業と大学などの研究機関が協力して、研究開発や人材の育成を行うこと。","sup":false,"aka":[],"note":null},{"id":"T35-17","name":"ステークホルダーのニーズ","desc":"利用者・経営者・現場など、プロジェクトにかかわる人たちの要望。最初にすり合わせておく。","sup":false,"aka":[],"note":null},{"id":"T35-18","name":"データサイエンティスト","desc":"データの分析や機械学習を使って、ビジネスの課題を解決する専門家。","sup":false,"aka":[],"note":null},{"id":"T35-19","name":"他企業や他業種との連携","desc":"データや技術、ノウハウを持ち寄るために、ほかの会社やほかの業種と協力すること。","sup":false,"aka":[],"note":null}]},{"id":"T36","name":"データの収集・加工・分析・学習","short":"データの収集と加工","category":"AIの社会実装に向けて","area":"技術分野","lecture":{"number":20,"title":"AIプロジェクトの進め方とデータ","status":"planned","page":null},"terms":[{"id":"T36-1","name":"アノテーション","desc":"画像や文章などのデータに、正解のラベルや情報を付ける作業。","sup":false,"aka":[],"note":null},{"id":"T36-2","name":"オープンデータセット","desc":"誰でも使えるように公開されているデータセット。利用の条件（ライセンス）の確認が必要。","sup":false,"aka":[],"note":null},{"id":"T36-3","name":"コーパス","desc":"自然言語処理のために集めて整理した、大量の文章のデータ。","sup":false,"aka":[],"note":null},{"id":"T36-4","name":"データリーケージ","desc":"予測のときには使えないはずの情報（正解など）が学習データに紛れ込み、検証では精度が高いのに実際には精度が出なくなること。","sup":false,"aka":[],"note":null}]}]},{"id":"law","order":15,"domain":"social","color":"#9A450A","name":"AIに関する法律と契約","short":"法律と契約","priority":"high","badges":["revised"],"summary":"AIの開発と利用にかかわる法律（個人情報・著作権・特許・営業秘密・独占禁止）と、AIの開発やサービスの契約の考え方。データを集める・学習させる・提供するそれぞれの場面で、何に気をつけるかを押さえる。","themes":["個人情報保護法（個人情報・個人データ・保有個人データの違い、要配慮個人情報、匿名加工情報と仮名加工情報、第三者提供と委託）とGDPR","著作権法（著作物の要件、AI生成物の扱い、著作権侵害の判断）","特許法（発明の要件、発明者、職務発明）","不正競争防止法（営業秘密の3要件、限定提供データ）と独占禁止法","AI開発の契約（AI・データの利用に関する契約ガイドライン、請負と準委任、PoC、精度保証）とAIサービスの契約"],"keywords":["個人情報","要配慮個人情報","匿名加工情報","仮名加工情報","第三者提供","著作物","AI生成物","営業秘密","準委任契約","AI・データの利用に関する契約ガイドライン"],"examPoint":"具体的な事例が法律の対象になるか、どの契約の形が合うかを判断させる問題が多い。「最も不適切なものを選べ」の形に注意。","examTrap":"匿名加工情報は元に戻せない加工、仮名加工情報はほかの情報と照らし合わせれば個人を識別できる加工。請負は完成の義務あり、準委任は完成の義務なし。","priorityReason":"JDLA公式の例題Q17（G2022#2、個人情報保護法）と例題Q18（G2023#4、AI開発契約）が題材にしている。シラバス2024の改訂ポイントで、法律・倫理は「理解しておくべきポイントを明確化」された。キーワード数は40語。","items":["E01","E02","E03","E04","E05","E06","E07"],"subs":[{"id":"E01","name":"個人情報保護法","short":"個人情報保護法","category":"AIに関する法律と契約","area":"法律・倫理分野","lecture":{"number":22,"title":"個人情報保護法","status":"planned","page":null},"terms":[{"id":"E01-1","name":"GDPR","desc":"EUの一般データ保護規則。EU域内の個人データの扱いを厳しく定め、域外の事業者に適用されることもある。2018年に適用が始まった。","sup":false,"aka":[],"note":null},{"id":"E01-2","name":"仮名加工情報","desc":"ほかの情報と照らし合わせない限り、特定の個人を識別できないように加工した情報。社内での分析などに使いやすい。","sup":false,"aka":[],"note":null},{"id":"E01-3","name":"個人識別符号","desc":"指紋や顔の特徴のデータ、マイナンバーや旅券の番号など、それだけで特定の個人を識別できる符号。","sup":false,"aka":[],"note":null},{"id":"E01-4","name":"個人データ","desc":"個人情報をデータベースなどに整理したもののうち、それを構成する個人情報。","sup":false,"aka":[],"note":null},{"id":"E01-5","name":"個人情報","desc":"生きている個人に関する情報で、氏名などで特定の個人を識別できるもの、または個人識別符号を含むもの。","sup":false,"aka":[],"note":null},{"id":"E01-6","name":"第三者提供","desc":"個人データを、本人や委託先などではないほかの人に渡すこと。原則として本人の同意が必要。","sup":false,"aka":[],"note":null},{"id":"E01-7","name":"匿名加工情報","desc":"特定の個人を識別できず、元の個人情報に戻せないように加工した情報。一定の条件を守れば本人の同意なく第三者に提供できる。","sup":false,"aka":[],"note":null},{"id":"E01-8","name":"保有個人データ","desc":"事業者が、本人からの開示・訂正・利用停止などの求めに応じる権限をもつ個人データ。","sup":false,"aka":[],"note":null},{"id":"E01-9","name":"要配慮個人情報","desc":"人種・信条・病歴・犯罪の経歴など、不当な差別や偏見が生じないよう特に配慮が必要な個人情報。取得には原則として本人の同意が要る。","sup":false,"aka":[],"note":null},{"id":"E01-10","name":"利用目的","desc":"個人情報を何のために使うか。できるだけ具体的に決め、本人に知らせるか公表する必要がある。","sup":false,"aka":[],"note":null},{"id":"E01-11","name":"委託","desc":"個人データの取扱いを外部に任せること。第三者提供には当たらないが、委託先を監督する義務がある。","sup":false,"aka":[],"note":null}]},{"id":"E02","name":"著作権法","short":"著作権法","category":"AIに関する法律と契約","area":"法律・倫理分野","lecture":{"number":23,"title":"知的財産と競争のルール（著作権・特許・不正競争防止・独占禁止）","status":"planned","page":null},"terms":[{"id":"E02-1","name":"創作性","desc":"作った人の個性が表れていること。著作物として保護されるための要件の一つ。","sup":false,"aka":[],"note":null},{"id":"E02-2","name":"著作物","desc":"思想や感情を創作的に表現したもので、文芸・学術・美術・音楽の範囲に属するもの。","sup":false,"aka":[],"note":null},{"id":"E02-3","name":"AI生成物","desc":"AIが作った文章や画像など。人の創作的な関与がなければ、著作物とは認められにくいと考えられている。","sup":false,"aka":[],"note":null},{"id":"E02-4","name":"利用規約","desc":"サービスやデータを使うときの条件を定めた取り決め。学習に使うデータや、生成物の扱いを確かめる必要がある。","sup":false,"aka":[],"note":null},{"id":"E02-5","name":"著作権侵害","desc":"他人の著作物を、許可なく複製・公開などして権利を侵すこと。似ていること（類似性）と、元の作品をもとにしたこと（依拠性）が判断の要素になる。","sup":false,"aka":[],"note":null},{"id":"E02-6","name":"著作権","desc":"著作物を作った人がもつ、複製や公開などを独占的に行える権利。登録しなくても、創作した時点で発生する。","sup":false,"aka":[],"note":null}]},{"id":"E03","name":"特許法","short":"特許法","category":"AIに関する法律と契約","area":"法律・倫理分野","lecture":{"number":23,"title":"知的財産と競争のルール（著作権・特許・不正競争防止・独占禁止）","status":"planned","page":null},"terms":[{"id":"E03-1","name":"発明","desc":"自然法則を利用した技術的な思想の創作のうち、高度なもの。","sup":false,"aka":[],"note":null},{"id":"E03-2","name":"新規性","desc":"出願の前に、世の中に知られていないこと。特許を受けるための要件の一つ。","sup":false,"aka":[],"note":null},{"id":"E03-3","name":"進歩性","desc":"その分野の専門家が、すでにある技術から簡単には思いつけないこと。特許を受けるための要件の一つ。","sup":false,"aka":[],"note":null},{"id":"E03-4","name":"知的財産権","desc":"特許権・著作権・商標権など、人の知的な創作の成果を守る権利の総称。","sup":false,"aka":[],"note":null},{"id":"E03-5","name":"発明者","desc":"発明を実際に生み出した人。日本では人に限られ、AIは発明者になれないとされている。","sup":false,"aka":[],"note":null},{"id":"E03-6","name":"職務発明","desc":"従業員が仕事として行った発明。契約や社内の規則で、会社が特許を受ける権利を取得できる。","sup":false,"aka":[],"note":null},{"id":"E03-7","name":"特許権","desc":"発明を一定の期間（原則として出願から20年）、独占的に実施できる権利。","sup":false,"aka":[],"note":null}]},{"id":"E04","name":"不正競争防止法","short":"不正競争防止法","category":"AIに関する法律と契約","area":"法律・倫理分野","lecture":{"number":23,"title":"知的財産と競争のルール（著作権・特許・不正競争防止・独占禁止）","status":"planned","page":null},"terms":[{"id":"E04-1","name":"営業秘密","desc":"秘密として管理され（秘密管理性）、事業に役立ち（有用性）、世の中に知られていない（非公知性）情報。","sup":false,"aka":[],"note":null},{"id":"E04-2","name":"限定提供データ","desc":"特定の相手に限って提供される、電子的に管理された大量のデータ。不正な取得や使用が禁じられる。","sup":false,"aka":[],"note":null}]},{"id":"E05","name":"独占禁止法","short":"独占禁止法","category":"AIに関する法律と契約","area":"法律・倫理分野","lecture":{"number":23,"title":"知的財産と競争のルール（著作権・特許・不正競争防止・独占禁止）","status":"planned","page":null},"terms":[{"id":"E05-1","name":"競争制限","desc":"事業者が取り決めなどによって、市場での自由な競争を妨げること。","sup":false,"aka":[],"note":null},{"id":"E05-2","name":"公正競争阻害性","desc":"ある行為が、公正な競争を妨げるおそれがあること。不公正な取引方法に当たるかを判断するときの要素。","sup":false,"aka":[],"note":null}]},{"id":"E06","name":"AI開発委託契約","short":"AI開発委託契約","category":"AIに関する法律と契約","area":"法律・倫理分野","lecture":{"number":24,"title":"AI開発委託契約とAIサービス提供契約","status":"planned","page":null},"terms":[{"id":"E06-1","name":"AI・データの利用に関する契約ガイドライン","desc":"経済産業省が作った、AIの開発やデータの利用の契約の考え方とモデル契約をまとめた指針。開発をアセスメント・PoC・開発・追加学習の段階に分ける。","sup":false,"aka":["AI・データ契約ガイドライン"],"note":null},{"id":"E06-2","name":"NDA","desc":"取引の中で知った秘密の情報を、外部に漏らさないことを約束する契約（秘密保持契約）。","sup":false,"aka":[],"note":null},{"id":"E06-3","name":"請負契約","desc":"仕事の完成を約束し、その成果に対して報酬が支払われる契約。","sup":false,"aka":[],"note":null},{"id":"E06-4","name":"準委任契約","desc":"専門家として注意を尽くして仕事をすること（善管注意義務）を約束する契約。完成の義務はない。","sup":false,"aka":[],"note":null},{"id":"E06-5","name":"精度保証","desc":"AIの精度をあらかじめ保証すること。学習してみないと精度がわからないため、開発の契約で保証するのは難しい。","sup":false,"aka":[],"note":null},{"id":"E06-6","name":"PoC","desc":"本開発の前に、技術的に実現できるかを確かめる段階。ガイドラインでは準委任契約が合うとされる。","sup":false,"aka":[],"note":null},{"id":"E06-7","name":"保守契約","desc":"開発したあとのシステムやモデルの保守・運用について決める契約。再学習の扱いなども決めておく。","sup":false,"aka":[],"note":null}]},{"id":"E07","name":"AIサービス提供契約","short":"AIサービス提供契約","category":"AIに関する法律と契約","area":"法律・倫理分野","lecture":{"number":24,"title":"AI開発委託契約とAIサービス提供契約","status":"planned","page":null},"terms":[{"id":"E07-1","name":"SaaS","desc":"ソフトウェアを、インターネット経由のサービスとして提供する形。","sup":false,"aka":[],"note":null},{"id":"E07-2","name":"データ利用権","desc":"契約に基づいて、データを使える範囲や条件を定めた権限。","sup":false,"aka":[],"note":null},{"id":"E07-3","name":"利用規約","desc":"AIサービスの使い方や、入力したデータ・出力の扱い、責任の範囲などを定めた取り決め。","sup":false,"aka":[],"note":null},{"id":"E07-4","name":"精度保証","desc":"AIサービスの出力の精度を保証すること。利用規約では保証しないと定めることが多い。","sup":false,"aka":[],"note":null}]}]},{"id":"ethics","order":16,"domain":"moral","color":"#B0305C","name":"AI倫理の原則とリスク（ガイドライン・プライバシー・公平性・安全性・悪用・透明性）","short":"倫理の原則とリスク","shortLines":["倫理の原則","とリスク"],"priority":"high","badges":["revised"],"summary":"AIを使うときに守るべき原則と、AIが引き起こしうるリスク。法律で決まっていないことも、ガイドライン（ソフトロー）や設計の工夫で対処する考え方を押さえる。","themes":["ハードローとソフトロー、リスクベースアプローチ、AI倫理の価値原則","プライバシー（プライバシー・バイ・デザイン、カメラ画像利活用ガイドブック）","公平性（データの偏り、サンプリングバイアス、センシティブ属性と代理変数）","安全性とセキュリティ（敵対的攻撃、データ汚染、モデル窃取）","悪用（ディープフェイク、フェイクニュース）と透明性（説明可能性、データの来歴）"],"keywords":["ソフトロー","リスクベースアプローチ","プライバシー・バイ・デザイン","アルゴリズムバイアス","センシティブ属性","代理変数","Adversarial Attack (Adversarial Examples)","データ汚染","ディープフェイク","説明可能性"],"examPoint":"事例を示して、どの倫理的な問題に当たるか・どう対処すべきかを問う。「最も不適切なものを選べ」の形が多い。","examTrap":"センシティブ属性を学習データから外しても、代理変数を通じて差別が起きることがある。ソフトローは法的な拘束力がない。","priorityReason":"JDLA公式の例題Q19（G2022#1、顔認識技術の倫理的な問題）が題材にしている。シラバス2024の改訂ポイントで法律・倫理が明確化され、AI倫理・AIガバナンスは11項目に増えた。キーワード数は25語。","items":["E08","E09","E10","E11","E12","E13"],"subs":[{"id":"E08","name":"国内外のガイドライン","short":"国内外のガイドライン","category":"AI倫理・AIガバナンス","area":"法律・倫理分野","lecture":{"number":25,"title":"AI倫理の原則・国内外のガイドライン・プライバシー・公平性","status":"planned","page":null},"terms":[{"id":"E08-1","name":"AI倫理","desc":"AIを開発・利用するときに守るべき価値観や原則。人権・公平性・透明性などを含む。","sup":false,"aka":[],"note":null},{"id":"E08-2","name":"AIガバナンス","desc":"AIのリスクを適切に管理しながら価値を引き出すための、組織や社会のルールと仕組み。","sup":false,"aka":[],"note":null},{"id":"E08-3","name":"価値原則","desc":"人間中心・公平性・プライバシーなど、AIの開発や利用で大切にすべき基本的な価値をまとめたもの。","sup":false,"aka":[],"note":null},{"id":"E08-4","name":"ハードロー","desc":"法律のように、守らなければ罰則などがある、拘束力のある決まり。","sup":false,"aka":[],"note":null},{"id":"E08-5","name":"ソフトロー","desc":"ガイドラインや業界の自主的な基準のように、法的な拘束力はないが守ることが期待される決まり。","sup":false,"aka":[],"note":null},{"id":"E08-6","name":"リスクベースアプローチ","desc":"AIのリスクの大きさに応じて、求める対策や規制の強さを変える考え方。EUのAI法などで採られている。","sup":false,"aka":[],"note":null}]},{"id":"E09","name":"プライバシー","short":"プライバシー","category":"AI倫理・AIガバナンス","area":"法律・倫理分野","lecture":{"number":25,"title":"AI倫理の原則・国内外のガイドライン・プライバシー・公平性","status":"planned","page":null},"terms":[{"id":"E09-1","name":"カメラ画像利活用ガイドブック","desc":"カメラの画像を使う事業者が、生活者のプライバシーに配慮するための考え方をまとめた指針。経済産業省と総務省が作った。","sup":false,"aka":[],"note":null},{"id":"E09-2","name":"プライバシー・バイ・デザイン","desc":"企画・設計の段階から、プライバシーの保護を組み込んでおく考え方。","sup":false,"aka":[],"note":null}]},{"id":"E10","name":"公平性","short":"公平性","category":"AI倫理・AIガバナンス","area":"法律・倫理分野","lecture":{"number":25,"title":"AI倫理の原則・国内外のガイドライン・プライバシー・公平性","status":"planned","page":null},"terms":[{"id":"E10-1","name":"アルゴリズムバイアス","desc":"アルゴリズムやデータの偏りによって、特定の集団に不公平な結果が出ること。","sup":false,"aka":[],"note":null},{"id":"E10-2","name":"公平性の定義","desc":"何をもって公平とするかの基準。集団ごとの結果をそろえる、条件が同じなら扱いをそろえるなど複数あり、同時には満たせないこともある。","sup":false,"aka":[],"note":null},{"id":"E10-3","name":"サンプリングバイアス","desc":"データを集める段階の偏りで、集めたデータが本来の対象全体を正しく代表していないこと。","sup":false,"aka":[],"note":null},{"id":"E10-4","name":"センシティブ属性","desc":"性別・人種・宗教など、差別につながるおそれがあり、扱いに注意が必要な属性。","sup":false,"aka":[],"note":null},{"id":"E10-5","name":"代理変数","desc":"センシティブ属性と強く関係する別の変数（住んでいる地域など）。直接使わなくても、これを通じて差別が生じることがある。","sup":false,"aka":[],"note":null},{"id":"E10-6","name":"データの偏り","desc":"学習データの中身が、一部の集団や状況にかたよっていること。AIの判断の偏りの原因になる。","sup":false,"aka":[],"note":null}]},{"id":"E11","name":"安全性とセキュリティ","short":"安全性とセキュリティ","category":"AI倫理・AIガバナンス","area":"法律・倫理分野","lecture":{"number":26,"title":"安全性・悪用・透明性・民主主義","status":"planned","page":null},"terms":[{"id":"E11-1","name":"Adversarial Attack (Adversarial Examples)","desc":"人にはわからないほど小さな細工を入力に加えて、AIに誤った判断をさせる攻撃（敵対的攻撃）。","sup":false,"aka":[],"note":null},{"id":"E11-2","name":"セキュリティ・バイ・デザイン","desc":"企画・設計の段階から、セキュリティの対策を組み込んでおく考え方。","sup":false,"aka":[],"note":null},{"id":"E11-3","name":"データ汚染","desc":"学習データに不正なデータを混ぜて、AIの判断をゆがめる攻撃。","sup":false,"aka":[],"note":null},{"id":"E11-4","name":"データ窃取","desc":"AIの出力を分析するなどして、学習に使われたデータを盗み出す攻撃。","sup":false,"aka":[],"note":null},{"id":"E11-5","name":"モデル窃取","desc":"AIへの問い合わせとその答えを大量に集めて、元のモデルと同じようにふるまうモデルを作る攻撃。","sup":false,"aka":[],"note":null},{"id":"E11-6","name":"モデル汚染","desc":"学習済みのモデルそのものに細工をして、特定の条件で誤った動作をさせる攻撃。","sup":false,"aka":[],"note":null}]},{"id":"E12","name":"悪用","short":"悪用","category":"AI倫理・AIガバナンス","area":"法律・倫理分野","lecture":{"number":26,"title":"安全性・悪用・透明性・民主主義","status":"planned","page":null},"terms":[{"id":"E12-1","name":"ディープフェイク","desc":"ディープラーニングで作った、本物と見分けにくい偽の映像や音声。","sup":false,"aka":[],"note":null},{"id":"E12-2","name":"フェイクニュース","desc":"事実でない情報を、ニュースのように装って広めるもの。生成AIで大量に作られるおそれがある。","sup":false,"aka":[],"note":null}]},{"id":"E13","name":"透明性","short":"透明性","category":"AI倫理・AIガバナンス","area":"法律・倫理分野","lecture":{"number":26,"title":"安全性・悪用・透明性・民主主義","status":"planned","page":null},"terms":[{"id":"E13-1","name":"データの来歴","desc":"データがどこで、どのように作られ、どう加工されてきたかの記録。","sup":false,"aka":[],"note":null},{"id":"E13-2","name":"説明可能性","desc":"AIがなぜその結果を出したのかを、人が理解できるように説明できること。","sup":false,"aka":[],"note":null},{"id":"E13-3","name":"ブラックボックス","desc":"内部の仕組みが複雑で、なぜその判断になったのかが外からわからない状態。","sup":false,"aka":[],"note":null}]}]},{"id":"society","order":17,"domain":"moral","color":"#9C2C6C","name":"社会への影響とAIガバナンス（民主主義・環境・労働・その他の価値・ガバナンス）","short":"社会とガバナンス","shortLines":["社会と","ガバナンス"],"priority":"mid","badges":["revised"],"summary":"AIが社会全体に与える影響（民主主義・環境・働き方など）と、組織がAIを責任をもって使うための仕組み（AIガバナンス）。シラバス2024で大きく広がった範囲。","themes":["民主主義への影響（エコーチェンバー・フィルターバブル・フェイクニュース）","環境保護（モデルの学習の電力消費と気候変動）","労働政策（AIとの協働・スキルの喪失・労働力不足）","その他の重要な価値（インクルージョン・軍事利用・死者への敬意・人間の自律性）","AIガバナンス（AIポリシー・倫理アセスメント・人間の関与・監査・モニタリング・トレーサビリティ）"],"keywords":["エコーチェンバー","フィルターバブル","モデル学習の電力消費","スキルの喪失","人間の自律性","倫理アセスメント","人間の関与","トレーサビリティ"],"examPoint":"現象の名前と中身の組合せ（エコーチェンバーとフィルターバブルなど）や、ガバナンスの取組みとして適切なものを問う。","examTrap":"エコーチェンバーは似た意見の人どうしの交流で考えが強まる現象、フィルターバブルはアルゴリズムで自分好みの情報に囲まれる状態。","priorityReason":"JDLA公式の例題Q20（G2024#4、AIと地球環境）が題材にしている。シラバス2024で民主主義・環境保護・労働政策などの項目が加わった。キーワード数は22語で、少なめ。","items":["E14","E15","E16","E17","E18"],"subs":[{"id":"E14","name":"民主主義","short":"民主主義","category":"AI倫理・AIガバナンス","area":"法律・倫理分野","lecture":{"number":26,"title":"安全性・悪用・透明性・民主主義","status":"planned","page":null},"terms":[{"id":"E14-1","name":"エコーチェンバー","desc":"似た意見の人とばかりつながることで、同じ意見が反響するように強まっていく現象。","sup":false,"aka":[],"note":null},{"id":"E14-2","name":"フィルターバブル","desc":"推薦のアルゴリズムによって、自分の好みに合う情報ばかりに囲まれてしまう状態。","sup":false,"aka":[],"note":null},{"id":"E14-3","name":"フェイクニュース","desc":"偽の情報が広まることで、人々の判断や選挙などの民主的な仕組みがゆがめられるおそれ。","sup":false,"aka":[],"note":null}]},{"id":"E15","name":"環境保護","short":"環境保護","category":"AI倫理・AIガバナンス","area":"法律・倫理分野","lecture":{"number":27,"title":"環境・労働・その他の価値とAIガバナンス","status":"planned","page":null},"terms":[{"id":"E15-1","name":"気候変動","desc":"地球の気温の上昇などの、長い期間の気候の変化。AIの電力消費による温室効果ガスの排出が課題になっている。","sup":false,"aka":[],"note":null},{"id":"E15-2","name":"モデル学習の電力消費","desc":"大規模なモデルの学習に必要な、大量の電力。環境への負荷として問題になっている。","sup":false,"aka":[],"note":null}]},{"id":"E16","name":"労働政策","short":"労働政策","category":"AI倫理・AIガバナンス","area":"法律・倫理分野","lecture":{"number":27,"title":"環境・労働・その他の価値とAIガバナンス","status":"planned","page":null},"terms":[{"id":"E16-1","name":"AIとの協働","desc":"人がAIに仕事をまかせきりにするのではなく、役割を分けて一緒に働くこと。","sup":false,"aka":[],"note":null},{"id":"E16-2","name":"スキルの喪失","desc":"AIに頼ることで、人がもともと持っていた技能や判断力が衰えてしまうこと。","sup":false,"aka":[],"note":null},{"id":"E16-3","name":"労働力不足","desc":"少子高齢化などで働き手が足りなくなること。AIの活用が期待される背景の一つ。","sup":false,"aka":[],"note":null}]},{"id":"E17","name":"その他の重要な価値","short":"その他の重要な価値","category":"AI倫理・AIガバナンス","area":"法律・倫理分野","lecture":{"number":27,"title":"環境・労働・その他の価値とAIガバナンス","status":"planned","page":null},"terms":[{"id":"E17-1","name":"インクルージョン","desc":"年齢・障害・言語などにかかわらず、誰もがAIの恩恵を受けられ、取り残されないようにすること。","sup":false,"aka":[],"note":null},{"id":"E17-2","name":"軍事利用","desc":"AIを兵器などの軍事目的に使うこと。人の判断を通さずに攻撃する自律型の兵器が議論になっている。","sup":false,"aka":[],"note":null},{"id":"E17-3","name":"死者への敬意","desc":"亡くなった人の声や姿をAIで再現するときなどに、故人の尊厳や遺族の気持ちに配慮すること。","sup":false,"aka":[],"note":null},{"id":"E17-4","name":"人間の自律性","desc":"人が自分の意思で判断し、決められること。AIが人の判断を不当に操作しないよう配慮が求められる。","sup":false,"aka":[],"note":null}]},{"id":"E18","name":"AIガバナンス","short":"AIガバナンス","category":"AI倫理・AIガバナンス","area":"法律・倫理分野","lecture":{"number":27,"title":"環境・労働・その他の価値とAIガバナンス","status":"planned","page":null},"terms":[{"id":"E18-1","name":"AIポリシー","desc":"組織が、AIをどのような方針で開発・利用するかを定めたもの。","sup":false,"aka":[],"note":null},{"id":"E18-2","name":"ダイバーシティ","desc":"開発チームなどに多様な背景の人を入れ、偏った判断を防ぐこと。","sup":false,"aka":[],"note":null},{"id":"E18-3","name":"AIに対する監査","desc":"AIのシステムが方針や規則に沿って適切に作られ、使われているかを点検すること。","sup":false,"aka":[],"note":null},{"id":"E18-4","name":"倫理アセスメント","desc":"AIを開発・導入する前に、倫理的なリスクを洗い出して評価すること。","sup":false,"aka":[],"note":null},{"id":"E18-5","name":"人間の関与","desc":"AIの判断の過程に人がかかわり、最終的な判断や監督を行うこと（ヒューマン・イン・ザ・ループ）。","sup":false,"aka":[],"note":null},{"id":"E18-6","name":"モニタリング","desc":"運用中のAIの性能や出力の偏りなどを、続けて監視すること。","sup":false,"aka":[],"note":null},{"id":"E18-7","name":"再現性","desc":"同じ条件で、同じ結果が得られること。AIの検証や説明に必要になる。","sup":false,"aka":[],"note":null},{"id":"E18-8","name":"トレーサビリティ","desc":"データやモデルの作られ方、判断の過程を、後からたどれるようにすること。","sup":false,"aka":[],"note":null}]}]}],"themes":[{"id":"ml-dl","title":"機械学習からディープラーニングへ","core":"r-ml-nn"},{"id":"parts-train","title":"部品と学習の仕組み","core":"r-nn-train"},{"id":"cnn-vision","title":"畳み込みと画像認識","core":"r-cnn-vision"},{"id":"attn-llm","title":"Attentionと大規模言語モデル","core":"r-seq-nlp"},{"id":"repr-gen","title":"表現の学習と生成AI","core":"r-repr-gen"},{"id":"eval-train","title":"評価と過学習対策","core":"r-eval-train"},{"id":"law-ethics","title":"法律と倫理（ハードローとソフトロー）","core":"r-law-ethics"}],"relations":[{"id":"r-ml-nn","from":"ml","to":"nn","dir":"one","core":true,"theme":"ml-dl","label":"特徴の作り方まで学ぶ","why":"ディープラーニングは機械学習の一種。従来の機械学習では人が特徴量を設計したが、多層のニューラルネットワークは特徴の取り出し方までデータから学ぶ。","example":"画像の分類で、従来は人が「輪郭」や「色の分布」を特徴として設計していたが、CNNは画素から直接、特徴を学ぶ。","exam":"例題Q4（G2022#3）は機械学習の基本の手法を題材にしている。古典的な機械学習とディープラーニングの違いは、シラバスの項目6の目標に挙がっている。"},{"id":"r-nn-train","from":"nn","to":"train","dir":"both","core":true,"theme":"parts-train","label":"部品の選び方が学習を左右","why":"活性化関数や誤差関数の選び方で、誤差逆伝播法で伝わる勾配の大きさが決まる。逆に、学習がうまく進むように部品が改良されてきた。","example":"シグモイド関数は微分が小さいため層が深いと勾配消失が起きやすく、ReLU関数に置き換えると学習が進みやすくなる。","exam":"例題Q7（G2022#1）で勾配消失問題が起きやすい条件が、例題Q6（G2024#6）でKL情報量が問われた。"},{"id":"r-cnn-vision","from":"cnn","to":"vision","dir":"one","core":true,"theme":"cnn-vision","label":"畳み込みが画像認識の土台","why":"画像認識のモデルの多くは、畳み込み層・プーリング層・正規化層・スキップ結合を組み合わせて作られている。","example":"ResNetはスキップ結合で152層を実現し、MobileNetはDepthwise Separable Convolutionで計算を減らした。","exam":"例題Q3（G2022#1）でスキップ結合のResNet、例題Q8（G2024#4）でパディング、例題Q9（G2024#4）でGAPが問われた。"},{"id":"r-seq-nlp","from":"seq","to":"nlp","dir":"one","core":true,"theme":"attn-llm","label":"TransformerがLLMの土台","why":"RNNとSeq2Seqで始まった系列の処理は、AttentionとTransformerによって大規模化でき、BERTや大規模言語モデルが生まれた。","example":"BERTはTransformerのエンコーダを、多くの大規模言語モデルはTransformerのデコーダをもとにしている。","exam":"例題Q11（G2024#4）で、大規模言語モデルの前提となるスケーリング則が問われた。"},{"id":"r-repr-gen","from":"repr","to":"gen","dir":"one","core":true,"theme":"repr-gen","label":"潜在表現から生成へ","why":"オートエンコーダはデータを少ない次元の表現に圧縮して学ぶ。VAEはその表現を確率分布として扱い、そこから新しいデータを作れるようにした。","example":"VAEの潜在空間から点を取り出してデコーダに通すと、学習データにない新しい画像ができる。","exam":"JDLA公式の例題で直接の題材になった問はない。シラバス2024でVQ-VAE・Diffusion Modelなどが追加された。"},{"id":"r-eval-train","from":"eval","to":"train","dir":"both","core":true,"theme":"eval-train","label":"過学習を見つけて防ぐ","why":"評価で過学習を見つけ、正則化や早期終了で防ぐ。どれだけ防げたかは、また評価で確かめる。","example":"検証データの誤差が上がり始めた時点で学習を止める（早期終了）。L2正則化で重みを小さくして汎化性能を上げる。","exam":"JDLA公式の例題で直接の題材になった問はない。過学習の説明はシラバスの項目10の目標に挙がっている。"},{"id":"r-law-ethics","from":"law","to":"ethics","dir":"both","core":true,"theme":"law-ethics","label":"ハードローとソフトロー","why":"法律（ハードロー）で決まっていることを守るだけでは足りず、プライバシーや公平性はガイドライン（ソフトロー）や設計の工夫で補う。","example":"カメラの画像の利用では、個人情報保護法を守ったうえで、カメラ画像利活用ガイドブックに沿って生活者に配慮する。","exam":"例題Q17（G2022#2）で個人情報保護法、例題Q19（G2022#1）で顔認識技術の倫理的な問題が問われた。"},{"id":"r-aidef-history","from":"ai-def","to":"history","dir":"one","theme":"ml-dl","label":"難問がブームを終わらせた","why":"トイ・プロブレムしか解けないこと、知識獲得のボトルネック、フレーム問題などが、それぞれのAIブームの限界になった。","example":"第2次ブームのエキスパートシステムは、専門家の知識をルールに書き起こす難しさから行き詰まった。","exam":"例題Q1（G2024#4）でフレーム問題、例題Q2（G2022#1）でエキスパートシステムが問われた。"},{"id":"r-history-ml","from":"history","to":"ml","dir":"one","theme":"ml-dl","label":"第3次ブームの主役へ","why":"ビッグデータと計算機の進歩で、ルールを人が書く方法から、データから学ぶ機械学習が主流になった。","example":"スパムフィルタやレコメンデーションは、大量の履歴のデータから学ぶ機械学習で実用になった。","exam":"例題Q5（G2024#6）でレコメンデーションの手法が問われた。"},{"id":"r-nn-cnn","from":"nn","to":"cnn","dir":"one","theme":"cnn-vision","label":"全結合から畳み込みへ","why":"画像を全結合層だけで扱うとパラメータが膨大になる。畳み込み層は小さなフィルタを使い回して、位置の情報を保ったまま特徴を取り出す。","example":"CNNの出力層では、全結合層の代わりにGAPを使ってパラメータを減らすことがある。","exam":"例題Q9（G2024#4）で、全結合層に代わって使われるGAPが問われた。"},{"id":"r-ml-gen","from":"ml","to":"gen","dir":"one","theme":"repr-gen","label":"強化学習×ディープラーニング","why":"強化学習の行動価値関数や方策を、深層ニューラルネットワークで表すことで、画像などの複雑な入力でも学習できるようになった。","example":"DQNはQ学習の行動価値関数をCNNで近似し、Atariのゲームを画面から学んだ。","exam":"JDLA公式の例題で直接の題材になった問はない。"},{"id":"r-nlp-practical","from":"nlp","to":"practical","dir":"both","theme":"attn-llm","label":"事前学習して使い回す","why":"大規模言語モデルや基盤モデルは、大量のデータで事前学習しておき、ファインチューニングやZero-shotで個別の課題に使い回す。","example":"BERTを事前学習しておき、少しのラベル付きデータで感情分析向けにファインチューニングする。","exam":"例題Q13（G2024#6）でZero-shotが問われた。"},{"id":"r-repr-practical","from":"repr","to":"practical","dir":"one","theme":"repr-gen","label":"事前学習の考え方の源流","why":"積層オートエンコーダで層ごとに事前学習した考え方は、事前学習済みモデルと転移学習につながっている。","example":"ラベルのない大量のデータで特徴を学んでおき、少しのラベル付きデータで本来の課題を学習する。","exam":"JDLA公式の例題で直接の題材になった問はない。"},{"id":"r-eval-project","from":"eval","to":"project","dir":"one","theme":"eval-train","label":"正しい評価の設計","why":"検証の方法や評価の指標を誤ると、実際に使ったときの性能を見誤る。データの分け方はプロジェクトの段階で決めておく。","example":"未来のデータを使って過去を予測するようにデータを分けてしまうと、データリーケージで精度が高く見える。","exam":"例題Q14（G2022#1）でデータリーケージの影響、例題Q15（G2022#1）で相関などの統計の指標が問われた。"},{"id":"r-project-ethics","from":"project","to":"ethics","dir":"one","theme":"law-ethics","label":"データの偏りが不公平を生む","why":"データの集め方やアノテーションに偏りがあると、学習したAIの判断も偏り、公平性の問題になる。","example":"ある集団のデータが少ないまま学習すると、その集団で認識の精度が下がる。","exam":"例題Q19（G2022#1）で、顔認識の精度が集団によって違う問題が取り上げられた。"},{"id":"r-practical-ethics","from":"practical","to":"ethics","dir":"one","theme":"law-ethics","label":"説明可能性を技術で支える","why":"AIの判断の理由を示すことは透明性の原則にかかわる。Grad-CAMやSHAPなどの説明の手法が、それを技術的に支える。","example":"画像の診断AIで、Grad-CAMで判断の根拠になった部分を示し、医師が確かめられるようにする。","exam":"JDLA公式の例題で直接の題材になった問はない。"},{"id":"r-nlp-law","from":"nlp","to":"law","dir":"one","theme":"law-ethics","label":"生成AIと著作権","why":"生成AIの学習データや生成物の扱いは、著作権法や利用規約に照らして判断する必要がある。","example":"生成した画像が既存の作品によく似ていて、元の作品をもとにしたと言える場合は、著作権侵害になりうる。","exam":"JDLA公式の例題で直接の題材になった問はない。シラバスの項目「著作権法」のキーワードにAI生成物・利用規約が含まれる。"},{"id":"r-ethics-society","from":"ethics","to":"society","dir":"one","theme":"law-ethics","label":"原則をガバナンスで実行する","why":"AI倫理の原則は、組織のAIポリシー・倫理アセスメント・監査・モニタリングといったガバナンスの仕組みで実行される。","example":"開発の前に倫理アセスメントを行い、運用中は出力の偏りをモニタリングして、必要なら人が判断に関与する。","exam":"例題Q20（G2024#4）で、AIと地球環境の課題が問われた。"}],"tables":{"compare":{"title":"従来の機械学習とディープラーニングの違い","columns":["観点","従来の機械学習","ディープラーニング","試験での着眼点"],"rows":[["特徴量の作り方","人が設計する（特徴量エンジニアリング）","データから自動で学ぶ","「特徴量を自動で獲得する」がディープラーニングの特徴"],["必要なデータ量","比較的少なくても学習できる","大量のデータが必要になりやすい","ビッグデータが第3次ブームの背景"],["計算資源","CPUでも十分なことが多い","GPU・TPUで大量の並列計算を行う","GPUが学習に向く理由（並列計算）"],["得意なデータ","表形式の構造化データ","画像・音声・文章などの非構造化データ","画像認識・音声認識・自然言語処理での成功"],["解釈のしやすさ","決定木や線形回帰などは理由を説明しやすい","ブラックボックスになりやすく、説明の手法（Grad-CAM・SHAPなど）が要る","説明可能AI（XAI）と透明性"],["代表的な手法","線形回帰・ロジスティック回帰・SVM・決定木・ランダムフォレスト・k-means法","CNN・RNN・LSTM・Transformer・GAN・VAE","手法がどちらに属するかの区別"],["学習の難しさ","ハイパーパラメータが比較的少ない","勾配消失・過学習などへの対策（正規化・正則化・最適化手法）が要る","勾配消失問題とその対策の流れ"]]},"pairs":{"title":"似た概念の見分け方","items":[{"id":"p-learning-types","title":"教師あり学習／教師なし学習／強化学習","items":[["教師あり学習","正解（ラベル）つきのデータから、入力と正解の関係を学ぶ"],["教師なし学習","正解のないデータから、まとまりや構造を見つける"],["強化学習","試行錯誤で行動し、報酬の合計が最大になる行動の選び方を学ぶ"]],"point":"正解があるか、報酬で学ぶかで区別する。顧客のグループ分けは教師なし、売上の予測は教師あり。","fields":["ml"]},{"id":"p-reg-cls","title":"回帰問題／分類問題","items":[["回帰問題","連続した数値を予測する（売上・気温）"],["分類問題","どのクラスに属するかを予測する（迷惑メールかどうか）"]],"point":"ロジスティック回帰は名前に「回帰」とあるが、分類に使う。","fields":["ml"]},{"id":"p-bag-boost","title":"バギング／ブースティング","items":[["バギング","複数のモデルを並列に独立して学習し、結果を平均や多数決でまとめる（ランダムフォレスト）"],["ブースティング","モデルを順番に学習し、前のモデルの間違いを次のモデルが補う（勾配ブースティング）"]],"point":"「並列で独立」がバギング、「順番に補う」がブースティング。","fields":["ml"]},{"id":"p-cf-cb","title":"協調フィルタリング／コンテンツベースフィルタリング","items":[["協調フィルタリング","好みが似たほかの利用者の行動の履歴から推薦する"],["コンテンツベースフィルタリング","商品そのものの特徴と利用者の好みを照らし合わせて推薦する"]],"point":"新しい商品や利用者で困る（コールドスタート問題）のは協調フィルタリング。","fields":["ml"]},{"id":"p-qlearn-sarsa","title":"Q学習／SARSA","items":[["Q学習","次の状態で最も大きいQ値を使って更新する（方策オフ型）"],["SARSA","実際に選んだ次の行動のQ値を使って更新する（方策オン型）"]],"point":"更新に「最大のQ値」を使うか、「実際に選んだ行動のQ値」を使うか。","fields":["ml"]},{"id":"p-precision-recall","title":"適合率／再現率","items":[["適合率","陽性と予測したもののうち、本当に陽性だった割合"],["再現率","本当に陽性のもののうち、陽性と予測できた割合"]],"point":"見逃しを減らしたい（病気の検査など）なら再現率、誤検知を減らしたいなら適合率を重視する。","fields":["eval"]},{"id":"p-mse-mae","title":"MSE／RMSE／MAE","items":[["MSE","誤差の2乗の平均。大きな誤差を重く見る"],["RMSE","MSEの平方根。元のデータと同じ単位になる"],["MAE","誤差の絶対値の平均。外れ値の影響を受けにくい"]],"point":"外れ値に強いのはMAE。単位をそろえたいならRMSE。","fields":["eval"]},{"id":"p-cov-corr","title":"共分散／相関係数／偏相関係数","items":[["共分散","偏差の積の平均。単位によって大きさが変わる"],["相関係数","共分散を標準偏差で割り、−1〜1にそろえたもの"],["偏相関係数","ほかの変数の影響を取り除いた相関"]],"point":"「−1〜1」なら相関係数。疑似相関を見抜くには偏相関係数。","fields":["eval"]},{"id":"p-sigmoid-relu","title":"シグモイド関数／tanh関数／ReLU関数","items":[["シグモイド関数","出力0〜1、微分の最大値0.25。勾配消失が起きやすい"],["tanh関数","出力−1〜1、微分の最大値1"],["ReLU関数","正ならそのまま、負なら0。勾配消失が起きにくい"]],"point":"微分の最大値（0.25と1）と、出力の範囲をセットで覚える。","fields":["nn"]},{"id":"p-l1-l2","title":"L1正則化／L2正則化","items":[["L1正則化","重みの絶対値の和に罰。不要な重みが0になりやすい（ラッソ回帰）"],["L2正則化","重みの2乗の和に罰。重み全体を小さくする（リッジ回帰）"]],"point":"特徴の選択（スパース）になるのはL1。","fields":["train"]},{"id":"p-epoch-iter","title":"エポック／イテレーション／バッチ学習","items":[["エポック","学習データ全体を1回使い切る単位"],["イテレーション","パラメータを1回更新する単位（ミニバッチ1つ分）"],["バッチ学習","データ全体で勾配を計算してまとめて更新する"]],"point":"1000件をミニバッチ100件で学習すると、1エポック＝10イテレーション。","fields":["train"]},{"id":"p-optimizers","title":"モーメンタム／AdaGrad／RMSprop／Adam","items":[["モーメンタム","前回の更新の向きを引き継いで振動を抑える"],["AdaGrad","よく更新されたパラメータの学習率を小さくする（小さくなりすぎる）"],["RMSprop","勾配の2乗の移動平均で、AdaGradの欠点を改善する"],["Adam","モーメンタムとRMSpropを組み合わせる"]],"point":"「何の欠点を何で直したか」の流れで覚える。","fields":["train"]},{"id":"p-norms","title":"バッチ正規化／レイヤー正規化／インスタンス正規化／グループ正規化","items":[["バッチ正規化","ミニバッチの中で、チャネルごとにそろえる"],["レイヤー正規化","1つのデータの中で、層全体をそろえる（RNN・Transformer）"],["インスタンス正規化","1つのデータの1つのチャネルごとにそろえる（スタイル変換）"],["グループ正規化","1つのデータの中で、チャネルのグループごとにそろえる"]],"point":"「どの範囲で平均と分散をとるか」で区別する。ミニバッチが小さいとバッチ正規化は不安定。","fields":["cnn"]},{"id":"p-rnn-lstm-gru","title":"RNN／LSTM／GRU","items":[["RNN","前の時刻の情報を引き継ぐ。長い系列では勾配消失が起きやすい"],["LSTM","入力・忘却・出力の3つのゲートと記憶セルで、長い期間の情報を保つ"],["GRU","リセットと更新の2つのゲートに簡単にしたもの"]],"point":"ゲートの数（LSTMは3つ、GRUは2つ）と、記憶セルの有無。","fields":["seq"]},{"id":"p-attention-types","title":"Self-Attention／Source-Target Attention","items":[["Self-Attention","同じ系列の中の要素どうしの関係を計算する"],["Source-Target Attention","出力側が入力側のどこに注目するかを計算する"]],"point":"クエリとキー・バリューが同じ系列から来るならSelf-Attention。","fields":["seq"]},{"id":"p-mix-cut","title":"Cutout／Random Erasing／Mixup／CutMix","items":[["Cutout","画像の一部を四角く塗りつぶす"],["Random Erasing","ランダムな四角い領域をランダムな値で消す"],["Mixup","2つの画像全体を重ねて、ラベルも混ぜる"],["CutMix","別の画像の一部を貼り付け、ラベルも面積の割合で混ぜる"]],"point":"消すだけ（Cutout・Random Erasing）か、混ぜる（Mixup・CutMix）か。","fields":["repr"]},{"id":"p-segmentation","title":"物体検出／セマンティック／インスタンス／パノプティック","items":[["物体検出","物体を四角い枠で囲み、種類を判定する"],["セマンティックセグメンテーション","画素ごとに種類を付ける。同じ種類の物体は区別しない"],["インスタンスセグメンテーション","物体ごとに区別して形を切り出す"],["パノプティックセグメンテーション","背景も含めて、両方を組み合わせる"]],"point":"「人が3人いる」を3人分に分けられるのがインスタンス。","fields":["vision"]},{"id":"p-cbow-skipgram","title":"CBOW／スキップグラム","items":[["CBOW","周りの単語から、真ん中の単語を予測する"],["スキップグラム","真ん中の単語から、周りの単語を予測する"]],"point":"どちらもword2vecの学習方法。予測の向きが逆。","fields":["nlp"]},{"id":"p-gan-vae-diffusion","title":"GAN／VAE／Diffusion Model","items":[["GAN","生成器と識別器を競わせて学習する"],["VAE","潜在空間の確率分布からサンプリングして生成する"],["Diffusion Model","ノイズを加える過程を逆にたどって、ノイズからデータを復元する"]],"point":"「競わせる」がGAN、「潜在変数の分布」がVAE、「ノイズを取り除いていく」が拡散モデル。","fields":["gen","repr"]},{"id":"p-pix-cycle","title":"Pix2Pix／CycleGAN","items":[["Pix2Pix","対になった画像のデータが必要"],["CycleGAN","対になったデータがなくても変換できる"]],"point":"「対のデータが要るか」で区別する。","fields":["gen"]},{"id":"p-shot","title":"Zero-shot／One-shot／Few-shot","items":[["Zero-shot","例を1つも与えずに対応する"],["One-shot","1つの例だけで対応する"],["Few-shot","少しの例で対応する"]],"point":"与える例の数で区別する。","fields":["nlp","practical"]},{"id":"p-compress","title":"蒸留／プルーニング／量子化","items":[["蒸留","大きなモデルの出力をまねて、小さなモデルを学習させる"],["プルーニング","重要でない重みやニューロンを取り除く"],["量子化","数値をより少ないビット数で表す"]],"point":"「まねる」「削る」「ビットを減らす」。","fields":["practical"]},{"id":"p-cam-gradcam","title":"CAM／Grad-CAM／LIME／SHAP","items":[["CAM","GAPのある構造で、判断の根拠となった画像の領域を示す"],["Grad-CAM","勾配を使い、より幅広いモデルで根拠の領域を示す"],["LIME","1つの予測の周りを簡単なモデルで近似して説明する"],["SHAP","シャプレイ値で各特徴量の貢献を配分する"]],"point":"画像の領域を示すのがCAM系、特徴量の貢献を示すのがLIME・SHAP。","fields":["practical"]},{"id":"p-anon-pseudo","title":"匿名加工情報／仮名加工情報","items":[["匿名加工情報","個人を識別できず、元に戻せない加工。条件を守れば同意なく第三者に提供できる"],["仮名加工情報","ほかの情報と照らし合わせなければ個人を識別できない加工。主に社内での分析用"]],"point":"元に戻せないのが匿名加工情報。仮名加工情報は原則として第三者に提供できない。","fields":["law"]},{"id":"p-contract","title":"請負契約／準委任契約","items":[["請負契約","仕事の完成を約束する。成果物に対して報酬"],["準委任契約","専門家として誠実に仕事をすることを約束する。完成の義務はない"]],"point":"結果が読めないAIの開発やPoCでは、準委任契約が合うとされる。","fields":["law"]},{"id":"p-hard-soft","title":"ハードロー／ソフトロー","items":[["ハードロー","法律のように拘束力があり、守らないと罰則などがある"],["ソフトロー","ガイドラインのように法的な拘束力はないが、守ることが期待される"]],"point":"日本のAIの規律は、ガイドラインなどのソフトローを中心に進められてきた。","fields":["ethics"]},{"id":"p-echo-filter","title":"エコーチェンバー／フィルターバブル","items":[["エコーチェンバー","似た意見の人どうしでやり取りし、意見が強まっていく現象"],["フィルターバブル","アルゴリズムによって、自分好みの情報ばかりに囲まれる状態"]],"point":"人どうしのつながりが原因ならエコーチェンバー、推薦のアルゴリズムが原因ならフィルターバブル。","fields":["society"]}]}}}</script>
<script>
/* G検定 試験範囲マップ（素の JavaScript）。データは <script id="map-data"> の JSON。 */
(function () {
  "use strict";

  const DATA = JSON.parse(document.getElementById("map-data").textContent);
  const META = DATA.meta;
  const L = META.layout;
  const FIELDS = DATA.fields;
  const RELS = DATA.relations;
  const N = FIELDS.length;
  const C = L.size / 2;
  const SVGNS = "http://www.w3.org/2000/svg";
  const PRI = { high: "高", mid: "中", low: "低" };
  const byId = Object.fromEntries(FIELDS.map((f) => [f.id, f]));
  const domainById = Object.fromEntries(DATA.domains.map((d) => [d.id, d]));
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- 小さな道具 ----------
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const zen = (s) => Array.from(s).reduce((n, ch) => n + (/[\x20-\x7e｡-ﾟ]/.test(ch) ? 0.5 : 1), 0);
  const norm = (s) => String(s || "").normalize("NFKC").toLowerCase().replace(/\s+/g, "");
  function el(tag, attrs = {}, parent) {
    const e = document.createElementNS(SVGNS, tag);
    for (const [k, v] of Object.entries(attrs)) if (v !== undefined && v !== null) e.setAttribute(k, v);
    if (parent) parent.appendChild(e);
    return e;
  }
  const rad = (deg) => (deg * Math.PI) / 180;
  const fcolor = (id) => `var(--f-${id})`;
  const dcolor = (id) => `var(--d-${id})`;
  const termCount = (f) => f.subs.reduce((n, s) => n + s.terms.length, 0);
  const store = {
    get(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* 保存できなくても動く */ } },
  };
  function pillHTML(p) { return `<span class="pill ${p}">優先度 ${PRI[p]}</span>`; }
  function badgeHTML(f) {
    return (f.badges || []).map((b) => `<span class="badge weight" title="${esc(META.badges[b].desc)}">${esc(META.badges[b].label)}</span>`).join("");
  }
  function termBadges(t) {
    if (t.sup) return ` <span class="badge sup" title="${esc(META.badges.sup.desc)}">補</span>`;
    return "";
  }
  function chipHTML(fid) {
    const f = byId[fid];
    return `<a class="chip" href="#detail" data-goto-field="${f.id}"><span class="swatch" style="--c:${fcolor(f.id)}"></span>${esc(f.short)}</a>`;
  }
  function noteLink(t) {
    if (!t.note) return "";
    const href = META.siteUrl + t.note.replace(/\.md$/, "/");
    return ` <a class="note-link" href="${esc(href)}" target="_blank" rel="noopener">ノートを読む↗</a>`;
  }
  const officialCount = (f) => f.subs.reduce((n, s) => n + s.terms.filter((t) => !t.sup).length, 0);
  // 項目を学ぶ講義の回（公開済みならリンク）
  function lectureHTML(lec) {
    if (!lec) return "";
    const label = `第${lec.number}回`;
    if (lec.status === "published" && lec.page) {
      const href = META.siteUrl + lec.page.replace(/\.md$/, "/");
      return `<a class="lec" href="${esc(href)}" target="_blank" rel="noopener" title="${esc(lec.title)}">${label}の講義↗</a>`;
    }
    return `<span class="lec planned" title="${esc(lec.title)}（準備中）">${label}の講義</span>`;
  }

  // ---------- 配置の計算（tools/check.py と同じ式） ----------
  function cardHeight(f) { return L.cardHeader + L.cardPad + L.cardRow * f.subs.length + L.cardFooter; }
  const POS = FIELDS.map((f, i) => {
    const ang = L.startAngle + (360 * i) / N;
    const cx = C + L.radius * Math.cos(rad(ang));
    const cy = C + L.radius * Math.sin(rad(ang));
    const w = L.cardWidth, h = cardHeight(f);
    return { id: f.id, i, ang, cx, cy, w, h, x: cx - w / 2, y: cy - h / 2 };
  });
  const posById = Object.fromEntries(POS.map((p) => [p.id, p]));

  // カードの中心から地図の中心へ向かう線と、カードの縁との交点（少し内側へ離す）
  function anchor(p, gap = 16, tangent = 0) {
    const dx = C - p.cx, dy = C - p.cy;
    const tx = dx !== 0 ? (p.w / 2) / Math.abs(dx) : Infinity;
    const ty = dy !== 0 ? (p.h / 2) / Math.abs(dy) : Infinity;
    const t = Math.min(tx, ty);
    const len = Math.hypot(dx, dy);
    const ux = dx / len, uy = dy / len;
    return { x: p.cx + dx * t + ux * gap - uy * tangent, y: p.cy + dy * t + uy * gap + ux * tangent };
  }

  // 関係の曲線：中心寄りに膨らむ二次ベジェ。離れた分野ほど中心に近い所を通る（中心の円は避ける）
  const MID_R = [0, 700, 660, 600, 530, 450, 385, 330, 300];
  function relGeometry(r, scale = 1, center = C, getPos = (id) => posById[id], anchorFn = anchor) {
    const a = getPos(r.from), b = getPos(r.to);
    let s = (b.i - a.i + N) % N;           // 時計回りのステップ数
    const cw = s <= N / 2;
    const steps = cw ? s : N - s;
    const sign = cw ? 1 : -1;
    const off = (18 + 7 * steps) * scale;
    const p0 = anchorFn(a, 16 * scale, sign * off);
    const p2 = anchorFn(b, 16 * scale, -sign * off);
    const phi = rad(a.ang + sign * (steps * 360 / N) / 2);
    const ux = Math.cos(phi), uy = Math.sin(phi);
    const sx = (p0.x - center) + (p2.x - center), sy = (p0.y - center) + (p2.y - center);
    const proj = sx * ux + sy * uy;
    const m = MID_R[Math.min(steps, MID_R.length - 1)] * scale;
    const rc = 2 * (m - 0.25 * proj);
    const c = { x: center + rc * ux, y: center + rc * uy };
    const mid = { x: 0.25 * p0.x + 0.5 * c.x + 0.25 * p2.x, y: 0.25 * p0.y + 0.5 * c.y + 0.25 * p2.y };
    return { p0, p2, c, mid };
  }
  function arrowHead(tip, from, size) {
    const dx = tip.x - from.x, dy = tip.y - from.y;
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len;
    const bx = tip.x - ux * size, by = tip.y - uy * size;
    const w = size * 0.55;
    return `${tip.x.toFixed(1)},${tip.y.toFixed(1)} ${(bx - uy * w).toFixed(1)},${(by + ux * w).toFixed(1)} ${(bx + uy * w).toFixed(1)},${(by - ux * w).toFixed(1)}`;
  }
  function arcPath(r, a0, a1, reverse) {
    const p = (a) => [C + r * Math.cos(rad(a)), C + r * Math.sin(rad(a))];
    const [x0, y0] = p(reverse ? a1 : a0), [x1, y1] = p(reverse ? a0 : a1);
    const large = Math.abs(a1 - a0) > 180 ? 1 : 0;
    return `M${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 ${large} ${reverse ? 0 : 1} ${x1.toFixed(1)},${y1.toFixed(1)}`;
  }
  function splitShort(f) {
    if (f.shortLines && f.shortLines.length) return f.shortLines;
    if (zen(f.short) <= 6) return [f.short];
    const i = Math.ceil(f.short.length / 2);
    return [f.short.slice(0, i), f.short.slice(i)];
  }

  // ---------- 地図を描く ----------
  const svg = $("#map");
  const wrap = $("#map-wrap");
  const vp = el("g", { id: "viewport" }, svg);
  const gBack = el("g", { class: "layer-back" }, vp);
  const gTrunk = el("g", { class: "layer-trunk" }, vp);
  const gRel = el("g", { class: "layer-rel" }, vp);
  const gCenter = el("g", { class: "layer-center" }, vp);
  const gCard = el("g", { class: "layer-card" }, vp);
  const gLabel = el("g", { class: "layer-label" }, vp);
  const step = 360 / N;

  function drawBackground() {
    // 領域ごとの扇形
    const groups = [];
    FIELDS.forEach((f, i) => {
      const g = groups[groups.length - 1];
      if (g && g.domain === f.domain) g.last = i; else groups.push({ domain: f.domain, first: i, last: i });
    });
    const R = L.ringLabel - 50;
    groups.forEach((g) => {
      const a0 = L.startAngle + g.first * step - step / 2;
      const a1 = L.startAngle + g.last * step + step / 2;
      const p = (r, a) => `${(C + r * Math.cos(rad(a))).toFixed(1)},${(C + r * Math.sin(rad(a))).toFixed(1)}`;
      const r0 = L.centerRadius + 20;
      const d = `M${p(r0, a0)} L${p(R, a0)} A${R},${R} 0 0 1 ${p(R, a1)} L${p(r0, a1)} A${r0},${r0} 0 0 0 ${p(r0, a0)} Z`;
      el("path", { d, class: "sector", style: `--c:${dcolor(g.domain)}` }, gBack);
      el("path", { d: arcPath(R, a0 + 0.6, a1 - 0.6), class: "sector-edge", style: `--c:${dcolor(g.domain)}` }, gBack);
      // 円弧に沿った領域名（下半分は文字が逆さにならないよう逆向きに）
      const mid = ((a0 + a1) / 2 + 360) % 360;
      const lower = mid > 0 && mid < 180;
      const pid = `arc-${g.domain}`;
      el("path", { id: pid, d: arcPath(lower ? L.ringLabel + 34 : L.ringLabel, a0, a1, lower), fill: "none" }, gBack);
      const t = el("text", { class: "domain-label", style: `--c:${dcolor(g.domain)}` }, gBack);
      const tp = el("textPath", { href: `#${pid}`, startOffset: "50%", "text-anchor": "middle" }, t);
      tp.textContent = domainById[g.domain].name;
    });
    // 測量図風の同心円と目盛り
    [320, 560, 800, L.ringLabel - 50].forEach((r, i) => el("circle", { cx: C, cy: C, r, class: i % 2 ? "ring" : "ring dash" }, gBack));
    el("circle", { cx: C, cy: C, r: L.ringTick, class: "ring" }, gBack);
    for (let a = 0; a < 360; a += 2.5) {
      const major = a % 22.5 === 0;
      const r0 = L.ringTick, r1 = L.ringTick + (major ? 34 : 14);
      el("line", {
        x1: C + r0 * Math.cos(rad(a)), y1: C + r0 * Math.sin(rad(a)),
        x2: C + r1 * Math.cos(rad(a)), y2: C + r1 * Math.sin(rad(a)), class: major ? "tick major" : "tick",
      }, gBack);
    }
    for (let a = 0; a < 360; a += 45) {
      const bearing = (a + 90) % 360;  // 真上を000とする方位
      const r = L.ringTick - 30;
      el("text", {
        x: C + r * Math.cos(rad(a)), y: C + r * Math.sin(rad(a)) + 8, class: "tick-label", "text-anchor": "middle",
      }, gBack).textContent = String(bearing).padStart(3, "0");
    }
  }

  function drawCenter() {
    el("circle", { cx: C, cy: C, r: L.centerRadius + 26, class: "center-ring2" }, gCenter);
    el("circle", { cx: C, cy: C, r: L.centerRadius, class: "center-disc" }, gCenter);
    const lines = META.centerTitle;
    const fsz = lines.length === 1 ? 96 : 54;
    lines.forEach((s, i) => {
      el("text", { x: C, y: C + (lines.length === 1 ? 26 : -40 + i * 62), class: "center-title", "font-size": fsz }, gCenter).textContent = s;
    });
    el("text", { x: C, y: C + 96, class: "center-sub" }, gCenter).textContent = META.centerSub;
  }

  function drawTrunks() {
    POS.forEach((p) => {
      const a = anchor(p, 10);
      const ang = rad(p.ang);
      const s = { x: C + (L.centerRadius + 8) * Math.cos(ang), y: C + (L.centerRadius + 8) * Math.sin(ang) };
      const rm = (L.centerRadius + Math.hypot(a.x - C, a.y - C)) / 2;
      const ca = rad(p.ang + 7);
      const c = { x: C + rm * Math.cos(ca), y: C + rm * Math.sin(ca) };
      el("path", {
        d: `M${s.x.toFixed(1)},${s.y.toFixed(1)} Q${c.x.toFixed(1)},${c.y.toFixed(1)} ${a.x.toFixed(1)},${a.y.toFixed(1)}`,
        class: "trunk", "data-id": p.id, style: `--c:${fcolor(p.id)}`,
      }, gTrunk);
    });
  }

  function drawRelations() {
    RELS.forEach((r) => {
      const g = el("g", {
        class: `rel${r.core ? " core" : ""}`, "data-id": r.id, "data-from": r.from, "data-to": r.to,
        tabindex: "0", role: "button",
        "aria-label": `${byId[r.from].short}${r.dir === "both" ? "と" : "から"}${byId[r.to].short}${r.dir === "both" ? "の相互" : "へ"}の関係：${r.label}。Enterで説明を開く`,
      }, gRel);
      const { p0, p2, c, mid } = relGeometry(r);
      const d = `M${p0.x.toFixed(1)},${p0.y.toFixed(1)} Q${c.x.toFixed(1)},${c.y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
      el("path", { d, class: "rel-hit" }, g);
      el("path", { d, class: "rel-line" }, g);
      const size = r.core ? 34 : 26;
      el("polygon", { points: arrowHead(p2, c, size), class: "rel-head" }, g);
      if (r.dir === "both") el("polygon", { points: arrowHead(p0, c, size), class: "rel-head" }, g);
      const w = Math.max(120, zen(r.label) * 24 + 28);
      const lg = el("g", { class: "rel-label", "data-x": mid.x, "data-y": mid.y, "data-w": w }, g);
      el("rect", { x: -w / 2, y: -21, width: w, height: 40, rx: 20 }, lg);
      el("text", { x: 0, y: 8 }, lg).textContent = r.label;
    });
  }

  function drawCards() {
    FIELDS.forEach((f) => {
      const p = posById[f.id];
      const g = el("g", {
        class: "card", transform: `translate(${p.x.toFixed(1)},${p.y.toFixed(1)})`, "data-id": f.id,
        tabindex: "0", role: "button", style: `--c:${fcolor(f.id)}`,
        "aria-label": `${f.name}（${domainById[f.domain].name}、優先度${PRI[f.priority]}）。中分類${f.subs.length}、小分類${termCount(f)}語。Enterで詳細を開く`,
      }, gCard);
      const W = p.w, H = p.h;
      // 縮小時：分野色で塗った簡略表示
      const cg = el("g", { class: "lod-compact-only" }, g);
      el("rect", { width: W, height: H, rx: 18, class: "card-compact-bg" }, cg);
      const lines = splitShort(f);
      const maxLen = Math.max(...lines.map(zen));
      const fs = Math.min(58, Math.floor(262 / maxLen), Math.floor((H - 84) / (lines.length * 1.2)));
      const blockH = lines.length * fs * 1.18;
      const top = (H - 64) / 2 - blockH / 2 + fs * 0.92;
      lines.forEach((ln, i) => {
        el("text", { x: W / 2, y: top + i * fs * 1.18, class: "card-big", "font-size": fs }, cg).textContent = ln;
      });
      const pw = 132, ph = 40;
      el("rect", { x: W / 2 - pw / 2, y: H - 58, width: pw, height: ph, rx: 20, class: `pill-bg ${f.priority}`, stroke: "#FFFFFF", "stroke-width": 3 }, cg);
      el("text", { x: W / 2, y: H - 31, class: `pill-text ${f.priority}`, "font-size": 21 }, cg).textContent = `優先度 ${PRI[f.priority]}`;
      // 拡大時：中分類の一覧
      const dg = el("g", { class: "lod-detail-only" }, g);
      el("rect", { width: W, height: H, rx: 14, class: "card-bg" }, dg);
      el("rect", { width: W, height: L.cardHeader, rx: 14, class: "card-band" }, dg);
      el("rect", { y: L.cardHeader - 16, width: W, height: 16, class: "card-band-sq" }, dg);
      el("text", { x: W / 2, y: 40, class: "card-short" }, dg).textContent = f.short;
      f.subs.forEach((s, i) => {
        const y = L.cardHeader + L.cardPad / 2 + i * L.cardRow;
        el("rect", { x: 18, y: y + 9, width: 14, height: 14, rx: 2, class: "sub-sq" }, dg);
        el("text", { x: 42, y: y + 23, class: "sub-name" }, dg).textContent = s.short;
      });
      const fy = H - L.cardFooter;
      el("line", { x1: 14, y1: fy, x2: W - 14, y2: fy, class: "card-foot-sep" }, dg);
      el("rect", { x: 14, y: fy + 11, width: 96, height: 30, rx: 15, class: `pill-bg ${f.priority}` }, dg);
      el("text", { x: 62, y: fy + 32, class: `pill-text ${f.priority}` }, dg).textContent = `優先度 ${PRI[f.priority]}`;
      el("text", { x: W - 16, y: fy + 32, class: "card-open" }, dg).textContent = `小分類 ${termCount(f)}語を開く ›`;
      if ((f.badges || []).includes("revised")) {
        el("rect", { x: W - 172, y: -16, width: 164, height: 28, rx: 8, class: "card-weight-bg" }, g);
        el("text", { x: W - 90, y: 4, class: "card-weight", "text-anchor": "middle" }, g).textContent = META.badges.revised.label;
      }
      el("rect", { x: -7, y: -7, width: W + 14, height: H + 14, rx: 20, class: "card-ring" }, g);
    });
  }

  // 簡略表示の大きな文字：フォントの実際の幅を測ってカードに収める
  function fitCompactText() {
    $$(".card-big", gCard).forEach((t) => {
      if (!t.dataset.fs0) t.dataset.fs0 = t.getAttribute("font-size");
      t.setAttribute("font-size", t.dataset.fs0);
    });
    $$(".card", gCard).forEach((c) => {
      const texts = $$(".card-big", c);
      const w = Math.max(...texts.map((t) => t.getComputedTextLength() || 0));
      if (w > 266) texts.forEach((t) => t.setAttribute("font-size", (Number(t.dataset.fs0) * 266 / w).toFixed(1)));
    });
  }

  drawBackground();
  drawTrunks();
  drawRelations();
  drawCenter();
  drawCards();
  // ラベルは最前面に移す（カードの下に隠れないように）
  $$(".rel", gRel).forEach((g) => {
    const lg = $(".rel-label", g);
    const holder = el("g", { class: "rel-label-holder", "data-for": g.dataset.id }, gLabel);
    holder.appendChild(lg);
  });

  // ---------- 拡大・移動 ----------
  const view = { k: 0.3, x: 0, y: 0, auto: true };
  let fitK = 0.3;
  function applyView() {
    vp.setAttribute("transform", `translate(${view.x.toFixed(2)},${view.y.toFixed(2)}) scale(${view.k.toFixed(5)})`);
    svg.classList.toggle("lod-detail", view.k >= L.lodThreshold);
    layoutLabels();
  }
  // 表示中の関係ラベルを、重ならないように上下へずらして置く
  // ラベルを置かない場所：カードと中心の円（座標空間での矩形）
  const OBSTACLES = POS.map((p) => ({ x: p.cx, y: p.cy, w: p.w + 24, h: p.h + 24 }))
    .concat([{ x: C, y: C, w: (L.centerRadius + 30) * 2, h: (L.centerRadius + 30) * 2 }]);
  function layoutLabels() {
    const s = Math.max(1, 0.52 / view.k);
    const placed = OBSTACLES.slice();
    const holders = $$(".rel-label-holder", gLabel);
    const vis = holders.filter((h) => h.style.display !== "none");
    const isOn = (h) => (gRel.querySelector(`[data-id="${h.dataset.for}"]`) || h).classList.contains("on");
    // 強調中の関係のラベルを先に置く。同じ組の中は上から順に
    vis.sort((a, b) => (isOn(b) - isOn(a)) || (Number($(".rel-label", a).dataset.y) - Number($(".rel-label", b).dataset.y)));
    holders.forEach((h) => {
      const lg = $(".rel-label", h);
      lg.setAttribute("transform", `translate(${lg.dataset.x},${lg.dataset.y}) scale(${s.toFixed(3)})`);
    });
    vis.forEach((h) => {
      const lg = $(".rel-label", h);
      const y0 = Number(lg.dataset.y);
      const w = (Number(lg.dataset.w) + 8) * s, hh = 44 * s;
      const x0 = Number(lg.dataset.x);
      const len = Math.hypot(C - x0, C - y0) || 1;
      const ix = (C - x0) / len, iy = (C - y0) / len;   // 中心へ向かう向き
      let x = x0, y = y0, best = null;
      search:
      for (let r = 0; r < 16; r++) {
        for (const v of [0, -1, 1, -2, 2]) {
          for (const hs of [0, -0.5, 0.5]) {
            x = x0 + ix * r * hh * 0.6 + hs * w;
            y = y0 + iy * r * hh * 0.6 + v * hh * 0.9;
            if (Math.hypot(x - C, y - C) > L.radius + 120) continue;
            const hit = placed.some((p) => Math.abs(p.x - x) < (p.w + w) / 2 && Math.abs(p.y - y) < (p.h + hh) / 2);
            if (!hit) { best = { x, y }; break search; }
          }
        }
      }
      // どこにも置けないとき：強調中なら元の位置に重ねて出し、常時表示のラベルは省略する
      if (!best) {
        if (!isOn(h)) { h.style.display = "none"; return; }
        best = { x: x0, y: y0 };
      }
      x = best.x; y = best.y;
      placed.push({ x, y, w, h: hh });
      lg.setAttribute("transform", `translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${s.toFixed(3)})`);
    });
  }
  function fit() {
    const r = wrap.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const ext = (L.ringTick + 46) * 2;
    fitK = Math.min((r.width - 16) / ext, (r.height - 16) / ext);
    view.k = fitK;
    view.x = r.width / 2 - C * fitK;
    view.y = r.height / 2 - C * fitK;
    // 左上の凡例パネルが開いているときは、重ならない範囲で地図を右へ寄せる
    const lgd = $("#legend");
    if (r.width > 860 && lgd.open) {
      const lr = lgd.getBoundingClientRect(), zr = $(".zoom-ctl").getBoundingClientRect();
      const half = (ext / 2) * fitK;
      const left = r.width / 2 - half;
      const want = lr.right - r.left + 10 - left;
      const room = (zr.left - r.left - 10) - (r.width / 2 + half);
      let shift = Math.max(0, Math.min(want, room));
      // 右下の注記に地図の外周がかからないよう、寄せる量を減らす
      const nr = $("#a1-note").getBoundingClientRect();
      const cy = r.height / 2;
      const clear = (sh) => {
        const cx = r.width / 2 + sh;
        const nx = Math.min(Math.max(cx, nr.left - r.left), nr.right - r.left);
        const ny = Math.min(Math.max(cy, nr.top - r.top), nr.bottom - r.top);
        return Math.hypot(nx - cx, ny - cy) > half - 30;
      };
      while (shift > 0 && !clear(shift)) shift -= 2;
      view.x += Math.max(0, shift);
    }
    view.auto = true;
    applyView();
  }
  function zoomAt(px, py, factor) {
    const k2 = Math.min(Math.max(view.k * factor, fitK * 0.6), 3);
    const f = k2 / view.k;
    view.x = px - (px - view.x) * f;
    view.y = py - (py - view.y) * f;
    view.k = k2;
    view.auto = false;
    applyView();
  }
  function zoomCenter(factor) {
    const r = wrap.getBoundingClientRect();
    zoomAt(r.width / 2, r.height / 2, factor);
  }
  $("#zoom-in").addEventListener("click", () => zoomCenter(1.45));
  $("#zoom-out").addEventListener("click", () => zoomCenter(1 / 1.45));
  $("#zoom-fit").addEventListener("click", fit);

  wrap.addEventListener("wheel", (e) => {
    e.preventDefault();
    const r = wrap.getBoundingClientRect();
    const factor = Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0016));
    zoomAt(e.clientX - r.left, e.clientY - r.top, factor);
  }, { passive: false });

  const pointers = new Map();
  let drag = null;
  let suppressClick = false;
  wrap.addEventListener("pointerdown", (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) {
      drag = { sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y, moved: false, id: e.pointerId };
    } else if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      drag = { pinch: true, dist: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, moved: true };
    }
  });
  wrap.addEventListener("pointermove", (e) => {
    if (!pointers.has(e.pointerId) || !drag) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const r = wrap.getBoundingClientRect();
    if (drag.pinch && pointers.size >= 2) {
      const [a, b] = [...pointers.values()];
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      view.x += mx - drag.mx;
      view.y += my - drag.my;
      zoomAt(mx - r.left, my - r.top, dist / (drag.dist || dist));
      drag.dist = dist; drag.mx = mx; drag.my = my;
      return;
    }
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (!drag.moved && Math.hypot(dx, dy) > 5) {
      drag.moved = true;
      wrap.classList.add("dragging");
      try { wrap.setPointerCapture(e.pointerId); } catch (err) { /* 無視 */ }
    }
    if (drag.moved) {
      view.x = drag.vx + dx;
      view.y = drag.vy + dy;
      view.auto = false;
      applyView();
    }
  });
  function endPointer(e) {
    pointers.delete(e.pointerId);
    if (drag && drag.moved) suppressClick = true;
    if (pointers.size === 0) { drag = null; wrap.classList.remove("dragging"); }
    else if (pointers.size === 1) {
      const [p] = [...pointers.values()];
      drag = { sx: p.x, sy: p.y, vx: view.x, vy: view.y, moved: true };
    }
  }
  wrap.addEventListener("pointerup", endPointer);
  wrap.addEventListener("pointercancel", endPointer);
  wrap.addEventListener("click", (e) => {
    if (suppressClick) { e.stopPropagation(); e.preventDefault(); suppressClick = false; }
  }, true);

  // ---------- 強調表示 ----------
  const state = { selected: null, selectedRel: null, hover: null, hoverRel: null, hits: new Set() };
  function relatedOf(fid) {
    const rels = RELS.filter((r) => r.from === fid || r.to === fid);
    return { rels: new Set(rels.map((r) => r.id)), fields: new Set(rels.flatMap((r) => [r.from, r.to])) };
  }
  function refreshFocus() {
    const fid = state.hover || (state.hoverRel ? null : state.selected);
    const rid = state.hoverRel || (state.hover ? null : state.selectedRel);
    let onRels = new Set(), onFields = new Set(), focusId = null;
    if (fid) {
      const r = relatedOf(fid);
      onRels = r.rels; onFields = r.fields; onFields.add(fid); focusId = fid;
    } else if (rid) {
      const r = RELS.find((x) => x.id === rid);
      onRels = new Set([rid]); onFields = new Set([r.from, r.to]);
    }
    const active = !!(fid || rid);
    svg.classList.toggle("focusing", active);
    $$(".card", gCard).forEach((c) => {
      const id = c.dataset.id;
      c.classList.toggle("is-focus", id === focusId);
      c.classList.toggle("is-dim", active && !onFields.has(id));
      c.classList.toggle("hit", state.hits.has(id));
    });
    $$(".trunk", gTrunk).forEach((t) => {
