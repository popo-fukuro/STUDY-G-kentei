  --flash: #FFE9B0;
  --font-ui: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --font-display: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --topbar-h: 60px;
  --radius: 14px;
  --ease: 220ms cubic-bezier(.2, .7, .2, 1);
}

/* 分野色を背景の上に線として引くときの色（ダークでは少し明るく） */
:root { --mix-line: 0%; }
:root[data-theme="dark"] { --mix-line: 38%; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --mix-line: 38%; } }

/* ===== 基本 ===== */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.7;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 8px; top: -60px; z-index: 100; background: var(--surface-2); padding: 6px 12px; border-radius: 8px; }
.skip:focus { top: 8px; }
[hidden] { display: none !important; }

/* ===== 上部バー ===== */
.topbar {
  flex: none;
  display: flex;
  align-items: center;
  gap: 16px;
  min-height: var(--topbar-h);
  padding: 8px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  position: relative;
  z-index: 30;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark {
  width: 34px; height: 34px; flex: none; border-radius: 50%;
  background: radial-gradient(circle at 50% 50%, var(--center) 0 38%, transparent 39% 52%, var(--center) 53% 58%, transparent 59%),
              conic-gradient(var(--d-hist) 0 60deg, var(--d-mlbase) 0 120deg, var(--d-dlcore) 0 180deg, var(--d-dlapp) 0 240deg, var(--d-social) 0 300deg, var(--d-moral) 0);
}
.brand-title { font-family: var(--font-display); font-weight: 800; font-size: 18px; line-height: 1.2; letter-spacing: .02em; white-space: nowrap; }
.brand-sub { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
.tabs { display: flex; gap: 4px; margin-left: 8px; }
.tabs a {
  text-decoration: none; color: var(--ink-2); padding: 7px 12px; border-radius: 999px;
  font-weight: 700; font-size: 14px; white-space: nowrap;
}
.tabs a:hover { background: var(--bg-2); }
.tabs a[aria-selected="true"] { background: var(--ink); color: var(--surface); }
.tabs .ts { display: none; }
.panel-title:focus { outline: none; }
.search { position: relative; margin-left: auto; width: min(320px, 32vw); }
.search input {
  width: 100%; height: 38px; padding: 0 12px 0 34px; border-radius: 999px;
  border: 1px solid var(--line-2); background: var(--surface-2); color: var(--ink); font: inherit;
}
.search::before {
  content: ""; position: absolute; left: 13px; top: 12px; width: 10px; height: 10px;
  border: 2px solid var(--ink-3); border-radius: 50%; pointer-events: none;
}
.search::after {
  content: ""; position: absolute; left: 24px; top: 23px; width: 6px; height: 2px;
  background: var(--ink-3); transform: rotate(45deg); pointer-events: none;
}
.search ul {
  position: absolute; right: 0; top: 44px; width: min(440px, 92vw); max-height: 60vh; overflow: auto;
  margin: 0; padding: 6px; list-style: none; background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow);
}
.search li { padding: 8px 10px; border-radius: 8px; cursor: pointer; line-height: 1.45; }
.search li[aria-selected="true"], .search li:hover { background: var(--bg-2); }
.search li .q-name { font-weight: 700; }
.search li .q-path { display: block; font-size: 12px; color: var(--ink-3); }
.search li.q-info { cursor: default; font-size: 12px; color: var(--ink-3); }
.search li.q-info:hover { background: none; }
.icon-btn {
  flex: none; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line-2);
  background: var(--surface-2); cursor: pointer; font-size: 17px; line-height: 1;
}

main { flex: 1; min-height: 0; position: relative; }
.links-layout > *, .tables > *, .two-col > *, .exam-wrap section, .fsec-body > * { min-width: 0; }
.view { position: absolute; inset: 0; overflow: auto; }

/* ===== 地図 ===== */
#view-map { overflow: hidden; }
#map-wrap {
  position: absolute; inset: 0; touch-action: none; cursor: grab;
  background:
    radial-gradient(circle at 50% 50%, transparent 0 60%, color-mix(in srgb, var(--bg-2) 70%, transparent) 100%),
    var(--bg);
}
#map-wrap.dragging { cursor: grabbing; }
#map { width: 100%; height: 100%; display: block; user-select: none; -webkit-user-select: none; }
#map text { font-family: var(--font-ui); }

.ring { fill: none; stroke: var(--grid); stroke-width: 1.4; opacity: .55; }
.ring.dash { stroke-dasharray: 6 10; }
.tick { stroke: var(--grid); stroke-width: 2; opacity: .7; }
.tick.major { stroke-width: 4; opacity: .9; }
.tick-label { fill: var(--ink-3); font-size: 22px; letter-spacing: .08em; }
.sector { fill: var(--c); opacity: var(--sector-op); }
.sector-edge { stroke: var(--c); stroke-width: 3; opacity: .35; fill: none; }
.domain-label { fill: var(--c); font-family: var(--font-display) !important; font-weight: 800; font-size: 46px; letter-spacing: .22em; }
:root[data-theme="dark"] .domain-label { fill: color-mix(in srgb, var(--c) 55%, white); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .domain-label { fill: color-mix(in srgb, var(--c) 55%, white); } }

.trunk { fill: none; stroke: color-mix(in srgb, var(--c), white var(--mix-line)); stroke-width: 18; stroke-linecap: round; opacity: var(--trunk-op); transition: opacity var(--ease); }
.center-disc { fill: var(--center); stroke: var(--center-ring); stroke-width: 6; }
.center-ring2 { fill: none; stroke: var(--center); stroke-width: 2; opacity: .5; }
.center-title { fill: #FFFFFF; font-family: var(--font-display) !important; font-weight: 800; text-anchor: middle; }
.center-sub { fill: #C9D7E6; font-size: 22px; text-anchor: middle; letter-spacing: .2em; }

/* 関係の矢印 */
.rel { cursor: pointer; transition: opacity var(--ease); }
.rel-line { fill: none; stroke: var(--link-line); stroke-width: 4; opacity: .5; }
.rel.core .rel-line { stroke-width: 9; opacity: .72; }
.rel:not(.core) .rel-line { stroke-dasharray: 16 12; }
.rel-head { fill: var(--link-line); opacity: .65; }
.rel.core .rel-head { opacity: .8; }
.rel-hit { fill: none; stroke: transparent; stroke-width: 34; }
.rel-label { display: none; pointer-events: none; }
.rel-label rect { fill: var(--surface-2); stroke: var(--link-on); stroke-width: 2.5; }
.rel-label text { fill: var(--ink); font-size: 24px; font-weight: 700; text-anchor: middle; }
.labels-on .rel-label { display: inline; }
.rel.on .rel-label, .rel:hover .rel-label, .rel:focus-visible .rel-label { display: inline; }
.rel.on .rel-line, .rel:hover .rel-line, .rel:focus-visible .rel-line { stroke: var(--link-on); opacity: 1; }
.rel.on .rel-head, .rel:hover .rel-head, .rel:focus-visible .rel-head { fill: var(--link-on); opacity: 1; }
.rel:focus-visible { outline: none; }
.rel:focus-visible .rel-line { stroke-width: 12; }
.no-links .rel { display: none; }
.core-only .rel:not(.core) { display: none; }

/* 大分類カード */
.card { cursor: pointer; transition: opacity var(--ease); }
.card:focus { outline: none; }
.card-bg { fill: var(--card-bg); stroke: color-mix(in srgb, var(--c) 45%, var(--line)); stroke-width: 2; }
.card-band, .card-band-sq { fill: var(--c); }
.card-short { fill: #FFFFFF; font-weight: 700; font-size: 27px; text-anchor: middle; }
.sub-sq { fill: var(--c); opacity: .85; }
.sub-name { fill: var(--card-ink); font-size: 20px; }
.card-foot-sep { stroke: var(--line); stroke-width: 1.5; }
.pill-bg.high { fill: var(--pill-high-bg); }
.pill-bg.mid { fill: var(--pill-mid-bg); }
.pill-bg.low { fill: var(--pill-low-bg); }
.pill-text { font-size: 18px; font-weight: 700; text-anchor: middle; }
.pill-text.high { fill: var(--pill-high-ink); }
.pill-text.mid { fill: var(--pill-mid-ink); }
.pill-text.low { fill: var(--pill-low-ink); }
.card-open { fill: var(--accent); font-size: 17px; font-weight: 700; text-anchor: end; }
.card-weight { fill: var(--badge-weight-ink); font-size: 15px; font-weight: 700; }
.card-weight-bg { fill: var(--badge-weight-bg); }
.card-compact-bg { fill: var(--c); stroke: color-mix(in srgb, var(--c) 70%, black); stroke-width: 2; }
.card-big { fill: #FFFFFF; font-family: var(--font-display) !important; font-weight: 800; text-anchor: middle; }
.card-ring { fill: none; stroke: transparent; stroke-width: 10; }
.card:focus-visible .card-ring { stroke: var(--accent); }
.card.hit .card-ring { stroke: var(--hit); stroke-dasharray: 22 10; }
.card.is-focus .card-ring { stroke: var(--ink); }
.lod-detail-only { display: none; }
.lod-detail .lod-detail-only { display: inline; }
.lod-detail .lod-compact-only { display: none; }

.focusing .card.is-dim, .focusing .rel.is-dim, .focusing .trunk.is-dim { opacity: .18; }
.focusing .trunk.is-on { opacity: .95; }

/* 操作ボタン */
.zoom-ctl {
  position: absolute; right: 16px; top: 16px; display: flex; flex-direction: column; gap: 6px; z-index: 5;
}
.zoom-ctl button {
  width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line-2);
  background: var(--surface-2); cursor: pointer; font-size: 22px; font-weight: 700; box-shadow: var(--shadow);
}
.zoom-ctl button.fit { font-size: 13px; }

/* 左上パネル */
.legend-panel {
  position: absolute; left: 16px; top: 16px; width: 290px; max-height: calc(100% - 32px); overflow: auto;
  background: color-mix(in srgb, var(--surface) 94%, transparent); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow); z-index: 5; font-size: 13px; line-height: 1.6;
}
.legend-panel > summary {
  cursor: pointer; padding: 10px 14px; font-weight: 700; list-style: none; display: flex; align-items: center; gap: 8px;
}
.legend-panel > summary::-webkit-details-marker { display: none; }
.legend-panel > summary::before { content: "▸"; transition: transform var(--ease); }
.legend-panel[open] > summary::before { transform: rotate(90deg); }
.legend-body { padding: 0 14px 12px; }
.legend-body h3 { font-size: 12.5px; margin: 10px 0 4px; color: var(--ink-2); letter-spacing: .06em; }
.legend-body ol { margin: 0; padding-left: 1.3em; }
.legend-body label { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 2px 0; }
.legend-body input { width: 16px; height: 16px; accent-color: var(--accent); }
.legend-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.legend-list li { display: flex; align-items: center; gap: 8px; }
.legend-list.cols { grid-template-columns: 1fr 1fr; gap: 3px 8px; }
.swatch { width: 14px; height: 14px; border-radius: 3px; background: var(--c); flex: none; }
.line-sample { width: 36px; height: 0; border-top: 4px solid var(--link-line); flex: none; }
.line-sample.dash { border-top: 2px dashed var(--link-line); }
.legend-note { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); color: var(--ink-3); font-size: 12px; }

/* 右下の注記 */
.a1-note {
  position: absolute; right: 16px; bottom: 16px; width: 270px; z-index: 4;
  background: color-mix(in srgb, var(--surface) 94%, transparent); border: 1px solid var(--line);
  border-left: 6px solid var(--ink); border-radius: var(--radius); padding: 10px 14px; font-size: 12.5px; line-height: 1.6;
  box-shadow: var(--shadow);
}
.a1-note strong { display: block; font-size: 13px; margin-bottom: 2px; }
.a1-note p { margin: 0; }
.a1-note .a1-new { margin-top: 4px; color: var(--ink-3); }

/* ===== 右側パネル（スマホでは下からのシート） ===== */
.panel {
  position: fixed; right: 0; top: var(--topbar-actual, var(--topbar-h)); bottom: 0; width: min(460px, 100vw);
  background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow);
  transform: translateX(102%); transition: transform var(--ease), visibility var(--ease); visibility: hidden;
  z-index: 40; display: flex; flex-direction: column;
}
.panel.open { transform: none; visibility: visible; }
.panel-head { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 8px 10px 0 16px; }
.panel-grip { display: none; }
.panel-close {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--surface-2);
  cursor: pointer; font-size: 20px; line-height: 1;
}
.panel-body { flex: 1; overflow: auto; padding: 4px 18px 28px; }
.crumb { margin: 0; font-size: 12.5px; color: var(--ink-3); }
.crumb b { color: var(--ink-2); }
.panel-title { margin: 6px 0 8px; font-size: 21px; line-height: 1.4; display: flex; gap: 10px; align-items: flex-start; }
.panel-title .swatch { width: 18px; height: 18px; margin-top: 6px; border-radius: 4px; }
.panel h3 { font-size: 14px; margin: 18px 0 6px; padding-bottom: 4px; border-bottom: 2px solid var(--line); letter-spacing: .04em; }
.panel p { margin: 6px 0; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 700; text-decoration: none;
}
.btn.ghost { background: transparent; color: var(--accent); }
.link-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.link-list button {
  width: 100%; text-align: left; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface-2); cursor: pointer; line-height: 1.5;
}
.link-list button:hover { border-color: var(--line-2); }
.link-list .lk-to { font-weight: 700; }
.link-list .lk-label { display: block; font-size: 12.5px; color: var(--ink-3); }
.kind { display: inline-block; font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 6px; border: 1px solid var(--line-2); color: var(--ink-2); margin-left: 6px; vertical-align: 1px; }
.kind.core { background: var(--ink); color: var(--surface); border-color: var(--ink); }

/* ピル・バッジ */
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 10px; border-radius: 999px; line-height: 1.7; white-space: nowrap; }
.pill.high { background: var(--pill-high-bg); color: var(--pill-high-ink); }
.pill.mid { background: var(--pill-mid-bg); color: var(--pill-mid-ink); }
.pill.low { background: var(--pill-low-bg); color: var(--pill-low-ink); }
.badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 6px; line-height: 1.6; vertical-align: 1px; white-space: nowrap; }
.badge.sup { background: var(--badge-sup-bg); color: var(--badge-sup-ink); }
.badge.new { background: var(--badge-new-bg); color: var(--badge-new-ink); }
.badge.weight { background: var(--badge-weight-bg); color: var(--badge-weight-ink); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* 樹形図（├─ 形式の線） */
.tree, .tree ul { list-style: none; margin: 0; padding: 0; }
.tree ul { padding-left: 14px; }
.tree li { position: relative; padding-left: 20px; }
.tree li::before {
  content: ""; position: absolute; left: 0; top: 0; width: 14px; height: .95em;
  border-left: 2px solid var(--line-2); border-bottom: 2px solid var(--line-2);
}
.tree li:not(:last-child)::after { content: ""; position: absolute; left: 0; top: .95em; bottom: 0; border-left: 2px solid var(--line-2); }
.tree > li { padding-left: 0; }
.tree > li::before, .tree > li::after { display: none; }
.tree .t-root { font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.tree .t-sub { font-weight: 700; display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; }
.tree .t-sub .swatch { width: 11px; height: 11px; border-radius: 2px; }
.tree .t-term { padding: 1px 0; line-height: 1.55; border-radius: 6px; }
.tree .t-name { font-weight: 700; }
.tree .t-desc { color: var(--ink-2); }
.tree .t-term.flash { background: var(--flash); box-shadow: 0 0 0 4px var(--flash); }
@media (prefers-reduced-motion: no-preference) {
  .tree .t-term.flash { transition: background 600ms, box-shadow 600ms; }
}
.note-link { font-size: 12px; margin-left: 4px; white-space: nowrap; }

dl.info { margin: 0; display: grid; gap: 8px; }
dl.info dt { font-weight: 700; font-size: 12.5px; color: var(--ink-2); }
dl.info dd { margin: 0; }
dl.info ul { margin: 0; padding-left: 1.2em; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 1px 8px; border-radius: 999px;
  border: 1px solid var(--line-2); background: var(--surface-2); color: var(--ink); text-decoration: none; cursor: pointer; white-space: nowrap;
}
.chip .swatch { width: 9px; height: 9px; border-radius: 50%; }
.kw { display: inline-block; font-size: 12.5px; padding: 0 7px; border-radius: 6px; background: var(--bg-2); margin: 0 4px 4px 0; }

/* ===== 分野別詳細 ===== */
.detail-layout { display: grid; grid-template-columns: 290px 1fr; min-height: 100%; }
.detail-layout { background: linear-gradient(to right, var(--surface) 290px, transparent 290px); }
.detail-nav {
  position: sticky; top: 0; align-self: start; overflow: auto; padding: 16px;
  max-height: calc(100vh - var(--topbar-actual, var(--topbar-h)));
  border-right: 1px solid var(--line); background: var(--surface);
}
.detail-nav h2 { font-size: 14px; margin: 0 0 8px; }
.filter { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; }
.filter button { padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface-2); cursor: pointer; font-size: 13px; font-weight: 700; }
.filter button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.nav-domain { margin: 10px 0 4px; font-size: 12px; font-weight: 700; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
.nav-list { list-style: none; margin: 0; padding: 0; }
.nav-list a { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 8px; text-decoration: none; color: var(--ink); font-size: 13.5px; }
.nav-list a:hover { background: var(--bg-2); }
.nav-list .pill { margin-left: auto; font-size: 11px; padding: 0 8px; }
.detail-body { padding: 20px clamp(16px, 3vw, 36px) 60px; min-width: 0; }
.page-head { max-width: 1100px; margin-bottom: 18px; }
.page-head h1 { font-family: var(--font-display); font-size: 26px; margin: 0 0 4px; line-height: 1.3; font-weight: 800; }
.page-head p { margin: 0; color: var(--ink-2); }
.notice { font-size: 12.5px; color: var(--ink-3); margin-top: 6px !important; }
.fsec { max-width: 1100px; margin: 0 0 28px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; scroll-margin-top: 12px; }
.fsec-head { background: var(--c); color: #FFFFFF; padding: 12px 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.fsec-head h2 { margin: 0; font-size: 19px; line-height: 1.4; }
.fsec-head .dom { font-size: 12px; opacity: .92; }
.fsec-head .pills { margin-left: auto; }
.fsec-body { padding: 14px 18px 18px; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px 28px; }
.fsec-body h3 { font-size: 14px; margin: 4px 0 8px; padding-bottom: 4px; border-bottom: 2px solid var(--line); }
.fsec-summary { grid-column: 1 / -1; margin: 0; }
.fsec-links { grid-column: 1 / -1; }

/* ===== 分野間の関係 ===== */
.links-layout { display: grid; grid-template-columns: minmax(300px, 520px) 1fr; gap: 24px; padding: 20px clamp(16px, 3vw, 36px) 60px; align-items: start; }
.links-layout .page-head { grid-column: 1 / -1; margin-bottom: 0; }
.mini-wrap { position: sticky; top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; }
.mini-wrap svg { width: 100%; height: auto; display: block; }
.mini-wrap p { margin: 4px 4px 0; font-size: 12px; color: var(--ink-3); }
.mini-node circle { fill: var(--c); stroke: var(--surface); stroke-width: 3; }
.mini-node text { font-size: 21px; fill: var(--ink); font-weight: 700; }
.mini-rel path { fill: none; stroke: var(--link-line); stroke-width: 2; opacity: .45; }
.mini-rel.core path { stroke-width: 4; opacity: .65; }
.mini-rel:not(.core) path { stroke-dasharray: 6 5; }
.mini-rel polygon { fill: var(--link-line); opacity: .55; }
.mini.sel .mini-rel, .mini.sel .mini-node { opacity: .2; }
.mini.sel .mini-rel.on, .mini.sel .mini-node.on { opacity: 1; }
.mini-rel.on path { stroke: var(--link-on); opacity: 1; }
.mini-rel.on polygon { fill: var(--link-on); opacity: 1; }
.mini-node.on circle { stroke: var(--link-on); stroke-width: 5; }
.rel-groups { min-width: 0; }
.rel-group { margin-bottom: 22px; }
.rel-group > h2 { font-size: 16px; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
.rel-group > h2 .num { font-family: var(--font-display); font-weight: 800; display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--surface); font-size: 13px; }
.rel-cards { display: grid; gap: 10px; }
.rel-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; cursor: pointer; text-align: left; width: 100%; line-height: 1.65; }
.rel-card:hover { border-color: var(--line-2); }
.rel-card.sel { border-color: var(--link-on); box-shadow: 0 0 0 2px var(--link-on); }
.rel-card .rc-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-weight: 700; }
.rel-card .rc-arrow { color: var(--ink-3); }
.rel-card .rc-label { display: block; font-size: 15px; margin: 2px 0 4px; color: var(--link-on); font-weight: 700; }
.rel-card dl { margin: 0; display: grid; grid-template-columns: 7.5em 1fr; gap: 3px 10px; font-size: 13.5px; }
.rel-card dt { font-weight: 700; color: var(--ink-2); }
.rel-card dd { margin: 0; }
.tables { grid-column: 1 / -1; display: grid; gap: 28px; }
.tables h2 { font-size: 18px; margin: 0 0 10px; }
.tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; line-height: 1.6; }
th, td { border-bottom: 1px solid var(--line); padding: 8px 12px; text-align: left; vertical-align: top; }
thead th { background: var(--bg-2); font-size: 12.5px; white-space: nowrap; }
tbody th { white-space: nowrap; }
tr:last-child td, tr:last-child th { border-bottom: none; }
.pairs { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.pair { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.pair h3 { margin: 0 0 6px; font-size: 15px; }
.pair dl { margin: 0 0 6px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 13.5px; }
.pair dt { font-weight: 700; white-space: nowrap; }
.pair dd { margin: 0; color: var(--ink-2); }
.pair .point { margin: 6px 0 0; font-size: 13px; padding: 6px 8px; border-radius: 8px; background: var(--bg-2); }
.pair .point::before { content: "見分け方："; font-weight: 700; }

/* ===== 試験制度と根拠 ===== */
.exam-wrap { padding: 20px clamp(16px, 3vw, 36px) 60px; max-width: 1180px; }
.exam-wrap section { margin-bottom: 30px; }
.exam-wrap h2 { font-size: 18px; margin: 0 0 10px; display: flex; align-items: center; gap: 10px; }
.exam-wrap h2::before { content: ""; width: 6px; height: 22px; border-radius: 3px; background: var(--ink); }
.exam-wrap p { margin: 6px 0; }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; position: relative; }
.timeline::before { content: ""; position: absolute; left: 4%; right: 4%; top: 15px; border-top: 3px solid var(--line-2); }
.timeline li { position: relative; padding: 36px 12px 0; }
.timeline li::before {
  content: ""; position: absolute; left: 12px; top: 6px; width: 20px; height: 20px; border-radius: 50%;
  background: var(--surface); border: 4px solid var(--line-2);
}
.timeline li.done::before { background: var(--line-2); }
.timeline li.next::before { background: var(--hit); border-color: var(--hit); box-shadow: 0 0 0 5px color-mix(in srgb, var(--hit) 25%, transparent); }
.timeline li.plan::before { border-style: dashed; border-color: var(--accent); }
.timeline .tl-when { font-size: 12.5px; color: var(--ink-3); }
.timeline .tl-name { font-weight: 700; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.timeline .tl-text { font-size: 13px; color: var(--ink-2); margin: 2px 0 0; }
.status { font-size: 11px; font-weight: 700; padding: 0 7px; border-radius: 6px; border: 1px solid var(--line-2); }
.status.next { background: var(--hit); color: #FFFFFF; border-color: var(--hit); }
.status.plan { border-style: dashed; border-color: var(--accent); color: var(--accent); }
.sys { font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 6px; }
.sys.current { background: var(--bg-2); color: var(--ink-2); }
.sys.new { background: var(--badge-new-bg); color: var(--badge-new-ink); }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.two-col h3 { font-size: 14px; margin: 0 0 6px; }
.src-list { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; font-size: 13.5px; }
.src-list .src-note { color: var(--ink-3); font-size: 12.5px; }
.guide { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.guide div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; font-size: 13.5px; }
.guide b { display: block; }
.guide .lv { font-size: 11.5px; color: var(--ink-3); font-weight: 700; }
.method { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 4px; }
.footer-note { font-size: 12.5px; color: var(--ink-3); border-top: 1px solid var(--line); padding-top: 12px; }

/* ===== スマホ ===== */
@media (max-width: 860px) {
  .topbar { flex-wrap: wrap; gap: 8px 10px; padding: 8px 12px; }
  .brand-sub { display: none; }
  .brand-title { font-size: 16px; }
  .tabs { order: 3; width: 100%; margin: 0; overflow-x: auto; scrollbar-width: none; }
  .tabs a { padding: 6px 12px; font-size: 13.5px; flex: 1; text-align: center; }
  .tabs .tl { display: none; }
  .tabs .ts { display: inline; }
  .search { order: 2; width: auto; flex: 1; margin-left: 0; min-width: 120px; }
  .icon-btn { order: 1; margin-left: auto; }
  .brand { order: 0; }
  .legend-panel { left: 10px; top: 10px; width: min(290px, calc(100% - 76px)); }
  .zoom-ctl { right: 10px; top: 10px; }
  .a1-note { left: 10px; right: auto; bottom: 10px; width: min(300px, calc(100% - 20px)); padding: 8px 12px; font-size: 12px; }
  .a1-note .a1-new { display: none; }
  .detail-layout { grid-template-columns: 1fr; }
  .detail-layout { background: none; }
  .detail-nav { position: static; height: auto; max-height: none; border-right: none; border-bottom: 1px solid var(--line); }
  .nav-groups { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .fsec-body { grid-template-columns: 1fr; }
  .links-layout { grid-template-columns: 1fr; }
  .mini-wrap { position: static; }
  .timeline { grid-template-columns: 1fr; }
  .timeline::before { left: 21px; right: auto; top: 10px; bottom: 10px; border-top: none; border-left: 3px solid var(--line-2); }
  .timeline li { padding: 0 0 16px 46px; }
  .timeline li::before { left: 12px; top: 3px; }
  .two-col { grid-template-columns: 1fr; }
  .rel-card dl { grid-template-columns: 1fr; }
  .panel {
    top: auto; left: 0; right: 0; bottom: 0; width: 100%; height: min(78vh, 720px);
    border-left: none; border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; transform: translateY(102%);
  }
  .panel-head { padding: 6px 10px 0 16px; }
  .panel-grip { display: block; position: absolute; left: 50%; top: 6px; width: 44px; height: 5px; margin-left: -22px; border-radius: 3px; background: var(--line-2); }
}
@media (max-width: 480px) {
  .legend-panel:not([open]) { width: auto; }
  .nav-groups { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}

/* ===== G検定版の追加部品 ===== */
.tree .sid { font-size: 11.5px; font-weight: 700; color: var(--ink-3); background: var(--bg-2); border-radius: 6px; padding: 0 6px; }
.lec { font-size: 11.5px; font-weight: 700; padding: 0 8px; border-radius: 999px; border: 1px solid var(--accent); color: var(--accent); text-decoration: none; white-space: nowrap; }
.lec.planned { border-style: dashed; border-color: var(--line-2); color: var(--ink-3); }
.cat-items { margin: 0; padding-left: 1.1em; display: grid; gap: 3px; }
.cat-items .chip { margin-left: 4px; vertical-align: 1px; }
.timeline.timeline-many { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }

</style>
</head>

題を題材にしている。シラバス2024の改訂ポイントで「人工知能の基礎となる歴史的な知識」の体系が見直された。キーワード数は18語で、全体の中では少なめ。","items":["T01","T02"],"subShort":{"T02":"AI分野の難問"},"subs":[{"id":"T01","name":"人工知能の定義","short":"人工知能の定義","category":"人工知能とは","area":"技術分野","lecture":{"number":1,"title":"人工知能とは？ 定義と「AIの難問」","status":"published","page":"lectures/01-what-is-ai.md"},"terms":[{"id":"T01-1","name":"AI効果","desc":"AIで実現された技術が「ただの自動化で知能ではない」とみなされ、AIと呼ばれなくなっていく現象。","sup":false,"aka":[],"note":null},{"id":"T01-2","name":"エージェント","desc":"環境を観測し、目的に向けて自分で行動を選ぶ主体。ソフトウェアやロボットを指す。","sup":false,"aka":[],"note":null},{"id":"T01-3","name":"人工知能","desc":"推論や学習など人間の知的なふるまいを、コンピュータで実現しようとする技術や研究分野。定義は専門家の間でも統一されていない。","sup":false,"aka":[],"note":null},{"id":"T01-4","name":"機械学習","desc":"データから規則やパターンを学び、予測や判断に使えるようにする手法の総称。","sup":false,"aka":[],"note":null},{"id":"T01-5","name":"ディープラーニング","desc":"多層のニューラルネットワークで、特徴の取り出し方までデータから学ぶ機械学習の手法。","sup":false,"aka":[],"note":null}]},{"id":"T02","name":"人工知能分野で議論される問題","short":"AI分野の難問","category":"人工知能とは","area":"技術分野","lecture":{"number":1,"title":"人工知能とは？ 定義と「AIの難問」","status":"published","page":"lectures/01-what-is-ai.md"},"terms":[{"id":"T02-1","name":"シンギュラリティ","desc":"AIが人間の知能を超え、その後の進歩を人間が予測できなくなるとされる転換点（技術的特異点）。カーツワイルは2045年と予測した。","sup":false,"aka":[],"note":null},{"id":"T02-2","name":"シンボルグラウンディング問題","desc":"記号（言葉）と、それが指す実世界の意味をコンピュータがどう結びつけるかという問題。ハルナッドが1990年に提起した。","sup":false,"aka":[],"note":null},{"id":"T02-3","name":"身体性","desc":"知能が成り立つには、身体を通じて環境とかかわる経験が必要だとする考え方。","sup":false,"aka":[],"note":null},{"id":"T02-4","name":"ダートマス会議","desc":"1956年に開かれ、「人工知能（Artificial Intelligence）」という言葉が初めて使われた研究集会。マッカーシーらが提案した。","sup":false,"aka":[],"note":null},{"id":"T02-5","name":"トイ・プロブレム","desc":"迷路やパズルのように、ルールとゴールがはっきりした簡単な問題。第1次ブームのAIはこれしか解けないと批判された。","sup":false,"aka":[],"note":null},{"id":"T02-6","name":"知識獲得のボトルネック","desc":"専門家の知識を聞き出してルールに書き起こす作業が膨大で難しく、エキスパートシステムの壁になった問題。","sup":false,"aka":[],"note":null},{"id":"T02-7","name":"チューリングテスト","desc":"人が文字だけで会話し、相手が機械か人間かを見分けられなければ機械に知能があるとみなすテスト。チューリングが1950年に提案した。","sup":false,"aka":[],"note":null},{"id":"T02-8","name":"中国語の部屋","desc":"規則どおりに記号を操作できても、意味を理解しているとは限らないことを示す思考実験。サールが1980年に発表し、強いAIを批判した。","sup":false,"aka":[],"note":null},{"id":"T02-9","name":"強いAIと弱いAI","desc":"人のように本当に心や理解をもつAI（強いAI）と、知的にふるまう道具としてのAI（弱いAI）を分ける考え方。サールが提唱した。","sup":false,"aka":[],"note":null},{"id":"T02-10","name":"統計的機械翻訳","desc":"大量の対訳データから単語や句の対応の確率を学び、もっともらしい訳を選ぶ機械翻訳。ニューラル機械翻訳の前に主流だった。","sup":false,"aka":[],"note":null},{"id":"T02-11","name":"フレーム問題","desc":"処理能力に限りがあるAIが、課題に関係することだけを選び出して考えることの難しさ。マッカーシーとヘイズが1969年に提起した。","sup":false,"aka":[],"note":null},{"id":"T02-12","name":"ルールベース機械翻訳","desc":"人が書いた文法の規則と辞書に基づいて訳す、初期の機械翻訳の方式。","sup":false,"aka":[],"note":null},{"id":"T02-13","name":"ローブナーコンテスト","desc":"チューリングテストの考え方で、最も人間らしい会話をするプログラムを競う大会。1991年に始まった。","sup":false,"aka":[],"note":null}]}]},{"id":"history","order":2,"domain":"hist","color":"#1F72B3","name":"人工知能をめぐる動向（AIブームの歴史）","short":"AIブームの歴史","shortLines":["AIブーム","の歴史"],"priority":"mid","badges":[],"summary":"探索・推論（第1次ブーム）、知識表現とエキスパートシステム（第2次ブーム）、機械学習とディープラーニング（第3次ブーム）と続くAIの歴史。各時代の代表的なシステムと、ブームが終わった理由をセットで覚える。","themes":["第1次ブーム：探索・推論（探索木、Mini-Max法、SHRDLU、STRIPS）","第2次ブーム：知識表現とエキスパートシステム（MYCIN、DENDRAL、知識獲得のボトルネック）","機械学習が注目された背景（ビッグデータ、次元の呪い）","第3次ブーム：ILSVRC 2012、AlphaGo、生成AI"],"keywords":["幅優先探索","深さ優先探索","αβ法","マイシン (MYCIN)","オントロジー","ワトソン","ILSVRC","ネオコグニトロン","アルファ碁 (AlphaGo)"],"examPoint":"年代・人物・システム名の組合せと、各ブームの特徴（何ができて何が壁になったか）を問う。","examTrap":"幅優先探索（最短の解が見つかる・メモリを多く使う）と深さ優先探索（メモリが少ない・最短とは限らない）の特徴の入れ替えに注意。","priorityReason":"JDLA公式の例題Q2（G2022#1、エキスパートシステム）と例題Q3（G2022#1、ILSVRCとResNet）が題材にしている。シラバス1.3版で項目「ディープラーニング」のLLMが「生成AI」に変わり、統計的自然言語処理が追加された。キーワード数は36語。","items":["T03","T04","T05","T06"],"subShort":{"T04":"知識表現・専門家システム"},"subs":[{"id":"T03","name":"探索・推論","short":"探索・推論","category":"人工知能をめぐる動向","area":"技術分野","lecture":{"number":2,"title":"探索・推論と知識表現（第1次・第2次AIブーム）","status":"planned","page":null},"terms":[{"id":"T03-1","name":"αβ法","desc":"Mini-Max法で、結果に影響しない枝の探索を打ち切って（枝刈り）計算を減らす手法。","sup":false,"aka":["アルファベータ法","α-β法"],"note":null},{"id":"T03-2","name":"Mini-Max法","desc":"自分は得点を最大に、相手は最小にする手を選ぶと考えて、ゲームの最善手を探す方法。","sup":false,"aka":["ミニマックス法","Min-Max法"],"note":null},{"id":"T03-3","name":"SHRDLU","desc":"積み木の世界で、英語の指示を理解して積み木を動かすシステム。ウィノグラードが1970年ごろに開発した。","sup":false,"aka":[],"note":null},{"id":"T03-4","name":"STRIPS","desc":"「前提条件・行動・結果」で行動を記述し、計画を自動で立てるプランニングの代表的な手法。1971年に発表された。","sup":false,"aka":[],"note":null},{"id":"T03-5","name":"探索木","desc":"問題の状態を節、状態の移り変わりを枝として、木の形に表したもの。","sup":false,"aka":[],"note":null},{"id":"T03-6","name":"ハノイの塔","desc":"円盤を決まった規則で別の柱へ移すパズル。探索で解く問題の代表例。","sup":false,"aka":[],"note":null},{"id":"T03-7","name":"幅優先探索","desc":"出発点に近い節から順に、同じ深さを全部調べてから次の深さへ進む探索。最短の解が見つかるがメモリを多く使う。","sup":false,"aka":[],"note":null},{"id":"T03-8","name":"深さ優先探索","desc":"1本の枝を行けるところまで深く進み、行き止まりなら戻って別の枝を調べる探索。メモリは少なくて済むが最短の解とは限らない。","sup":false,"aka":[],"note":null},{"id":"T03-9","name":"ブルートフォース","desc":"考えられるすべての組合せを、総当たりで調べる方法。","sup":false,"aka":[],"note":null},{"id":"T03-10","name":"モンテカルロ法","desc":"ランダムなシミュレーション（プレイアウト）を何度も行い、その結果から手のよさを評価する方法。囲碁AIで使われた。","sup":false,"aka":[],"note":null}]},{"id":"T04","name":"知識表現とエキスパートシステム","short":"知識表現・専門家システム","category":"人工知能をめぐる動向","area":"技術分野","lecture":{"number":2,"title":"探索・推論と知識表現（第1次・第2次AIブーム）","status":"planned","page":null},"terms":[{"id":"T04-1","name":"Cycプロジェクト","desc":"人間の一般常識をすべて知識ベースに書き込もうとするプロジェクト。レナートが1984年に始めた。","sup":false,"aka":[],"note":null},{"id":"T04-2","name":"DENDRAL","desc":"化合物の質量分析のデータから分子の構造を推定する、最初期のエキスパートシステム。1960年代にスタンフォード大学で開発された。","sup":false,"aka":[],"note":null},{"id":"T04-3","name":"is-aの関係・has-aの関係・part-ofの関係","desc":"概念のつながりを表す関係。「〜は〜の一種」「〜は〜を持つ」「〜は〜の一部」。","sup":false,"aka":[],"note":null},{"id":"T04-4","name":"Question-Answering","desc":"自然文の質問に対して、知識ベースや文書から答えを見つけて返す技術。","sup":false,"aka":["QuestionAnswering","質問応答システム"],"note":null},{"id":"T04-5","name":"意味ネットワーク","desc":"概念を節、概念どうしの関係を矢印で結び、知識を網の目のように表す方法。","sup":false,"aka":[],"note":null},{"id":"T04-6","name":"イライザ (ELIZA)","desc":"決まったパターンに当てはめて相手の言葉を言い換えて返す、初期の対話プログラム。ワイゼンバウムが1966年に発表した。","sup":false,"aka":[],"note":null},{"id":"T04-7","name":"インタビューシステム","desc":"専門家への聞き取りを支援し、知識を引き出してエキスパートシステムに取り込むための仕組み。","sup":false,"aka":[],"note":null},{"id":"T04-8","name":"ウェブマイニング","desc":"Webページの文章やリンク、利用の履歴などから役に立つ知識を取り出すこと。","sup":false,"aka":[],"note":null},{"id":"T04-9","name":"オントロジー","desc":"ある分野の概念と、その関係を体系的に定義したもの。知識を共有・再利用するための「概念の辞書」。","sup":false,"aka":[],"note":null},{"id":"T04-10","name":"セマンティックWeb","desc":"Webの情報に意味を表すデータ（メタデータ）を付け、コンピュータが内容を理解して処理できるようにする構想。","sup":false,"aka":["セマンティック・ウェブ","Semantic Web"],"note":null},{"id":"T04-11","name":"データマイニング","desc":"大量のデータから、規則性や関係などの役に立つ知識を掘り起こすこと。","sup":false,"aka":[],"note":null},{"id":"T04-12","name":"東ロボくん","desc":"東京大学の入試合格を目標にした、国立情報学研究所のAIプロジェクト（2011年開始）。文章の読解の難しさが明らかになった。","sup":false,"aka":[],"note":null},{"id":"T04-13","name":"マイシン (MYCIN)","desc":"血液の感染症の患者に合う抗生物質を推薦するエキスパートシステム。1970年代にスタンフォード大学で開発された。","sup":false,"aka":[],"note":null},{"id":"T04-14","name":"ワトソン","desc":"IBMの質問応答システム。2011年にアメリカのクイズ番組で人間のチャンピオンに勝った。","sup":false,"aka":[],"note":null}]},{"id":"T05","name":"機械学習","short":"機械学習","category":"人工知能をめぐる動向","area":"技術分野","lecture":{"number":3,"title":"機械学習とディープラーニングの登場（第3次AIブーム〜生成AI）","status":"planned","page":null},"terms":[{"id":"T05-1","name":"次元の呪い","desc":"特徴量の次元が増えると、必要なデータ量や計算量が急激に増え、学習がうまくいかなくなる現象。","sup":false,"aka":[],"note":null},{"id":"T05-2","name":"スパムフィルタ","desc":"迷惑メールかどうかを、過去のメールから学習して自動で振り分ける仕組み。機械学習の代表的な応用。","sup":false,"aka":["スパムフィルター"],"note":null},{"id":"T05-3","name":"ビッグデータ","desc":"量がとても多く、種類も多様で、次々に生まれるデータ。機械学習が実用になった背景の一つ。","sup":false,"aka":[],"note":null},{"id":"T05-4","name":"レコメンデーションエンジン","desc":"利用者の行動の履歴などから、好みに合いそうな商品やコンテンツを推薦する仕組み。","sup":false,"aka":[],"note":null},{"id":"T05-5","name":"統計的自然言語処理","desc":"大量の文章データから確率や統計を使って言語を扱う手法。人が規則を書く方法に代わって主流になった。","sup":false,"aka":[],"note":null}]},{"id":"T06","name":"ディープラーニング","short":"ディープラーニング","category":"人工知能をめぐる動向","area":"技術分野","lecture":{"number":3,"title":"機械学習とディープラーニングの登場（第3次AIブーム〜生成AI）","status":"planned","page":null},"terms":[{"id":"T06-1","name":"ImageNet","desc":"1,400万枚を超える画像に物体の名前のラベルを付けた、大規模なデータセット。画像認識の研究を大きく進めた。","sup":false,"aka":[],"note":null},{"id":"T06-2","name":"ILSVRC","desc":"ImageNetを使った画像認識の国際コンテスト。2012年にディープラーニングのAlexNetが大差で優勝した。","sup":false,"aka":[],"note":null},{"id":"T06-3","name":"LeNet","desc":"ルカンらが開発した初期の畳み込みニューラルネットワーク。手書きの数字の認識に使われた。","sup":false,"aka":[],"note":null},{"id":"T06-4","name":"アルファ碁 (AlphaGo)","desc":"DeepMindが開発した囲碁のAI。2016年にトップ棋士のイ・セドルに勝った。","sup":false,"aka":[],"note":null},{"id":"T06-5","name":"人間の神経回路","desc":"ニューラルネットワークの発想のもとになった、脳の神経細胞（ニューロン）のつながり。","sup":false,"aka":[],"note":null},{"id":"T06-6","name":"ネオコグニトロン","desc":"福島邦彦が1979年に発表した、視覚の仕組みをまねた多層のネットワーク。CNNの原型とされる。","sup":false,"aka":[],"note":null},{"id":"T06-7","name":"生成AI","desc":"学習したデータをもとに、文章・画像・音声などの新しいコンテンツを作り出すAI。","sup":false,"aka":[],"note":null}]}]},{"id":"ml","order":3,"domain":"mlbase","color":"#0B7064","name":"機械学習の手法（教師あり・教師なし・強化学習）","short":"機械学習の手法","shortLines":["機械学習","の手法"],"priority":"high","badges":[],"summary":"正解つきのデータから学ぶ教師あり学習、正解なしで構造を見つける教師なし学習、試行錯誤で報酬を最大にする強化学習。3つの違いと、それぞれの代表的なモデルが出発点になる。","themes":["回帰問題と分類問題、代表的なモデル（線形回帰・ロジスティック回帰・SVM・決定木）","アンサンブル学習（バギングとブースティング、ランダムフォレスト）","クラスタリング・次元削減・トピックモデル","レコメンデーション（協調フィルタリングとコンテンツベース）","強化学習の枠組み（マルコフ決定過程・価値関数・方策）とQ学習・SARSA"],"keywords":["回帰問題","分類問題","ロジスティック回帰","サポートベクターマシン (SVM)","ランダムフォレスト","k-means法","主成分分析 (PCA)","協調フィルタリング","Q学習","ε-greedy方策"],"examPoint":"具体的な場面（売上の予測、顧客のグループ分けなど）に合う手法を選ばせる形や、手法の名前と特徴の組合せを問う。","examTrap":"ロジスティック回帰は名前に「回帰」とあるが分類のモデル。バギング（並列に学習して平均）とブースティング（順番に学習して間違いを補う）の違いにも注意。","priorityReason":"JDLA公式の例題Q4（G2022#3、重回帰分析）と例題Q5（G2024#6、レコメンデーションの手法）が題材にしている。シラバス1.3版で単回帰分析・SARSAが追加され、Adaboostが削除された。キーワード数は46語で、分野の中で多い。","items":["T07","T08","T09"],"subs":[{"id":"T07","name":"教師あり学習","short":"教師あり学習","category":"機械学習の概要","area":"技術分野","lecture":{"number":4,"title":"教師あり学習（回帰・分類・アンサンブル）","status":"planned","page":null},"terms":[{"id":"T07-1","name":"アンサンブル学習","desc":"複数のモデルを組み合わせ、多数決や平均で1つのモデルより精度を高める手法。","sup":false,"aka":[],"note":null},{"id":"T07-2","name":"カーネル","desc":"データを高い次元の空間に写したときの内積を、直接計算するための関数。SVMで使う。","sup":false,"aka":[],"note":null},{"id":"T07-3","name":"カーネルトリック","desc":"高い次元への写像を実際には計算せず、カーネル関数だけで内積を求めて計算量を抑える工夫。","sup":false,"aka":[],"note":null},{"id":"T07-4","name":"回帰問題","desc":"売上や気温のように、連続した数値を予測する問題。","sup":false,"aka":[],"note":null},{"id":"T07-5","name":"決定木","desc":"条件による分岐を木の形に重ねて、分類や回帰を行うモデル。判断の理由がわかりやすい。","sup":false,"aka":[],"note":null},{"id":"T07-6","name":"勾配ブースティング","desc":"前のモデルの誤差（残差）を次の弱いモデルが補うように、順番に足し合わせていく手法。","sup":false,"aka":[],"note":null},{"id":"T07-7","name":"サポートベクターマシン (SVM)","desc":"クラスの境界と、境界に最も近いデータ（サポートベクター）との距離を最大にする分類のモデル。","sup":false,"aka":[],"note":null},{"id":"T07-8","name":"線形回帰","desc":"説明変数と目的変数の関係を、直線（一次式）で表して予測する回帰のモデル。","sup":false,"aka":[],"note":null},{"id":"T07-9","name":"自己回帰モデル (ARモデル)","desc":"時系列データの今の値を、過去の自分自身の値の組合せで表すモデル。","sup":false,"aka":[],"note":null},{"id":"T07-10","name":"単回帰分析","desc":"1つの説明変数で、目的変数を予測する線形回帰。","sup":false,"aka":[],"note":null},{"id":"T07-11","name":"重回帰分析","desc":"2つ以上の説明変数で、目的変数を予測する線形回帰。","sup":false,"aka":[],"note":null},{"id":"T07-12","name":"多クラス分類","desc":"3つ以上のクラスのうち、どれに当てはまるかを予測する分類問題。","sup":false,"aka":[],"note":null},{"id":"T07-13","name":"バギング","desc":"データからランダムに作った複数の標本で別々にモデルを学習し、結果をまとめるアンサンブル学習。","sup":false,"aka":[],"note":null},{"id":"T07-14","name":"ブースティング","desc":"前のモデルが間違えたデータを重視しながら、モデルを順番に学習していくアンサンブル学習。","sup":false,"aka":[],"note":null},{"id":"T07-15","name":"ブートストラップサンプリング","desc":"元のデータから、重複を許してランダムにデータを取り出し、新しい標本を作る方法。","sup":false,"aka":[],"note":null},{"id":"T07-16","name":"分類問題","desc":"データがどのグループ（クラス）に属するかを予測する問題。","sup":false,"aka":[],"note":null},{"id":"T07-17","name":"ベクトル自己回帰モデル (VARモデル)","desc":"複数の時系列データを、互いの過去の値も使って同時に表す自己回帰モデル。","sup":false,"aka":[],"note":null},{"id":"T07-18","name":"マージン最大化","desc":"クラスの境界と、最も近いデータとの距離をできるだけ大きくとるSVMの考え方。","sup":false,"aka":[],"note":null},{"id":"T07-19","name":"ランダムフォレスト","desc":"特徴量とデータをランダムに選んだ多数の決定木の多数決で予測する、バギングの手法。","sup":false,"aka":[],"note":null},{"id":"T07-20","name":"ロジスティック回帰","desc":"入力の重み付きの和をシグモイド関数で0〜1の確率に変える、分類のためのモデル。","sup":false,"aka":[],"note":null}]},{"id":"T08","name":"教師なし学習","short":"教師なし学習","category":"機械学習の概要","area":"技術分野","lecture":{"number":5,"title":"教師なし学習（クラスタリング・次元削減・推薦）","status":"planned","page":null},"terms":[{"id":"T08-1","name":"k-means法","desc":"データを指定したk個のグループに分けるクラスタリングの手法。各グループの中心の計算と、データの割り当てを繰り返す。","sup":false,"aka":[],"note":null},{"id":"T08-2","name":"t-SNE","desc":"高い次元のデータの近さの関係を保ったまま、2次元や3次元に縮めて可視化する手法。","sup":false,"aka":[],"note":null},{"id":"T08-3","name":"ウォード法","desc":"まとめたときのばらつきの増え方が最も小さい組から順に結合していく、階層的クラスタリングの手法。","sup":false,"aka":[],"note":null},{"id":"T08-4","name":"協調フィルタリング","desc":"好みが似ているほかの利用者の行動の履歴をもとに推薦する方法。","sup":false,"aka":[],"note":null},{"id":"T08-5","name":"クラスタリング","desc":"正解のラベルなしで、似たデータどうしをグループにまとめる手法。","sup":false,"aka":[],"note":null},{"id":"T08-6","name":"コールドスタート問題","desc":"新しい利用者や商品には履歴がないため、協調フィルタリングでは推薦が難しい問題。","sup":false,"aka":[],"note":null},{"id":"T08-7","name":"コンテンツベースフィルタリング","desc":"商品の特徴（ジャンルや説明文など）と利用者の好みを照らし合わせて推薦する方法。履歴の少ない商品でも推薦できる。","sup":false,"aka":[],"note":null},{"id":"T08-8","name":"次元削減","desc":"データの情報をなるべく保ったまま、特徴量の数（次元）を減らすこと。","sup":false,"aka":[],"note":null},{"id":"T08-9","name":"主成分分析 (PCA)","desc":"データのばらつきが最も大きい方向から順に新しい軸（主成分）をとり、少ない次元で表す手法。","sup":false,"aka":[],"note":null},{"id":"T08-10","name":"潜在的ディリクレ配分法 (LDA)","desc":"文書は複数のトピックが混ざったもので、トピックごとに単語の出やすさが違うと考えるトピックモデル。","sup":false,"aka":[],"note":null},{"id":"T08-11","name":"多次元尺度構成法 (MDS)","desc":"データどうしの距離の関係をできるだけ保って、低い次元に配置する手法。","sup":false,"aka":[],"note":null},{"id":"T08-12","name":"デンドログラム (樹形図)","desc":"階層的クラスタリングで、データがまとまっていく順番を木の形に表した図。","sup":false,"aka":[],"note":null},{"id":"T08-13","name":"特異値分解 (SVD)","desc":"行列を3つの行列の積に分解する方法。次元削減や推薦に使う。","sup":false,"aka":[],"note":null},{"id":"T08-14","name":"トピックモデル","desc":"文書の集まりから、その背後にある話題（トピック）を推定するモデル。","sup":false,"aka":[],"note":null}]},{"id":"T09","name":"強化学習","short":"強化学習","category":"機械学習の概要","area":"技術分野","lecture":{"number":6,"title":"強化学習","status":"planned","page":null},"terms":[{"id":"T09-1","name":"Actor-Critic","desc":"行動を選ぶ役（Actor）と、その行動を評価する役（Critic）を組み合わせた強化学習の手法。","sup":false,"aka":[],"note":null},{"id":"T09-2","name":"ε-greedy方策","desc":"確率εでランダムに行動を試し（探索）、それ以外は今いちばん良い行動を選ぶ（活用）方策。","sup":false,"aka":["ε-greedy","イプシロングリーディ"],"note":null},{"id":"T09-3","name":"REINFORCE","desc":"得られた報酬をもとに方策のパラメータを直接更新する、方策勾配法の基本的なアルゴリズム。","sup":false,"aka":[],"note":null},{"id":"T09-4","name":"Q学習","desc":"行動価値（Q値）を、次の状態で最も大きいQ値を使って更新していく強化学習の手法。","sup":false,"aka":[],"note":null},{"id":"T09-5","name":"UCB方策","desc":"これまでの平均の報酬に、試した回数が少ない行動ほど大きくなる上乗せをして行動を選ぶ方策。","sup":false,"aka":[],"note":null},{"id":"T09-6","name":"行動価値関数","desc":"ある状態である行動をとったとき、その後に得られる報酬の合計の期待値を表す関数（Q関数）。","sup":false,"aka":[],"note":null},{"id":"T09-7","name":"状態価値関数","desc":"ある状態から方策に従って行動したとき、得られる報酬の合計の期待値を表す関数。","sup":false,"aka":[],"note":null},{"id":"T09-8","name":"バンディットアルゴリズム","desc":"当たりの確率がわからない複数の選択肢から、探索と活用のバランスをとって報酬を最大にする手法。","sup":false,"aka":[],"note":null},{"id":"T09-9","name":"方策勾配法","desc":"方策そのものをパラメータで表し、報酬が増える方向へパラメータを更新する強化学習の手法。","sup":false,"aka":[],"note":null},{"id":"T09-10","name":"マルコフ決定過程","desc":"次の状態が今の状態と行動だけで決まる性質（マルコフ性）を前提にした、強化学習の問題の枠組み。","sup":false,"aka":[],"note":null},{"id":"T09-11","name":"割引率","desc":"将来の報酬をどれだけ割り引いて評価するかを決める、0〜1の値。","sup":false,"aka":[],"note":null},{"id":"T09-12","name":"SARSA","desc":"実際に選んだ次の行動のQ値を使って行動価値を更新する手法。Q学習と違い、今の方策に沿って学ぶ（方策オン型）。","sup":false,"aka":[],"note":null}]}]},{"id":"eval","order":4,"domain":"mlbase","color":"#0C6670","name":"モデルの評価と数理・統計","short":"評価と数理・統計","shortLines":["評価と","数理・統計"],"priority":"high","badges":[],"summary":"作ったモデルが本当に役に立つかを確かめる評価の方法と指標、そしてその土台になる確率・統計の知識。適合率と再現率のように、似た指標の違いをはっきりさせることが大切。","themes":["混同行列と正解率・適合率・再現率・F値、ROC曲線・AUC","回帰の評価指標（MSE・RMSE・MAE）","過学習と汎化性能、交差検証とホールドアウト検証","モデル選択の基準（AIC・BIC・オッカムの剃刀）","代表値・散らばり・相関、確率分布、仮説検定、距離と類似度"],"keywords":["混同行列","正解率・適合率・再現率・F値","ROC曲線・AUC","過学習","k-分割交差検証","平均二乗誤差 (MSE)","相関係数","期待値","正規分布","コサイン類似度"],"examPoint":"指標の定義を場面に当てはめる問題（見逃しを減らしたいなら再現率など）や、簡単な計算（期待値・分散など）が出る。","examTrap":"適合率（陽性と予測した中の正しさ）と再現率（本当の陽性をどれだけ拾えたか）の取り違え、共分散と相関係数の違いに注意。","priorityReason":"JDLA公式の例題Q15（G2022#1、相関係数・偏相関係数・共分散・分散）と例題Q16（G2022#3、期待値）が題材にしている。シラバス2024でMSE・RMSE・MAEが追加され、1.3版で真陽性・真陰性が追加された。キーワード数は45語で、分野の中で多い。","items":["T10","T37"],"subShort":{"T37":"数理・統計知識"},"subs":[{"id":"T10","name":"モデルの選択・評価","short":"モデルの選択・評価","category":"機械学習の概要","area":"技術分野","lecture":{"number":7,"title":"モデルの選択・評価","status":"planned","page":null},"terms":[{"id":"T10-1","name":"k-分割交差検証","desc":"データをk個に分け、1つを検証用・残りを学習用にする組合せを入れ替えながら、k回評価する方法。","sup":false,"aka":["k分割交差検証"],"note":null},{"id":"T10-2","name":"平均二乗誤差 (MSE)","desc":"予測値と正解の差を2乗して平均した値。大きな誤差を重く評価する。","sup":false,"aka":[],"note":null},{"id":"T10-3","name":"二乗平均平方根誤差 (RMSE)","desc":"MSEの平方根。元のデータと同じ単位で誤差の大きさを表す。","sup":false,"aka":[],"note":null},{"id":"T10-4","name":"平均絶対値誤差 (MAE)","desc":"予測値と正解の差の絶対値の平均。外れ値の影響を受けにくい。","sup":false,"aka":[],"note":null},{"id":"T10-5","name":"ROC曲線・AUC","desc":"しきい値を変えたときの偽陽性率と真陽性率の関係を描いた曲線（ROC曲線）と、その下の面積（AUC）。1に近いほど性能が良い。","sup":false,"aka":[],"note":null},{"id":"T10-6","name":"赤池情報量規準 (AIC)","desc":"モデルの当てはまりの良さと、パラメータの多さ（複雑さ）の両方からモデルを選ぶための指標。小さいほど良い。","sup":false,"aka":[],"note":null},{"id":"T10-7","name":"オッカムの剃刀","desc":"同じくらいうまく説明できるなら、より単純なモデルを選ぶべきだという考え方。","sup":false,"aka":[],"note":null},{"id":"T10-8","name":"過学習","desc":"学習データに合わせすぎて、未知のデータでの性能が下がる状態。","sup":false,"aka":[],"note":null},{"id":"T10-9","name":"交差検証","desc":"データを学習用と検証用に分け、学習に使っていないデータで性能を確かめる方法の総称。","sup":false,"aka":[],"note":null},{"id":"T10-10","name":"偽陽性・偽陰性","desc":"本当は陰性なのに陽性と予測すること（偽陽性）と、本当は陽性なのに陰性と予測すること（偽陰性）。","sup":false,"aka":[],"note":null},{"id":"T10-11","name":"真陽性・真陰性","desc":"陽性を正しく陽性と予測すること（真陽性）と、陰性を正しく陰性と予測すること（真陰性）。","sup":false,"aka":[],"note":null},{"id":"T10-12","name":"混同行列","desc":"予測と正解の組合せ（真陽性・偽陽性・偽陰性・真陰性）の件数をまとめた表。","sup":false,"aka":[],"note":null},{"id":"T10-13","name":"正解率・適合率・再現率・F値","desc":"全体のうち当たった割合（正解率）、陽性と予測した中で本当に陽性の割合（適合率）、本当の陽性のうち見つけられた割合（再現率）、適合率と再現率の調和平均（F値）。","sup":false,"aka":[],"note":null},{"id":"T10-14","name":"汎化性能","desc":"学習に使っていない未知のデータに対しても、正しく予測できる力。","sup":false,"aka":[],"note":null},{"id":"T10-15","name":"ベイズ情報量規準 (BIC)","desc":"AICと同じくモデルの良さと複雑さを比べる指標。データが多いほど複雑さへの罰が強くなる。","sup":false,"aka":[],"note":null},{"id":"T10-16","name":"ホールドアウト検証","desc":"データを学習用と検証用に一度だけ分けて評価する、最も単純な検証方法。","sup":false,"aka":[],"note":null}]},{"id":"T37","name":"AIに必要な数理・統計知識","short":"数理・統計知識","category":"AIに必要な数理・統計知識","area":"技術分野","lecture":{"number":21,"title":"AIに必要な数理・統計知識","status":"planned","page":null},"terms":[{"id":"T37-1","name":"移動平均","desc":"時系列データで、一定の期間の平均を少しずつずらしながら計算し、変動をならす方法。","sup":false,"aka":[],"note":null},{"id":"T37-2","name":"確率分布","desc":"確率変数がどの値をどのくらいの確率でとるかを表したもの。","sup":false,"aka":[],"note":null},{"id":"T37-3","name":"確率変数","desc":"サイコロの目のように、確率に従っていろいろな値をとる変数。","sup":false,"aka":[],"note":null},{"id":"T37-4","name":"確率密度","desc":"連続した値をとる確率変数で、その値の近くになりやすさを表す量。範囲で積分すると確率になる。","sup":false,"aka":[],"note":null},{"id":"T37-5","name":"疑似相関","desc":"2つの変数に因果関係がないのに、別の要因などによって相関があるように見えること。","sup":false,"aka":[],"note":null},{"id":"T37-6","name":"期待値","desc":"確率変数がとる値に、その確率をかけて足し合わせた平均的な値。","sup":false,"aka":[],"note":null},{"id":"T37-7","name":"帰無仮説","desc":"仮説検定で、否定されることを期待して立てる「差がない・効果がない」という仮説。","sup":false,"aka":[],"note":null},{"id":"T37-8","name":"共分散","desc":"2つの変数の偏差の積の平均。一緒に増えるか減るかの傾向を表すが、大きさは単位に左右される。","sup":false,"aka":[],"note":null},{"id":"T37-9","name":"コサイン類似度","desc":"2つのベクトルの向きがどれだけ近いかを、なす角のコサインで表した指標。文書や単語の似ている度合いに使う。","sup":false,"aka":[],"note":null},{"id":"T37-10","name":"最小二乗法","desc":"予測と実測の差の2乗の合計が最も小さくなるように、モデルのパラメータを決める方法。","sup":false,"aka":[],"note":null},{"id":"T37-11","name":"最頻値","desc":"データの中で最も多く現れる値。","sup":false,"aka":[],"note":null},{"id":"T37-12","name":"最尤法","desc":"観測されたデータが得られる確率（尤度）が最も大きくなるように、パラメータを決める方法。","sup":false,"aka":[],"note":null},{"id":"T37-13","name":"条件付き確率","desc":"ある出来事が起きたという条件のもとで、別の出来事が起きる確率。","sup":false,"aka":[],"note":null},{"id":"T37-14","name":"正規分布","desc":"平均を中心に左右対称の釣り鐘型をした確率分布。多くの自然現象に見られる。","sup":false,"aka":[],"note":null},{"id":"T37-15","name":"相関係数","desc":"2つの変数の直線的な関係の強さを、−1〜1で表した指標。共分散をそれぞれの標準偏差で割って求める。","sup":false,"aka":[],"note":null},{"id":"T37-16","name":"相互情報量","desc":"一方の変数を知ることで、もう一方の不確かさがどれだけ減るかを表す量。","sup":false,"aka":[],"note":null},{"id":"T37-17","name":"対立仮説","desc":"仮説検定で、帰無仮説が否定されたときに採用する「差がある・効果がある」という仮説。","sup":false,"aka":[],"note":null},{"id":"T37-18","name":"中央値","desc":"データを小さい順に並べたとき、真ん中にくる値。外れ値の影響を受けにくい。","sup":false,"aka":[],"note":null},{"id":"T37-19","name":"度数分布","desc":"データを区間に分け、それぞれの区間に入る個数を数えて整理したもの。ヒストグラムで表す。","sup":false,"aka":[],"note":null},{"id":"T37-20","name":"二項分布","desc":"成功の確率がpの試行をn回繰り返したときの、成功の回数の確率分布。","sup":false,"aka":[],"note":null},{"id":"T37-21","name":"外れ値","desc":"ほかのデータから大きく離れた値。平均などの統計量や学習の結果をゆがめることがある。","sup":false,"aka":[],"note":null},{"id":"T37-22","name":"標準偏差","desc":"分散の平方根。データのばらつきを、元の単位で表す。","sup":false,"aka":[],"note":null},{"id":"T37-23","name":"平均","desc":"データの値をすべて足して、個数で割った値。","sup":false,"aka":[],"note":null},{"id":"T37-24","name":"分散","desc":"各データと平均との差（偏差）を2乗して平均した値。ばらつきの大きさを表す。","sup":false,"aka":[],"note":null},{"id":"T37-25","name":"偏相関係数","desc":"ほかの変数の影響を取り除いたうえで、2つの変数の相関の強さを表す指標。","sup":false,"aka":[],"note":null},{"id":"T37-26","name":"ベルヌーイ分布","desc":"成功（1）か失敗（0）かの、1回だけの試行の結果を表す確率分布。","sup":false,"aka":[],"note":null},{"id":"T37-27","name":"ポアソン分布","desc":"一定の時間や範囲の中で、まれな出来事が起きる回数の確率分布。","sup":false,"aka":[],"note":null},{"id":"T37-28","name":"マハラノビス距離","desc":"データのばらつきや、変数どうしの相関を考えに入れた距離。異常の検知に使う。","sup":false,"aka":[],"note":null},{"id":"T37-29","name":"ユークリッド距離","desc":"2点を結ぶ直線の長さで表す、いちばん普通の距離。","sup":false,"aka":[],"note":null}]}]},{"id":"nn","order":5,"domain":"dlcore","color":"#4752C4","name":"ニューラルネットワークの基本部品（構造・活性化関数・誤差関数・全結合層）","short":"NNの基本部品","shortLines":["NNの","基本部品"],"priority":"mid","badges":[],"summary":"ニューラルネットワークの骨組み（層とパーセプトロン）、出力を曲げる活性化関数、学習の目標を決める誤差関数。ディープラーニングのすべての技術の部品になる。","themes":["単純パーセプトロンと多層パーセプトロン（線形分離の限界）","CPU・GPU・TPUの違いと、GPUが学習に向く理由","活性化関数（シグモイド・tanh・ReLU・ソフトマックス）と勾配消失問題","誤差関数（平均二乗誤差・交差エントロピー・KL情報量・Contrastive Loss・Triplet Loss）"],"keywords":["単純パーセプトロン","多層パーセプトロン","GPU","ReLU関数","シグモイド関数","ソフトマックス関数","勾配消失問題","交差エントロピー","カルバック・ライブラー情報量 (KL)"],"examPoint":"活性化関数の出力の範囲や微分の大きさ、問題の種類に合う誤差関数の組合せ（回帰なら平均二乗誤差、分類なら交差エントロピー）を問う。","examTrap":"シグモイド関数の微分の最大値は0.25、tanh関数は1。KL情報量は2つの分布を入れ替えると値が変わる（対称ではない）。","priorityReason":"JDLA公式の例題Q6（G2024#6、KL情報量）と例題Q7（G2022#1、勾配消失問題）が題材にしている。シラバス2024でContrastive Loss・KL情報量が追加された。キーワード数は19語で、少なめ。","items":["T11","T12","T13","T17"],"subShort":{"T11":"NNとディープラーニング"},"subs":[{"id":"T11","name":"ニューラルネットワークとディープラーニング","short":"NNとディープラーニング","category":"ディープラーニングの概要","area":"技術分野","lecture":{"number":8,"title":"ニューラルネットワークと活性化関数","status":"planned","page":null},"terms":[{"id":"T11-1","name":"CPU","desc":"汎用の計算装置。複雑な処理を順番にこなすのが得意で、大量の単純な計算を並列に行うのは苦手。","sup":false,"aka":[],"note":null},{"id":"T11-2","name":"GPU","desc":"もとは画像処理用の、単純な計算を大量に並列で行える装置。行列の計算が多いディープラーニングの学習を大きく速くした。","sup":false,"aka":[],"note":null},{"id":"T11-3","name":"TPU","desc":"Googleが開発した、ディープラーニングのテンソル計算に特化した装置。","sup":false,"aka":[],"note":null},{"id":"T11-4","name":"隠れ層・入力層・出力層","desc":"データを受け取る層（入力層）、途中で特徴を変換する層（隠れ層）、結果を出す層（出力層）。","sup":false,"aka":[],"note":null},{"id":"T11-5","name":"多層パーセプトロン","desc":"入力層と出力層の間に隠れ層をもつニューラルネットワーク。線形分離できない問題も扱える。","sup":false,"aka":[],"note":null},{"id":"T11-6","name":"単純パーセプトロン","desc":"入力層と出力層だけの最も単純なニューラルネットワーク。線形分離できる問題しか解けない。","sup":false,"aka":[],"note":null}]},{"id":"T12","name":"活性化関数","short":"活性化関数","category":"ディープラーニングの概要","area":"技術分野","lecture":{"number":8,"title":"ニューラルネットワークと活性化関数","status":"planned","page":null},"terms":[{"id":"T12-1","name":"Leaky ReLU関数","desc":"入力が負のときにもわずかな傾きをもたせたReLU関数。負の側で勾配が0になる問題を和らげる。","sup":false,"aka":[],"note":null},{"id":"T12-2","name":"ReLU関数","desc":"入力が正ならそのまま、負なら0を出す活性化関数。勾配消失が起きにくく、隠れ層で広く使われる。","sup":false,"aka":[],"note":null},{"id":"T12-3","name":"tanh関数","desc":"出力が−1〜1になる活性化関数。微分の最大値は1で、シグモイド関数より勾配が消えにくい。","sup":false,"aka":[],"note":null},{"id":"T12-4","name":"シグモイド関数","desc":"出力が0〜1になるS字型の活性化関数。微分の最大値が0.25と小さく、層が深いと勾配消失が起きやすい。","sup":false,"aka":[],"note":null},{"id":"T12-5","name":"ソフトマックス関数","desc":"複数の出力を、合計が1になる確率に変える活性化関数。多クラス分類の出力層で使う。","sup":false,"aka":[],"note":null},{"id":"T12-6","name":"勾配消失問題","desc":"誤差逆伝播で層をさかのぼるほど勾配が小さくなり、入力に近い層が学習できなくなる問題。微分の小さい活性化関数で起きやすい。","sup":false,"aka":[],"note":null}]},{"id":"T13","name":"誤差関数","short":"誤差関数","category":"ディープラーニングの概要","area":"技術分野","lecture":{"number":9,"title":"誤差関数・正則化・誤差逆伝播法","status":"planned","page":null},"terms":[{"id":"T13-1","name":"Contrastive Loss","desc":"同じ組のデータは近く、違う組のデータは一定以上遠くなるように学習させる誤差関数。","sup":false,"aka":[],"note":null},{"id":"T13-2","name":"Triplet Loss","desc":"基準・同じ種類・違う種類の3つのデータを使い、同じ種類との距離が違う種類との距離より小さくなるように学習させる誤差関数。","sup":false,"aka":[],"note":null},{"id":"T13-3","name":"カルバック・ライブラー情報量 (KL)","desc":"2つの確率分布がどれだけ違うかを表す量。2つを入れ替えると値が変わる（非対称）。","sup":false,"aka":[],"note":null},{"id":"T13-4","name":"交差エントロピー","desc":"予測した確率分布と正解の分布のずれを表す量。分類問題の誤差関数として使う。","sup":false,"aka":[],"note":null},{"id":"T13-5","name":"平均二乗誤差関数","desc":"予測値と正解の差の2乗の平均を誤差とする関数。回帰問題で使う。","sup":false,"aka":[],"note":null}]},{"id":"T17","name":"全結合層","short":"全結合層","category":"ディープラーニングの要素技術","area":"技術分野","lecture":{"number":11,"title":"CNNの部品（全結合・畳み込み・正規化・プーリング・スキップ結合）","status":"planned","page":null},"terms":[{"id":"T17-1","name":"重み","desc":"入力にかける係数で、学習によって調整されるパラメータ。入力の重要度を表す。","sup":false,"aka":[],"note":null},{"id":"T17-2","name":"線形関数","desc":"入力に重みをかけて足し、バイアスを加えるだけの一次式の関数。全結合層の計算の中身。","sup":false,"aka":[],"note":null}]}]},{"id":"train","order":6,"domain":"dlcore","color":"#3A44A6","name":"学習の仕組みと最適化（正則化・誤差逆伝播法・最適化手法）","short":"学習と最適化","shortLines":["学習と","最適化"],"priority":"mid","badges":[],"summary":"ニューラルネットワークが重みを少しずつ直していく仕組み。誤差逆伝播法で勾配を求め、最適化手法で重みを更新し、正則化で過学習を防ぐ。","themes":["誤差逆伝播法と連鎖律、勾配消失問題・勾配爆発問題","勾配降下法の種類（バッチ・ミニバッチ・オンライン、SGD）","最適化手法の発展（モーメンタム→AdaGrad→RMSprop・AdaDelta→Adam→AdaBound・AMSBound）","局所最適解・鞍点、学習率とハイパーパラメータの探索","正則化（L1・L2、ドロップアウト）と早期終了"],"keywords":["誤差逆伝播法","連鎖律","確率的勾配降下法 (SGD)","Adam","学習率","局所最適解","鞍点","L1正則化","L2正則化","ドロップアウト","早期終了"],"examPoint":"最適化手法の改良の流れ（何を何で改善したか）や、正則化の効果の違い、エポックとイテレーションの区別を問う。","examTrap":"L1正則化は不要な重みを0にしやすく（特徴の選択）、L2正則化は重み全体を小さくする。ラッソ回帰がL1、リッジ回帰がL2。","priorityReason":"JDLA公式の例題Q7（G2022#1、勾配消失問題）が題材にしている。シラバス2024で連鎖律が追加された。キーワード数は35語。","items":["T14","T15","T16"],"subs":[{"id":"T14","name":"正則化","short":"正則化","category":"ディープラーニングの概要","area":"技術分野","lecture":{"number":9,"title":"誤差関数・正則化・誤差逆伝播法","status":"planned","page":null},"terms":[{"id":"T14-1","name":"L0正則化","desc":"0でないパラメータの個数に罰を与える正則化。計算が難しいため、L1正則化で代わりに近づけることが多い。","sup":false,"aka":[],"note":null},{"id":"T14-2","name":"L1正則化","desc":"パラメータの絶対値の和に罰を与える正則化。不要な重みが0になりやすく、特徴を選ぶ効果がある。","sup":false,"aka":[],"note":null},{"id":"T14-3","name":"L2正則化","desc":"パラメータの2乗の和に罰を与える正則化。重みを全体に小さくして、なめらかなモデルにする。","sup":false,"aka":[],"note":null},{"id":"T14-4","name":"正則化","desc":"誤差関数に罰則の項を加えるなどして、モデルが複雑になりすぎないようにし、過学習を防ぐ方法の総称。","sup":false,"aka":[],"note":null},{"id":"T14-5","name":"ドロップアウト","desc":"学習のたびに一部のニューロンをランダムに無効にして、過学習を防ぐ方法。","sup":false,"aka":[],"note":null},{"id":"T14-6","name":"ラッソ回帰","desc":"L1正則化を加えた線形回帰。","sup":false,"aka":[],"note":null},{"id":"T14-7","name":"リッジ回帰","desc":"L2正則化を加えた線形回帰。","sup":false,"aka":[],"note":null}]},{"id":"T15","name":"誤差逆伝播法","short":"誤差逆伝播法","category":"ディープラーニングの概要","area":"技術分野","lecture":{"number":9,"title":"誤差関数・正則化・誤差逆伝播法","status":"planned","page":null},"terms":[{"id":"T15-1","name":"勾配消失問題","desc":"入力側の層ほど勾配が小さくなり、学習が進まなくなる問題。活性化関数の微分を何度もかけ合わせるために起きる。","sup":false,"aka":[],"note":null},{"id":"T15-2","name":"勾配爆発問題","desc":"層をさかのぼるにつれて勾配が大きくなりすぎ、学習が不安定になる問題。","sup":false,"aka":[],"note":null},{"id":"T15-3","name":"信用割当問題","desc":"出力の誤差に対して、どのパラメータにどれだけ責任があるかを決める問題。誤差逆伝播法はこれを解く方法になった。","sup":false,"aka":[],"note":null},{"id":"T15-4","name":"連鎖律","desc":"合成関数の微分は、それぞれの関数の微分のかけ算で求められるという法則。誤差逆伝播法の土台。","sup":false,"aka":[],"note":null}]},{"id":"T16","name":"最適化手法","short":"最適化手法","category":"ディープラーニングの概要","area":"技術分野","lecture":{"number":10,"title":"最適化手法（勾配降下法とその仲間）","status":"planned","page":null},"terms":[{"id":"T16-1","name":"AdaBound","desc":"学習の初めはAdamのように動き、学習率に上限と下限を設けて、だんだんSGDに近づける最適化手法。","sup":false,"aka":[],"note":null},{"id":"T16-2","name":"AdaDelta","desc":"AdaGradで学習率が小さくなりすぎる問題を、直近の勾配の情報だけを使うことで改善した最適化手法。","sup":false,"aka":[],"note":null},{"id":"T16-3","name":"AdaGrad","desc":"よく更新されたパラメータほど学習率を小さくする最適化手法。学習が進むと学習率が小さくなりすぎることがある。","sup":false,"aka":[],"note":null},{"id":"T16-4","name":"Adam","desc":"モーメンタムとRMSpropの考え方を組み合わせた、広く使われる最適化手法。","sup":false,"aka":[],"note":null},{"id":"T16-5","name":"AMSBound","desc":"AMSGradに学習率の上限と下限を加え、だんだんSGDに近づける最適化手法。","sup":false,"aka":[],"note":null},{"id":"T16-6","name":"RMSprop","desc":"勾配の2乗の移動平均で学習率を調整し、AdaGradの学習率が小さくなりすぎる問題を改善した最適化手法。","sup":false,"aka":[],"note":null},{"id":"T16-7","name":"鞍点","desc":"ある方向では最小、別の方向では最大になっている点。勾配が0になるため学習が止まりやすい。","sup":false,"aka":[],"note":null},{"id":"T16-8","name":"イテレーション","desc":"パラメータを1回更新すること。ミニバッチ1つ分の学習にあたる。","sup":false,"aka":[],"note":null},{"id":"T16-9","name":"エポック","desc":"学習データ全体を1回使い切ること。","sup":false,"aka":[],"note":null},{"id":"T16-10","name":"オンライン学習","desc":"データを1件ずつ使って、そのつどパラメータを更新する学習方法。","sup":false,"aka":[],"note":null},{"id":"T16-11","name":"学習率","desc":"1回の更新でパラメータをどれだけ動かすかを決めるハイパーパラメータ。","sup":false,"aka":[],"note":null},{"id":"T16-12","name":"確率的勾配降下法 (SGD)","desc":"ランダムに選んだ一部のデータで勾配を計算し、パラメータを更新する方法。","sup":false,"aka":[],"note":null},{"id":"T16-13","name":"グリッドサーチ","desc":"ハイパーパラメータの候補の組合せを、格子状にすべて試して最良を選ぶ方法。","sup":false,"aka":[],"note":null},{"id":"T16-14","name":"勾配降下法","desc":"誤差関数の勾配（傾き）の逆向きにパラメータを少しずつ動かして、誤差を最小にする方法。","sup":false,"aka":[],"note":null},{"id":"T16-15","name":"局所最適解","desc":"周りと比べれば最小だが、全体では最小ではない解。","sup":false,"aka":[],"note":null},{"id":"T16-16","name":"早期終了","desc":"検証データでの誤差が下がらなくなった時点で学習を止め、過学習を防ぐ方法。","sup":false,"aka":[],"note":null},{"id":"T16-17","name":"大域最適解","desc":"全体の中で、本当に誤差が最小になる解。","sup":false,"aka":[],"note":null},{"id":"T16-18","name":"二重降下現象","desc":"モデルを大きくしたり学習を続けたりすると、テストでの誤差がいったん悪化したあと再び下がる現象。","sup":false,"aka":[],"note":null},{"id":"T16-19","name":"ノーフリーランチの定理","desc":"あらゆる問題に対して、ほかより常に優れた万能のアルゴリズムは存在しないという定理。","sup":false,"aka":[],"note":null},{"id":"T16-20","name":"ハイパーパラメータ","desc":"学習率や層の数など、学習の前に人が決めておく設定値。","sup":false,"aka":[],"note":null},{"id":"T16-21","name":"バッチ学習","desc":"学習データ全体を使って勾配を計算し、まとめてパラメータを更新する学習方法。","sup":false,"aka":[],"note":null},{"id":"T16-22","name":"ミニバッチ学習","desc":"データを小さなまとまり（ミニバッチ）に分け、まとまりごとにパラメータを更新する学習方法。","sup":false,"aka":[],"note":null},{"id":"T16-23","name":"モーメンタム","desc":"前回の更新の向きを慣性のように引き継ぎ、学習の振動を抑えて速く進める工夫。","sup":false,"aka":[],"note":null},{"id":"T16-24","name":"ランダムサーチ","desc":"ハイパーパラメータをランダムに選んで試し、最良を探す方法。","sup":false,"aka":[],"note":null}]}]},{"id":"cnn","order":7,"domain":"dlcore","color":"#4B4FC0","name":"畳み込みニューラルネットワークの層（畳み込み・正規化・プーリング・スキップ結合）","short":"CNNの層","priority":"mid","badges":[],"summary":"画像の特徴を取り出すCNNを作る層。フィルタを当てる畳み込み、値をそろえる正規化、まとめて小さくするプーリング、深くしても学習できるようにするスキップ結合。","themes":["畳み込み操作（フィルタ・ストライド・パディング・特徴マップ）","計算を減らす・範囲を広げる畳み込み（Depthwise Separable、Dilated／Atrous）","正規化の種類（バッチ・レイヤー・インスタンス・グループ）","プーリング（最大値・平均値・GAP）と不変性","スキップ結合とResNet"],"keywords":["畳み込みニューラルネットワーク (CNN)","フィルタ","ストライド","パディング","特徴マップ","バッチ正規化","レイヤー正規化","最大値プーリング","グローバルアベレージプーリング (GAP)","ResNet"],"examPoint":"パディングやストライドで出力の大きさがどう変わるか、正規化の種類ごとにどの単位でそろえるか、GAPの役割を問う。","examTrap":"バッチ正規化はミニバッチ内でそろえ、レイヤー正規化は1つのデータの中でそろえる。 ,"desc":"ミニバッチの中のデータで、各チャネルの出力を平均0・分散1にそろえる方法。学習を安定させ、速くする。","sup":false,"aka":[],"note":null},{"id":"T19-3","name":"レイヤー正規化","desc":"1つのデータの中で、層の出力全体を正規化する方法。RNNやTransformerで使う。","sup":false,"aka":[],"note":null},{"id":"T19-4","name":"インスタンス正規化","desc":"1つのデータの1つのチャネルごとに正規化する方法。画像のスタイル変換で使う。","sup":false,"aka":[],"note":null}]},{"id":"T20","name":"プーリング層","short":"プーリング層","category":"ディープラーニングの要素技術","area":"技術分野","lecture":{"number":11,"title":"CNNの部品（全結合・畳み込み・正規化・プーリング・スキップ結合）","status":"planned","page":null},"terms":[{"id":"T20-1","name":"グローバルアベレージプーリング (GAP)","desc":"各特徴マップ全体の平均を1つの値にまとめるプーリング。全結合層の代わりに使い、パラメータを減らす。","sup":false,"aka":[],"note":null},{"id":"T20-2","name":"最大値プーリング","desc":"区切った範囲の中の最大値を取り出して、特徴マップを小さくする方法。","sup":false,"aka":[],"note":null},{"id":"T20-3","name":"不変性の獲得","desc":"プーリングによって、対象の位置が少しずれても同じ特徴として扱えるようになること。","sup":false,"aka":[],"note":null},{"id":"T20-4","name":"平均値プーリング","desc":"区切った範囲の中の平均値を取り出して、特徴マップを小さくする方法。","sup":false,"aka":[],"note":null}]},{"id":"T21","name":"スキップ結合","short":"スキップ結合","category":"ディープラーニングの要素技術","area":"技術分野","lecture":{"number":11,"title":"CNNの部品（全結合・畳み込み・正規化・プーリング・スキップ結合）","status":"planned","page":null},"terms":[{"id":"T21-1","name":"ResNet","desc":"層を飛び越えて入力を足し合わせるスキップ結合で、とても深いネットワークを学習できるようにしたモデル。2015年のILSVRCで優勝した。","sup":false,"aka":[],"note":null}]}]},{"id":"seq","order":8,"domain":"dlcore","color":"#2F4DB0","name":"系列データとAttention（回帰結合層・Attention・Transformer）","short":"系列とAttention","shortLines":["系列と","Attention"],"priority":"high","badges":["revised"],"summary":"文章や音声のように順番のあるデータを扱う仕組み。前の情報を引き継ぐRNNとその改良（LSTM・GRU）から、注目すべき所を計算するAttention、そして大規模言語モデルの土台になったTransformerへとつながる。","themes":["RNNの構造と学習（BPTT・教師強制）、勾配消失・勾配爆発","LSTMとGRUのゲート機構、双方向RNN","Seq2Seq（エンコーダ・デコーダ）","Attention（クエリ・キー・バリュー）、Self-AttentionとSource-Target Attention","TransformerとMulti-Head Attention、位置エンコーディング"],"keywords":["リカレントニューラルネットワーク (RNN)","LSTM","GRU","ゲート機構","教師強制","Seq2Seq","Attention","Self-Attention","Transformer","位置エンコーディング"],"examPoint":"RNNの弱点と、それをLSTM・GRU・Attentionがどう解決したかの流れ、クエリ・キー・バリューの役割を問う。","examTrap":"Self-Attentionは同じ系列の中の関係、Source-Target Attentionは入力側と出力側の関係。Transformer自体は語順がわからないので位置エンコーディングが要る。","priorityReason":"シラバス2024の改訂ポイント「基盤モデルや言語モデルなど生成AIに必要な技術の追加」の土台にあたり、エルマンネットワーク・教師強制・Multi-Head Attentionが追加された。JDLA公式の例題で直接の題材になった問はない。キーワード数は22語。","items":["T22","T23"],"subs":[{"id":"T22","name":"回帰結合層","short":"回帰結合層","category":"ディープラーニングの要素技術","area":"技術分野","lecture":{"number":12,"title":"RNNとAttention・Transformer","status":"planned","page":null},"terms":[{"id":"T22-1","name":"BPTT","desc":"時間方向に展開したRNNに、誤差逆伝播法を当てはめて学習する方法。","sup":false,"aka":[],"note":null},{"id":"T22-2","name":"GRU","desc":"LSTMを簡単にし、リセットゲートと更新ゲートの2つで情報の流れを調整するRNN。","sup":false,"aka":[],"note":null},{"id":"T22-3","name":"LSTM","desc":"入力・忘却・出力のゲートと記憶セルで長い期間の情報を保ち、勾配消失を起こしにくくしたRNN。","sup":false,"aka":[],"note":null},{"id":"T22-4","name":"エルマンネットワーク","desc":"隠れ層の出力を、次の時刻の入力に戻す基本的なRNN。","sup":false,"aka":[],"note":null},{"id":"T22-5","name":"勾配消失問題","desc":"RNNで時間をさかのぼるほど勾配が小さくなり、遠い過去の情報を学べなくなる問題。","sup":false,"aka":[],"note":null},{"id":"T22-6","name":"勾配爆発問題","desc":"RNNで時間をさかのぼるほど勾配が大きくなりすぎ、学習が不安定になる問題。","sup":false,"aka":[],"note":null},{"id":"T22-7","name":"教師強制","desc":"系列を作るモデルの学習で、前の時刻の予測ではなく正解を次の入力に使う方法。","sup":false,"aka":[],"note":null},{"id":"T22-8","name":"ゲート機構","desc":"情報をどれだけ通すか・忘れるかを、0〜1の値で調整する仕組み。LSTMやGRUの中心。","sup":false,"aka":[],"note":null},{"id":"T22-9","name":"双方向RNN (Bidirectional RNN)","desc":"過去から未来へと、未来から過去への2方向のRNNを組み合わせ、前後の文脈を使うモデル。","sup":false,"aka":[],"note":null},{"id":"T22-10","name":"時系列データ","desc":"株価や音声のように、時間の順番に意味があるデータ。","sup":false,"aka":[],"note":null},{"id":"T22-11","name":"ジョルダンネットワーク","desc":"出力層の値を、次の時刻の入力に戻す初期のRNN。","sup":false,"aka":[],"note":null},{"id":"T22-12","name":"リカレントニューラルネットワーク (RNN)","desc":"前の時刻の情報を次の時刻に引き継ぐ構造をもち、系列データを扱うニューラルネットワーク。","sup":false,"aka":[],"note":null}]},{"id":"T23","name":"Attention","short":"Attention","category":"ディープラーニングの要素技術","area":"技術分野","lecture":{"number":12,"title":"RNNとAttention・Transformer","status":"planned","page":null},"terms":[{"id":"T23-1","name":"Attention","desc":"入力のどの部分に注目すべきかを重みとして計算し、重要な情報を取り出す仕組み。","sup":false,"aka":[],"note":null},{"id":"T23-2","name":"Multi-Head Attention","desc":"複数のAttentionを並列に計算して、いろいろな観点の関係を同時にとらえる仕組み。","sup":false,"aka":[],"note":null},{"id":"T23-3","name":"Self-Attention","desc":"同じ系列の中の各要素どうしの関係を計算するAttention。Transformerの中心。","sup":false,"aka":[],"note":null},{"id":"T23-4","name":"Seq2Seq","desc":"入力の系列をエンコーダで表現に変え、デコーダで別の系列を出力するモデル。機械翻訳で使われた。","sup":false,"aka":[],"note":null},{"id":"T23-5","name":"Source-Target Attention","desc":"出力側（Target）が、入力側（Source）の情報のどこに注目するかを計算するAttention。","sup":false,"aka":[],"note":null},{"id":"T23-6","name":"Transformer","desc":"RNNを使わずAttentionだけで系列を処理するモデル。2017年に発表され、大規模言語モデルの土台になった。","sup":false,"aka":[],"note":null},{"id":"T23-7","name":"位置エンコーディング","desc":"単語の順番の情報をベクトルにして入力に加える方法。Attentionだけでは順番がわからないため使う。","sup":false,"aka":[],"note":null},{"id":"T23-8","name":"キー","desc":"Attentionで、クエリと照らし合わせて関連の強さを測るための情報。","sup":false,"aka":[],"note":null},{"id":"T23-9","name":"クエリ","desc":"Attentionで、「何を探しているか」を表す情報。","sup":false,"aka":[],"note":null},{"id":"T23-10","name":"バリュー","desc":"Attentionで、関連の強さに応じて重み付けして取り出される中身の情報。","sup":false,"aka":[],"note":null}]}]},{"id":"repr","order":9,"domain":"dlcore","color":"#4A3DAD","name":"オートエンコーダ（AE）とデータ拡張","short":"AE・データ拡張","shortLines":["AE・","データ拡張"],"priority":"mid","badges":[],"summary":"入力を圧縮して元に戻すことで特徴を学ぶオートエンコーダと、学習データを水増しして汎化性能を上げるデータ拡張。オートエンコーダの発展形のVAEは、生成モデルにもつながる。","themes":["オートエンコーダの仕組み（エンコーダとデコーダ）と次元削減","積層オートエンコーダと事前学習","変分オートエンコーダ（VAE）とその改良（VQ-VAE・info VAE・β-VAE）","画像のデータ拡張（反転・回転・切り出し・Cutout・Mixup・CutMix・RandAugment）","テキストのデータ拡張（paraphrasing・noising）"],"keywords":["変分オートエンコーダ (VAE)","積層オートエンコーダ","事前学習","Cutout","Mixup","CutMix","Random Erasing","RandAugment","paraphrasing"],"examPoint":"データ拡張の手法の名前と中身の組合せ（どれが混ぜる手法で、どれが消す手法か）を問う。","examTrap":"Cutoutは塗りつぶすだけ、CutMixは別の画像を貼ってラベルも混ぜる、Mixupは画像全体を重ねて混ぜる。","priorityReason":"JDLA公式の例題Q10（G2024#6、paraphrasing）が題材にしている。シラバス2024でVQ-VAE・info VAE・β-VAEが追加された。キーワード数は17語で、少なめ。","items":["T24","T25"],"subs":[{"id":"T24","name":"オートエンコーダ","short":"オートエンコーダ","category":"ディープラーニングの要素技術","area":"技術分野","lecture":{"number":13,"title":"オートエンコーダとデータ拡張","status":"planned","page":null},"terms":[{"id":"T24-1","name":"VQ-VAE・info VAE・β-VAE","desc":"VAEの改良版。潜在変数を離散的なコードにする（VQ-VAE）、潜在変数と入力の情報のつながりを保つ（info VAE）、潜在変数の各要素が独立した意味をもつよう促す（β-VAE）。","sup":false,"aka":[],"note":null},{"id":"T24-2","name":"次元削減","desc":"オートエンコーダで、入力をより少ない次元の表現に圧縮すること。","sup":false,"aka":[],"note":null},{"id":"T24-3","name":"事前学習","desc":"本来の学習の前に、別の課題やデータで重みを学習しておくこと。積層オートエンコーダでは層ごとに行った。","sup":false,"aka":[],"note":null},{"id":"T24-4","name":"積層オートエンコーダ","desc":"オートエンコーダを層ごとに順番に学習して積み重ねる方法。深いネットワークの事前学習に使われた。","sup":false,"aka":[],"note":null},{"id":"T24-5","name":"変分オートエンコーダ (VAE)","desc":"入力を確率分布として潜在空間に表し、そこからサンプリングして新しいデータを生成できるオートエンコーダ。","sup":false,"aka":[],"note":null}]},{"id":"T25","name":"データ拡張","short":"データ拡張","category":"ディープラーニングの要素技術","area":"技術分野","lecture":{"number":13,"title":"オートエンコーダとデータ拡張","status":"planned","page":null},"terms":[{"id":"T25-1","name":"Contrast","desc":"画像の明暗の差（コントラスト）を変えるデータ拡張。","sup":false,"aka":[],"note":null},{"id":"T25-2","name":"Brightness","desc":"画像の明るさを変えるデータ拡張。","sup":false,"aka":[],"note":null},{"id":"T25-3","name":"Crop","desc":"画像の一部を切り出すデータ拡張。","sup":false,"aka":[],"note":null},{"id":"T25-4","name":"CutMix","desc":"画像の一部を切り取って別の画像の一部を貼り付け、ラベルも面積の割合で混ぜるデータ拡張。","sup":false,"aka":[],"note":null},{"id":"T25-5","name":"Cutout","desc":"画像の一部の領域を、四角く塗りつぶすデータ拡張。","sup":false,"aka":[],"note":null},{"id":"T25-6","name":"Mixup","desc":"2つの画像とラベルを、一定の割合で重ね合わせて混ぜるデータ拡張。","sup":false,"aka":[],"note":null},{"id":"T25-7","name":"noising","desc":"データにノイズ（雑音）を加えるデータ拡張。","sup":false,"aka":[],"note":null},{"id":"T25-8","name":"paraphrasing","desc":"文章の意味を変えずに、言い換えや同じ意味の語への置き換えをするテキストのデータ拡張。","sup":false,"aka":[],"note":null},{"id":"T25-9","name":"RandAugment","desc":"多くの変換の候補からランダムに選んで適用し、変換の数と強さの2つだけを調整するデータ拡張。","sup":false,"aka":["RandAugument"],"note":null},{"id":"T25-10","name":"Random Erasing","desc":"画像の中のランダムな四角い領域を、ランダムな値で消すデータ拡張。","sup":false,"aka":[],"note":null},{"id":"T25-11","name":"Random Flip","desc":"画像をランダムに左右や上下に反転させるデータ拡張。","sup":false,"aka":[],"note":null},{"id":"T25-12","name":"Rotate","desc":"画像を回転させるデータ拡張。","sup":false,"aka":[],"note":null}]}]},{"id":"vision","order":10,"domain":"dlapp","color":"#6A3DCB","name":"画像認識と音声処理","short":"画像・音声","priority":"high","badges":[],"summary":"CNNを中心にした画像認識のモデル（分類・物体検出・セグメンテーション・姿勢推定）と、音声の信号処理から音声認識・音声合成まで。モデル名と「何をするモデルか」の対応が多い分野。","themes":["画像分類のモデルの発展（AlexNet→VGG・GoogLeNet→ResNet→EfficientNet・Vision Transformer）","物体検出（R-CNN系の2段階型と、YOLO・SSDの1段階型）","セグメンテーションの種類（セマンティック・インスタンス・パノプティック）と代表モデル","軽量なモデルと自動設計（MobileNet・NAS・MnasNet）、姿勢推定（OpenPose）","音声のデジタル化と特徴量（A-D変換・PCM・FFT・MFCC）、音声認識・音声合成（HMM・WaveNet・CTC）"],"keywords":["AlexNet","ResNet","Vision Transformer","物体検出","YOLO","Faster R-CNN","セマンティックセグメンテーション","インスタンスセグメンテーション","U-Net","メル周波数ケプストラム係数 (MFCC)","WaveNet"],"examPoint":"モデルの名前と特徴・課題（物体検出か、セグメンテーションか）の組合せや、ILSVRCで優勝したモデルの順番を問う。","examTrap":"セマンティックセグメンテーションは同じ種類の物体を区別しない、インスタンスセグメンテーションは物体ごとに区別する。Mask R-CNNはインスタンスセグメンテーション。","priorityReason":"JDLA公式の例題Q3（G2022#1、ILSVRCとResNet）が題材にしている。シラバス2024で話者識別が追加され、1.2版でCTCが音声処理へ移された。キーワード数は48語で、分野の中で最も多い。","items":["T26","T28"],"subs":[{"id":"T26","name":"画像認識","short":"画像認識","category":"ディープラーニングの応用例","area":"技術分野","lecture":{"number":14,"title":"画像認識（分類・物体検出・セグメンテーション）","status":"planned","page":null},"terms":[{"id":"T26-1","name":"AlexNet","desc":"2012年のILSVRCで大差をつけて優勝したCNN。ReLUやドロップアウトを使い、第3次AIブームのきっかけになった。","sup":false,"aka":[],"note":null},{"id":"T26-2","name":"DeepLab","desc":"Atrous Convolutionで広い範囲を見る、セマンティックセグメンテーションのモデル。","sup":false,"aka":[],"note":null},{"id":"T26-3","name":"DenseNet","desc":"各層を、それより前のすべての層と結合するCNN。特徴を再利用してパラメータを減らす。","sup":false,"aka":[],"note":null},{"id":"T26-4","name":"EfficientNet","desc":"層の深さ・幅・入力画像の解像度を、バランスよく同時に大きくする方法（複合スケーリング）を使ったCNN。","sup":false,"aka":[],"note":null},{"id":"T26-5","name":"Fast R-CNN","desc":"画像全体を一度だけCNNに通して候補領域の特徴を取り出し、R-CNNを高速にした物体検出のモデル。","sup":false,"aka":[],"note":null},{"id":"T26-6","name":"Faster R-CNN","desc":"候補領域を探す部分もニューラルネットワーク（RPN）で行い、さらに速くした物体検出のモデル。","sup":false,"aka":[],"note":null},{"id":"T26-7","name":"FCN (Fully Convolutional Network)","desc":"全結合層を使わず、畳み込み層だけで作ったセマンティックセグメンテーションのモデル。","sup":false,"aka":["FCN"],"note":null},{"id":"T26-8","name":"FPN","desc":"解像度の違う特徴マップを組み合わせて、大小さまざまな物体を検出しやすくした構造。","sup":false,"aka":[],"note":null},{"id":"T26-9","name":"GoogLeNet","desc":"大きさの違うフィルタを並列に使うInceptionモジュールを重ねたCNN。2014年のILSVRCで優勝した。","sup":false,"aka":[],"note":null},{"id":"T26-10","name":"Mask R-CNN","desc":"Faster R-CNNに物体の形を切り出す仕組みを加え、インスタンスセグメンテーションを行うモデル。","sup":false,"aka":[],"note":null},{"id":"T26-11","name":"MnasNet","desc":"スマホでの実際の処理速度も考えに入れながら、NASで自動設計されたモバイル向けのCNN。","sup":false,"aka":[],"note":null},{"id":"T26-12","name":"MobileNet","desc":"Depthwise Separable Convolutionで計算量を減らした、スマホなど向けの軽いCNN。","sup":false,"aka":[],"note":null},{"id":"T26-13","name":"NAS (Neural Architecture Search)","desc":"ネットワークの構造そのものを、強化学習などで自動的に探す方法。","sup":false,"aka":[],"note":null},{"id":"T26-14","name":"OpenPose","desc":"画像の中の複数の人の関節の位置を推定し、骨格をつなぐ姿勢推定の手法。","sup":false,"aka":["Open Pose"],"note":null},{"id":"T26-15","name":"PSPNet","desc":"大きさの違う領域ごとにプーリングして、画像全体の文脈を取り込むセマンティックセグメンテーションのモデル。","sup":false,"aka":[],"note":null},{"id":"T26-16","name":"ResNet","desc":"スキップ結合で152層もの深いネットワークを実現したCNN。2015年のILSVRCで優勝した。","sup":false,"aka":[],"note":null},{"id":"T26-17","name":"SegNet","desc":"エンコーダとデコーダからなり、プーリングした位置を覚えておいて元の解像度に戻すセグメンテーションのモデル。","sup":false,"aka":[],"note":null},{"id":"T26-18","name":"SENet","desc":"チャネルごとの重要度を学習して重み付けする仕組みをもつCNN。2017年のILSVRCで優勝した。","sup":false,"aka":[],"note":null},{"id":"T26-19","name":"SSD","desc":"大きさの違う複数の特徴マップから、1回の処理で物体の位置と種類を同時に予測する物体検出のモデル。","sup":false,"aka":[],"note":null},{"id":"T26-20","name":"U-Net","desc":"U字型のエンコーダ・デコーダの構造で、同じ解像度の特徴を結合するセグメンテーションのモデル。医療画像で広く使われる。","sup":false,"aka":["UNet"],"note":null},{"id":"T26-21","name":"VGG","desc":"3×3の小さなフィルタを深く重ねた、単純な構造のCNN。2014年のILSVRCで好成績を出した。","sup":false,"aka":[],"note":null},{"id":"T26-22","name":"Vision Transformer","desc":"画像を小さなパッチに分け、単語の列のようにTransformerで処理する画像認識のモデル。","sup":false,"aka":[],"note":null},{"id":"T26-23","name":"Wide ResNet","desc":"ResNetの層を深くする代わりに幅（チャネル数）を広げ、性能と学習の速さを改善したモデル。","sup":false,"aka":[],"note":null},{"id":"T26-24","name":"YOLO","desc":"画像全体を一度だけ見て、物体の位置と種類を同時に予測する高速な物体検出のモデル。","sup":false,"aka":[],"note":null},{"id":"T26-25","name":"一般物体認識","desc":"決まった物に限らず、日常のさまざまな物体を認識すること。","sup":false,"aka":[],"note":null},{"id":"T26-26","name":"インスタンスセグメンテーション","desc":"物体ごとに区別して、その形を画素単位で切り出すこと。","sup":false,"aka":[],"note":null},{"id":"T26-27","name":"姿勢推定","desc":"画像や動画から、人の関節の位置や体の向きを推定すること。","sup":false,"aka":[],"note":null},{"id":"T26-28","name":"セマンティックセグメンテーション","desc":"画像の画素1つ1つに、どの種類に属するかのラベルを付けること。同じ種類の物体どうしは区別しない。","sup":false,"aka":[],"note":null},{"id":"T26-29","name":"物体検出","desc":"画像の中の物体の位置を四角い枠で示し、その種類も判定すること。","sup":false,"aka":[],"note":null},{"id":"T26-30","name":"物体識別","desc":"画像に写っている物体が何かを判定すること。","sup":false,"aka":[],"note":null},{"id":"T26-31","name":"パノプティックセグメンテーション","desc":"セマンティックとインスタンスの両方を組み合わせ、背景も含めて物体ごとに画素単位でラベルを付けること。","sup":false,"aka":[],"note":null}]},{"id":"T28","name":"音声処理","short":"音声処理","category":"ディープラーニングの応用例","area":"技術分野","lecture":{"number":16,"title":"音声処理","status":"planned","page":null},"terms":[{"id":"T28-1","name":"A-D変換","desc":"音声などの連続したアナログの信号を、コンピュータで扱えるデジタルの数値に変えること。","sup":false,"aka":[],"note":null},{"id":"T28-2","name":"WaveNet","desc":"DeepMindが2016年に発表した、音声の波形を直接生成するモデル。自然な音声合成を実現した。","sup":false,"aka":[],"note":null},{"id":"T28-3","name":"音韻","desc":"言語の中で意味を区別するのに使われる音の単位を、抽象的にとらえたもの。","sup":false,"aka":[],"note":null},{"id":"T28-4","name":"音声合成","desc":"文字や文章から、人の声のような音声を作り出すこと。","sup":false,"aka":[],"note":null},{"id":"T28-5","name":"音声認識","desc":"人の話し声を、コンピュータで文字に変換すること。","sup":false,"aka":[],"note":null},{"id":"T28-6","name":"音素","desc":"言葉の意味を区別する、音の最小の単位。","sup":false,"aka":[],"note":null},{"id":"T28-7","name":"隠れマルコフモデル","desc":"観測できない状態が確率的に移り変わり、そこから観測データが出ると考えるモデル。かつての音声認識の主流。","sup":false,"aka":[],"note":null},{"id":"T28-8","name":"感情分析","desc":"声の調子などから、話し手の感情を推定すること。","sup":false,"aka":[],"note":null},{"id":"T28-9","name":"高速フーリエ変換 (FFT)","desc":"信号を周波数ごとの成分に分けるフーリエ変換を、高速に計算する方法。","sup":false,"aka":[],"note":null},{"id":"T28-10","name":"スペクトル包絡","desc":"音声の周波数ごとの強さの、なだらかな全体の形。声の音色を決める。","sup":false,"aka":[],"note":null},{"id":"T28-11","name":"パルス符号変調器 (PCM)","desc":"アナログの信号を一定の間隔で取り出し（標本化）、数値に置き換えて（量子化）デジタルにする方式。","sup":false,"aka":[],"note":null},{"id":"T28-12","name":"フォルマント","desc":"音声のスペクトルに現れる、強さの山の部分。母音の聞き分けにかかわる。","sup":false,"aka":[],"note":null},{"id":"T28-13","name":"フォルマント周波数","desc":"フォルマントが現れる周波数。低い方から第1、第2…と呼ぶ。","sup":false,"aka":[],"note":null},{"id":"T28-14","name":"メル周波数ケプストラム係数 (MFCC)","desc":"人の聴覚の特性に合わせて、音声のスペクトル包絡の特徴を表した値。音声認識の特徴量として使う。","sup":false,"aka":[],"note":null},{"id":"T28-15","name":"メル尺度","desc":"人が感じる音の高さに合わせて、周波数を変換した尺度。","sup":false,"aka":[],"note":null},{"id":"T28-16","name":"話者識別","desc":"声の特徴から、話しているのが誰かを判定すること。","sup":false,"aka":[],"note":null},{"id":"T28-17","name":"CTC","desc":"音声の区切りと出力する文字の対応がわからなくても、系列どうしを学習できる方法。音声認識で使う。","sup":false,"aka":[],"note":null}]}]},{"id":"nlp","order":11,"domain":"dlapp","color":"#7A39B5","name":"自然言語処理とマルチモーダル","short":"言語・マルチモーダル","shortLines":["言語・","マルチモーダル"],"priority":"high","badges":["revised"],"summary":"言葉をコンピュータで扱う技術（単語の表現から大規模言語モデルまで）と、画像と文章など複数の種類のデータをまとめて扱うマルチモーダル。生成AIの中心にある分野。","themes":["文章の表現の発展（ワンホット・BoW・TF-IDF→分散表現・word2vec→文脈で変わる表現・ELMo・BERT）","自然言語処理の基本の処理（形態素解析・構文解析）と応用（機械翻訳・要約・質問応答・感情分析）","大規模言語モデル（LLM）と評価のベンチマーク（GLUE）","マルチモーダルのモデル（CLIP・DALL-E・Flamingo・Unified-IO）と課題（画像の説明文・VQA・Text-To-Image）","基盤モデル・Zero-shot・マルチタスク学習"],"keywords":["word2vec","分散表現","TF-IDF","BERT","大規模言語モデル (LLM)","Seq2Seq","CLIP","基盤モデル","Zero-shot","Text-To-Image"],"examPoint":"手法の発展の順番や、手法と特徴の組合せ（CBOWとスキップグラムの違いなど）、マルチモーダルのモデルの課題を問う。","examTrap":"CBOWは周りの語から真ん中の語を予測し、スキップグラムは真ん中の語から周りの語を予測する。ChatGPT・GPT-nはシラバス1.4版でキーワードから削除された。","priorityReason":"JDLA公式の例題Q11（G2024#4、大規模言語モデルの前提となるスケーリング則）と例題Q13（G2024#6、Zero-shot）が題材にしている。シラバス2024の改訂ポイントで「基盤モデルや言語モデル」が追加され、1.4版でChatGPT・GPT-nが削除された。キーワード数は35語。","items":["T27","T32"],"subs":[{"id":"T27","name":"自然言語処理","short":"自然言語処理","category":"ディープラーニングの応用例","area":"技術分野","lecture":{"number":15,"title":"自然言語処理と大規模言語モデル","status":"planned","page":null},"terms":[{"id":"T27-1","name":"BERT","desc":"Transformerのエンコーダを使い、文の一部を隠して前後から当てる学習などで事前学習した言語モデル。2018年にGoogleが発表した。","sup":false,"aka":[],"note":null},{"id":"T27-2","name":"BoW (Bag-of-Words)","desc":"文章を、語順を無視して単語ごとの出現回数で表す方法。","sup":false,"aka":[],"note":null},{"id":"T27-3","name":"CBOW","desc":"周りの単語から真ん中の単語を予測して、単語の分散表現を学ぶword2vecの方法。","sup":false,"aka":[],"note":null},{"id":"T27-4","name":"CEC","desc":"LSTMの記憶セルで、誤差を減らさずに長く伝える仕組み（Constant Error Carousel）。","sup":false,"aka":[],"note":null},{"id":"T27-5","name":"ELMo","desc":"双方向のLSTMで、文脈によって変わる単語の表現を学ぶ言語モデル。","sup":false,"aka":[],"note":null},{"id":"T27-6","name":"fastText","desc":"単語をさらに文字の並び（部分語）に分けて学習し、未知の単語にも対応しやすくした分散表現の手法。","sup":false,"aka":[],"note":null},{"id":"T27-7","name":"GLUE","desc":"文の分類や含意の判定など、複数の課題で言語モデルの理解力を総合的に評価するベンチマーク。","sup":false,"aka":[],"note":null},{"id":"T27-8","name":"n-gram","desc":"連続するn個の単語や文字の並び。言語を統計的に扱うときに使う。","sup":false,"aka":["N-gram"],"note":null},{"id":"T27-9","name":"PaLM","desc":"Googleが2022年に発表した、5,400億パラメータの大規模言語モデル。","sup":false,"aka":[],"note":null},{"id":"T27-10","name":"Seq2Seq","desc":"入力の文章を別の文章に変換する、エンコーダ・デコーダのモデル。機械翻訳や要約に使う。","sup":false,"aka":[],"note":null},{"id":"T27-11","name":"TF-IDF","desc":"単語の出現頻度（TF）に、多くの文書に出る語ほど小さくなる値（IDF）をかけて、その文書での単語の重要さを表す指標。","sup":false,"aka":[],"note":null},{
