<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d" font-family="'M PLUS Rounded 1c','Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
  <title id="t">シンボルグラウンディング問題と身体性</title>
  <desc id="d">左のコンピュータは「シマウマ＝シマ＋ウマ」という記号どうしの関係は知っているが、記号が実世界の何を指すかを知らないので、本物のシマウマを見てもわからない。右の人間は、ウマを見た経験やしま模様を見た経験と記号が結びついているので、初めてシマウマを見てもわかる。下の帯では、体を通して世界にふれる経験が記号と意味をつなぐ、という身体性の考え方を示す。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7F8FC"/><stop offset="1" stop-color="#EEF0FF"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9AA2CC"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1F2A5C" flood-opacity="0.10"/></filter>
  </defs>
  <rect x="0" y="0" width="800" height="450" rx="24" fill="url(#bg)"/>
  <text x="40" y="48" font-size="22" font-weight="800" fill="#1F2A5C">記号と意味を結びつけられるか？</text>
  <text x="40" y="74" font-size="15" fill="#6B7280">シンボルグラウンディング問題（ハルナッド、1990年）</text>
  <g filter="url(#shadow)"><rect x="40" y="100" width="340" height="230" rx="16" fill="#FFFFFF"/></g>
  <rect x="40" y="100" width="340" height="8" rx="4" fill="#F2645A"/>
  <text x="60" y="138" font-size="17" font-weight="800" fill="#1F2A5C">コンピュータ：記号だけ</text>
  <rect x="60" y="160" width="104" height="36" rx="18.0" fill="#FFEDEB"/>
  <text x="112.0" y="183.4" font-size="15" font-weight="700" fill="#1F2A5C" text-anchor="middle">シマウマ</text>
  <text x="176" y="184" font-size="18" font-weight="800" fill="#1F2A5C" text-anchor="middle">＝</text>
  <rect x="192" y="160" width="70" height="36" rx="18.0" fill="#FFEDEB"/>
  <text x="227.0" y="183.4" font-size="15" font-weight="700" fill="#1F2A5C" text-anchor="middle">シマ</text>
  <text x="274" y="184" font-size="18" font-weight="800" fill="#1F2A5C" text-anchor="middle">＋</text>
  <rect x="288" y="160" width="70" height="36" rx="18.0" fill="#FFEDEB"/>
  <text x="323.0" y="183.4" font-size="15" font-weight="700" fill="#1F2A5C" text-anchor="middle">ウマ</text>
  <text x="60" y="230" font-size="14" fill="#2B2F3A">記号どうしの関係は言える。でも</text>
  <text x="60" y="254" font-size="14" fill="#2B2F3A">「シマ」も「ウマ」も見たことがない</text>
  <rect x="60" y="272" width="300" height="40" rx="10" fill="#FFEDEB"/>
  <text x="210" y="298" font-size="14" font-weight="800" fill="#F2645A" text-anchor="middle">本物を見ても、シマウマとわからない</text>
  <g filter="url(#shadow)"><rect x="420" y="100" width="340" height="230" rx="16" fill="#FFFFFF"/></g>
  <rect x="420" y="100" width="340" height="8" rx="4" fill="#12A594"/>
  <text x="440" y="138" font-size="17" font-weight="800" fill="#1F2A5C">人間：経験と結びつく</text>
  <rect x="446" y="162" width="7" height="44" rx="2" fill="#1F2A5C"/>
  <rect x="460" y="162" width="7" height="44" rx="2" fill="#1F2A5C"/>
  <rect x="474" y="162" width="7" height="44" rx="2" fill="#1F2A5C"/>
  <rect x="488" y="162" width="7" height="44" rx="2" fill="#1F2A5C"/>
  <rect x="502" y="162" width="7" height="44" rx="2" fill="#1F2A5C"/>
  <text x="482" y="226" font-size="14" font-weight="700" fill="#6B7280" text-anchor="middle">しま模様</text>
  <text x="542" y="192" font-size="18" font-weight="800" fill="#1F2A5C" text-anchor="middle">＋</text>
  <rect x="566" y="162" width="70" height="44" rx="12" fill="#E3F7F4" stroke="#12A594" stroke-width="2"/>
  <text x="601" y="190" font-size="15" font-weight="800" fill="#12A594" text-anchor="middle">ウマ</text>
  <text x="601" y="226" font-size="14" font-weight="700" fill="#6B7280" text-anchor="middle">見た経験</text>
  <line x1="646" y1="184" x2="676" y2="184" stroke="#9AA2CC" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="716" y="190" font-size="22" font-weight="800" fill="#12A594" text-anchor="middle">！</text>
  <rect x="440" y="272" width="300" height="40" rx="10" fill="#E3F7F4"/>
  <text x="590" y="298" font-size="14" font-weight="800" fill="#12A594" text-anchor="middle">初めて見ても、シマウマとわかる</text>
  <text x="440" y="254" font-size="14" fill="#2B2F3A">記号が実物のイメージに「接地」している</text>
  <rect x="40" y="350" width="720" height="80" rx="14" fill="#FFFFFF" stroke="#E3E6EF" stroke-width="2"/>
  <rect x="40" y="350" width="8" height="80" rx="4" fill="#2E9BEA"/>
  <text x="64" y="382" font-size="17" font-weight="800" fill="#2E9BEA">身体性</text>
  <text x="130" y="382" font-size="15" font-weight="700" fill="#1F2A5C">体を通して世界にふれる経験が、記号と意味をつなぐ</text>
  <text x="130" y="408" font-size="14" fill="#6B7280">という考え方。見る・さわる・動くことで概念をつかむ</text>
</svg>
