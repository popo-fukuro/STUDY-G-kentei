<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="'M PLUS Rounded 1c','Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
  <title id="t">フレーム問題を表すロボットの思考実験</title>
  <desc id="d">洞窟の中の電池を取ってくるよう命じられたロボット。ただし電池をのせた台車には時限爆弾も置いてある。1号は台車ごと運び出し、爆弾もいっしょに持ち出して爆発する。2号は行動の結果をすべて考えようとして、壁の色が変わるかなど無関係なことまで考えて時間切れになる。3号は関係のないことを除外するリストを作り続けて動けず、時間切れになる。関係のあることだけを選んで考えることの難しさがフレーム問題である。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7F8FC"/><stop offset="1" stop-color="#EEF0FF"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9AA2CC"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1F2A5C" flood-opacity="0.10"/></filter>
  </defs>
  <rect x="0" y="0" width="800" height="470" rx="24" fill="url(#bg)"/>
  <text x="40" y="48" font-size="22" font-weight="800" fill="#1F2A5C">フレーム問題：関係あることだけを選べない</text>
  <text x="40" y="74" font-size="15" fill="#6B7280">デネット（1984）の思考実験を、自分の言葉で図にしたもの</text>
  <rect x="40" y="94" width="720" height="58" rx="14" fill="#FFFFFF" stroke="#E3E6EF" stroke-width="2"/>
  <text x="60" y="120" font-size="16" font-weight="800" fill="#1F2A5C">命令：洞窟から電池を取ってこい</text>
  <text x="60" y="142" font-size="14" fill="#F2645A">ただし、電池をのせた台車には時限爆弾も置いてある</text>
  <g filter="url(#shadow)"><rect x="40" y="170" width="230" height="200" rx="16" fill="#FFFFFF"/></g>
  <rect x="40" y="170" width="230" height="8" rx="4" fill="#4F5BD5"/>
  <g transform="translate(86 222) scale(0.7)"><rect x="-22" y="-20" width="44" height="40" rx="10" fill="#4F5BD5"/><circle cx="-9" cy="-2" r="5" fill="#FFFFFF"/><circle cx="9" cy="-2" r="5" fill="#FFFFFF"/><line x1="0" y1="-20" x2="0" y2="-32" stroke="#4F5BD5" stroke-width="3"/><circle cx="0" cy="-34" r="4" fill="#4F5BD5"/><rect x="-28" y="26" width="56" height="46" rx="12" fill="#4F5BD5"/></g>
  <text x="120" y="230" font-size="20" font-weight="800" fill="#1F2A5C">1号</text>
  <text x="60" y="296" font-size="15" font-weight="700" fill="#2B2F3A">台車ごと運び出す</text>
  <text x="60" y="318" font-size="14" fill="#6B7280">爆弾ものっていたのに…</text>
  <rect x="56" y="328" width="198" height="32" rx="10" fill="#FFEDEB"/>
  <text x="155" y="349" font-size="14" font-weight="800" fill="#F2645A" text-anchor="middle">爆弾を持ち出し爆発</text>
  <g filter="url(#shadow)"><rect x="285" y="170" width="230" height="200" rx="16" fill="#FFFFFF"/></g>
  <rect x="285" y="170" width="230" height="8" rx="4" fill="#4F5BD5"/>
  <g transform="translate(331 222) scale(0.7)"><rect x="-22" y="-20" width="44" height="40" rx="10" fill="#4F5BD5"/><circle cx="-9" cy="-2" r="5" fill="#FFFFFF"/><circle cx="9" cy="-2" r="5" fill="#FFFFFF"/><line x1="0" y1="-20" x2="0" y2="-32" stroke="#4F5BD5" stroke-width="3"/><circle cx="0" cy="-34" r="4" fill="#4F5BD5"/><rect x="-28" y="26" width="56" height="46" rx="12" fill="#4F5BD5"/></g>
  <text x="365" y="230" font-size="20" font-weight="800" fill="#1F2A5C">2号</text>
  <text x="305" y="296" font-size="15" font-weight="700" fill="#2B2F3A">結果を全部考える</text>
  <text x="305" y="318" font-size="14" fill="#6B7280">「壁の色は変わる？」…</text>
  <rect x="301" y="328" width="198" height="32" rx="10" fill="#FFEDEB"/>
  <text x="400" y="349" font-size="14" font-weight="800" fill="#F2645A" text-anchor="middle">考えすぎて時間切れ</text>
  <g filter="url(#shadow)"><rect x="530" y="170" width="230" height="200" rx="16" fill="#FFFFFF"/></g>
  <rect x="530" y="170" width="230" height="8" rx="4" fill="#4F5BD5"/>
  <g transform="translate(576 222) scale(0.7)"><rect x="-22" y="-20" width="44" height="40" rx="10" fill="#4F5BD5"/><circle cx="-9" cy="-2" r="5" fill="#FFFFFF"/><circle cx="9" cy="-2" r="5" fill="#FFFFFF"/><line x1="0" y1="-20" x2="0" y2="-32" stroke="#4F5BD5" stroke-width="3"/><circle cx="0" cy="-34" r="4" fill="#4F5BD5"/><rect x="-28" y="26" width="56" height="46" rx="12" fill="#4F5BD5"/></g>
  <text x="610" y="230" font-size="20" font-weight="800" fill="#1F2A5C">3号</text>
  <text x="550" y="296" font-size="15" font-weight="700" fill="#2B2F3A">無関係なことを除外</text>
  <text x="550" y="318" font-size="14" fill="#6B7280">除外リスト作りに没頭</text>
  <rect x="546" y="328" width="198" height="32" rx="10" fill="#FFEDEB"/>
  <text x="645" y="349" font-size="14" font-weight="800" fill="#F2645A" text-anchor="middle">動けず時間切れ</text>
  <rect x="40" y="388" width="720" height="62" rx="14" fill="#EEF0FF"/>
  <text x="400" y="416" font-size="16" font-weight="800" fill="#1F2A5C" text-anchor="middle">課題に関係あることだけを選んで考えるのが難しい</text>
  <text x="400" y="438" font-size="14" font-weight="700" fill="#4F5BD5" text-anchor="middle">＝ フレーム問題（マッカーシーとヘイズ、1969年）</text>
</svg>
