<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d" font-family="'M PLUS Rounded 1c','Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
  <title id="t">機械翻訳の移り変わり</title>
  <desc id="d">3枚のカードが左から右へ時代順に並ぶ。1 ルールベース機械翻訳（1950年代〜）：人が文法の規則と辞書を書いて訳す。2 統計的機械翻訳（1990年代〜）：大量の対訳データから単語や句の対応の確率を学び、いちばんありそうな訳を選ぶ。3 ニューラル機械翻訳（2010年代〜）：ディープラーニングで文全体を学ぶ。2016年にGoogle翻訳が切り替えた。下に、それぞれの弱点として、規則を書ききれない、文全体の自然さが苦手、を示す。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7F8FC"/><stop offset="1" stop-color="#EEF0FF"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9AA2CC"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1F2A5C" flood-opacity="0.10"/></filter>
  </defs>
  <rect x="0" y="0" width="800" height="430" rx="24" fill="url(#bg)"/>
  <text x="40" y="48" font-size="22" font-weight="800" fill="#1F2A5C">機械翻訳の移り変わり</text>
  <text x="40" y="74" font-size="15" fill="#6B7280">「人が規則を書く」から「データから学ぶ」へ</text>
  <g filter="url(#shadow)"><rect x="40" y="100" width="220" height="230" rx="16" fill="#FFFFFF"/></g>
  <rect x="40" y="100" width="220" height="8" rx="4" fill="#2E9BEA"/>
  <circle cx="70" cy="140" r="16" fill="#2E9BEA"/>
  <text x="70" y="146" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="94" y="147" font-size="18" font-weight="800" fill="#1F2A5C">ルールベース</text>
  <text x="64" y="180" font-size="14" font-weight="700" fill="#2E9BEA">1950年代〜</text>
  <text x="64" y="214" font-size="15" fill="#2B2F3A">人が文法の規則と</text>
  <text x="64" y="238" font-size="15" fill="#2B2F3A">辞書を書いて訳す</text>
  <rect x="56" y="268" width="188" height="44" rx="10" fill="#E6F3FD"/>
  <text x="150" y="296" font-size="13" font-weight="700" fill="#1F2A5C" text-anchor="middle">弱点：規則を書ききれない</text>
  <g filter="url(#shadow)"><rect x="290" y="100" width="220" height="230" rx="16" fill="#FFFFFF"/></g>
  <rect x="290" y="100" width="220" height="8" rx="4" fill="#4F5BD5"/>
  <circle cx="320" cy="140" r="16" fill="#4F5BD5"/>
  <text x="320" y="146" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="344" y="147" font-size="18" font-weight="800" fill="#1F2A5C">統計的</text>
  <text x="314" y="180" font-size="14" font-weight="700" fill="#4F5BD5">1990年代〜</text>
  <text x="314" y="214" font-size="15" fill="#2B2F3A">対訳データから</text>
  <text x="314" y="238" font-size="15" fill="#2B2F3A">訳の確率を学ぶ</text>
  <rect x="306" y="268" width="188" height="44" rx="10" fill="#EEF0FF"/>
  <text x="400" y="296" font-size="13" font-weight="700" fill="#1F2A5C" text-anchor="middle">弱点：文全体の自然さ</text>
  <g filter="url(#shadow)"><rect x="540" y="100" width="220" height="230" rx="16" fill="#FFFFFF"/></g>
  <rect x="540" y="100" width="220" height="8" rx="4" fill="#8B5CF6"/>
  <circle cx="570" cy="140" r="16" fill="#8B5CF6"/>
  <text x="570" y="146" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="594" y="147" font-size="18" font-weight="800" fill="#1F2A5C">ニューラル</text>
  <text x="564" y="180" font-size="14" font-weight="700" fill="#8B5CF6">2010年代〜</text>
  <text x="564" y="214" font-size="15" fill="#2B2F3A">ディープラーニングで</text>
  <text x="564" y="238" font-size="15" fill="#2B2F3A">文全体を学ぶ</text>
  <rect x="556" y="268" width="188" height="44" rx="10" fill="#F3EEFF"/>
  <text x="650" y="296" font-size="13" font-weight="700" fill="#1F2A5C" text-anchor="middle">2016年 Google翻訳が採用</text>
  <line x1="264" y1="215" x2="284" y2="215" stroke="#9AA2CC" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="514" y1="215" x2="534" y2="215" stroke="#9AA2CC" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="40" y="350" width="720" height="60" rx="14" fill="#FFFFFF" stroke="#E3E6EF" stroke-width="2"/>
  <text x="60" y="386" font-size="15" font-weight="700" fill="#1F2A5C">第1回の担当は①と②。③は第15回（自然言語処理）でくわしく学ぶ</text>
</svg>
