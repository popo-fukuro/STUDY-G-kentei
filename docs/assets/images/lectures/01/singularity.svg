    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7F8FC"/><stop offset="1" stop-color="#EEF0FF"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9AA2CC"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1F2A5C" flood-opacity="0.10"/></filter>
  </defs>
  <rect x="0" y="0" width="800" height="430" rx="24" fill="url(#bg)"/>
  <text x="40" y="48" font-size="22" font-weight="800" fill="#1F2A5C">シンギュラリティ（技術的特異点）</text>
  <text x="40" y="74" font-size="15" fill="#6B7280">AIが人間の知能を超え、その先が予測できなくなる転換点</text>
