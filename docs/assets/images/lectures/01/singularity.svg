<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d" font-family="'M PLUS Rounded 1c','Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
  <title id="t">シンギュラリティ（技術的特異点）のイメージ</title>
  <desc id="d">横軸が年、縦軸がAIの能力のグラフ。AIの能力の曲線は指数関数的に急に伸び、横に引いた「人間の知能」の点線を超える。カーツワイルは2029年に人間並みのAI、2045年にシンギュラリティが来ると予測した。あくまで予測であり、確定した未来ではない。</desc>
