<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="'M PLUS Rounded 1c','Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
  <title id="t">チューリングテストのしくみ</title>
  <desc id="d">左に判定者（人間）、真ん中に相手が見えない壁、右にAの人間とBの機械がいる。判定者は文字のやりとりだけで会話する。どちらが機械かを見分けられなければ、その機械には知能があるとみなす。1950年にアラン・チューリングが提案した。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7F8FC"/><stop offset="1" stop-color="#EEF0FF"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9AA2CC"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1F2A5C" flood-opacity="0.10"/></filter>
  </defs>
  <rect x="0" y="0" width="800" height="400" rx="24" fill="url(#bg)"/>
  <text x="40" y="48" font-size="22" font-weight="800" fill="#1F2A5C">チューリングテスト（1950年・チューリング）</text>
  <text x="40" y="74" font-size="15" fill="#6B7280">文字の会話だけで、相手が人か機械かを当てる</text>
  <g filter="url(#shadow)"><rect x="40" y="100" width="230" height="230" rx="16" fill="#FFFFFF"/></g>
  <rect x="40" y="100" width="230" height="8" rx="4" fill="#4F5BD5"/>
  <g transform="translate(155 160) scale(1)"><circle cx="0" cy="0" r="20" fill="#4F5BD5"/><rect x="-28" y="26" width="56" height="46" rx="20" fill="#4F5BD5"/></g>
  <text x="155" y="270" font-size="16" font-weight="800" fill="#1F2A5C" text-anchor="middle">判定者（人間）</text>
  <text x="155" y="296" font-size="14" fill="#6B7280" text-anchor="middle">文字だけで質問する</text>
  <rect x="372" y="96" width="16" height="250" rx="8" fill="#9AA2CC"/>
  <text x="380" y="368" font-size="14" font-weight="700" fill="#6B7280" text-anchor="middle">相手は見えない</text>
  <g filter="url(#shadow)"><rect x="500" y="100" width="260" height="105" rx="16" fill="#FFFFFF"/></g>
  <rect x="500" y="100" width="260" height="8" rx="4" fill="#2E9BEA"/>
  <g transform="translate(548 138) scale(0.7)"><circle cx="0" cy="0" r="20" fill="#2E9BEA"/><rect x="-28" y="26" width="56" height="46" rx="20" fill="#2E9BEA"/></g>
  <text x="600" y="150" font-size="16" font-weight="800" fill="#1F2A5C">A：人間</text>
  <text x="600" y="176" font-size="14" fill="#6B7280">ふつうに答える</text>
  <g filter="url(#shadow)"><rect x="500" y="225" width="260" height="105" rx="16" fill="#FFFFFF"/></g>
  <rect x="500" y="225" width="260" height="8" rx="4" fill="#F2645A"/>
  <g transform="translate(548 268) scale(0.7)"><rect x="-22" y="-20" width="44" height="40" rx="10" fill="#F2645A"/><circle cx="-9" cy="-2" r="5" fill="#FFFFFF"/><circle cx="9" cy="-2" r="5" fill="#FFFFFF"/><line x1="0" y1="-20" x2="0" y2="-32" stroke="#F2645A" stroke-width="3"/><circle cx="0" cy="-34" r="4" fill="#F2645A"/><rect x="-28" y="26" width="56" height="46" rx="12" fill="#F2645A"/></g>
  <text x="600" y="275" font-size="16" font-weight="800" fill="#1F2A5C">B：機械（AI）</text>
  <text x="600" y="301" font-size="14" fill="#6B7280">人のふりをして答える</text>
  <rect x="290" y="150" width="64" height="30" rx="10" fill="#FFFFFF" stroke="#E3E6EF" stroke-width="2"/>
  <text x="322" y="170" font-size="14" font-weight="700" fill="#2B2F3A" text-anchor="middle">質問</text>
  <rect x="406" y="232" width="74" height="30" rx="10" fill="#FFFFFF" stroke="#E3E6EF" stroke-width="2"/>
  <text x="443" y="252" font-size="14" font-weight="700" fill="#2B2F3A" text-anchor="middle">答え</text>
  <line x1="290" y1="200" x2="366" y2="200" stroke="#9AA2CC" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="494" y1="280" x2="394" y2="280" stroke="#9AA2CC" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
