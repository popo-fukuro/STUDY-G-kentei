<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d" font-family="'M PLUS Rounded 1c','Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
  <title id="t">エージェントと環境</title>
  <desc id="d">左にエージェント、右に環境のカードがある。環境からエージェントへ向かう上の矢印は「センサーで観測する」、エージェントから環境へ向かう下の矢印は「アクチュエータで行動する」。エージェントの中では「目的に向けてどう動くかを判断する」。下に例として、掃除ロボット、将棋AI、チャットボットを示す。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7F8FC"/><stop offset="1" stop-color="#EEF0FF"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9AA2CC"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1F2A5C" flood-opacity="0.10"/></filter>
  </defs>
  <rect x="0" y="0" width="800" height="380" rx="24" fill="url(#bg)"/>
  <text x="40" y="48" font-size="22" font-weight="800" fill="#1F2A5C">エージェント：観測して、考えて、行動する</text>
  <text x="40" y="74" font-size="15" fill="#6B7280">環境とのやりとりをくり返す主体</text>
  <g filter="url(#shadow)"><rect x="60" y="120" width="260" height="170" rx="16" fill="#FFFFFF"/></g>
  <rect x="60" y="120" width="260" height="8" rx="4" fill="#4F5BD5"/>
  <text x="190" y="160" font-size="20" font-weight="800" fill="#1F2A5C" text-anchor="middle">エージェント</text>
  <rect x="90" y="182" width="200" height="80" rx="12" fill="#EEF0FF"/>
  <text x="190" y="214" font-size="16" font-weight="800" fill="#4F5BD5" text-anchor="middle">判断する</text>
  <text x="190" y="240" font-size="14" fill="#2B2F3A" text-anchor="middle">目的に向けてどう動く？</text>
  <g filter="url(#shadow)"><rect x="480" y="120" width="260" height="170" rx="16" fill="#FFFFFF"/></g>
  <rect x="480" y="120" width="260" height="8" rx="4" fill="#2E9BEA"/>
  <text x="610" y="160" font-size="20" font-weight="800" fill="#1F2A5C" text-anchor="middle">環境</text>
  <text x="610" y="200" font-size="14" fill="#2B2F3A" text-anchor="middle">部屋・盤面・会話・道路</text>
  <text x="610" y="226" font-size="14" fill="#6B7280" text-anchor="middle">（エージェントの外の世界）</text>
  <text x="610" y="262" font-size="15" font-weight="700" fill="#2E9BEA" text-anchor="middle">状態が変わる</text>
  <path d="M480 160 C420 150 380 150 326 160" stroke="#9AA2CC" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="400" y="136" font-size="15" font-weight="800" fill="#1F2A5C" text-anchor="middle">① 観測（センサー）</text>
  <path d="M326 250 C380 262 420 262 474 250" stroke="#9AA2CC" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="400" y="290" font-size="15" font-weight="800" fill="#1F2A5C" text-anchor="middle">② 行動（アクチュエータ）</text>
  <rect x="150" y="320" width="150" height="34" rx="17.0" fill="#FFFFFF" stroke="#4F5BD5" stroke-width="2"/>
  <text x="225.0" y="342.4" font-size="15" font-weight="700" fill="#1F2A5C" text-anchor="middle">掃除ロボット</text>
  <rect x="320" y="320" width="150" height="34" rx="17.0" fill="#FFFFFF" stroke="#4F5BD5" stroke-width="2"/>
  <text x="395.0" y="342.4" font-size="15" font-weight="700" fill="#1F2A5C" text-anchor="middle">将棋AI</text>
  <rect x="490" y="320" width="150" height="34" rx="17.0" fill="#FFFFFF" stroke="#4F5BD5" stroke-width="2"/>
  <text x="565.0" y="342.4" font-size="15" font-weight="700" fill="#1F2A5C" text-anchor="middle">チャットボット</text>
</svg>
