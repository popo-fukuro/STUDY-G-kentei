# G検定 試験出題範囲（シラバス2024）第1.4版（2026年5月11日）— G2024#6 以降に適用
# 出典：一般社団法人日本ディープラーニング協会（JDLA）「G検定の試験出題範囲（シラバス）G2024#6～」
#       https://www.jdla.org/download-category/syllabus/
# キーワードはシラバスの記載順。表記はシラバスに合わせ、明らかな誤記・ゆれだけ正式名に直した
# （RandAugument→RandAugment、Netwok→Network、Open Pose→OpenPose、UNet→U-Net など。元の表記は aliases に残す）。
# aliases は網羅チェック用の別表記（講義本文での照合に使う）。
# このファイルが網羅チェック表とカリキュラムの「唯一の元データ」。編集したら scripts/build_tables.py を実行する。

meta:
  title: G検定 試験出題範囲（シラバス2024）
  version: "1.4"
  version_date: "2026-05-11"
  applies_from: G2024#6
  source_url: https://www.jdla.org/download-category/syllabus/
  checked_on: "2026-11-24"

fields:
  - id: tech
    name: 技術分野
    categories:
      - name: 人工知能とは
        items:
          - id: T01
            name: 人工知能の定義
            keywords: [AI効果, エージェント, 人工知能, 機械学習, ディープラーニング]
          - id: T02
            name: 人工知能分野で議論される問題
            keywords: [シンギュラリティ, シンボルグラウンディング問題, 身体性, ダートマス会議, トイ・プロブレム, 知識獲得のボトルネック, チューリングテスト, 中国語の部屋, 強いAIと弱いAI, 統計的機械翻訳, フレーム問題, ルールベース機械翻訳, ローブナーコンテスト]
      - name: 人工知能をめぐる動向
        items:
          - id: T03
            name: 探索・推論
            keywords: [αβ法, Mini-Max法, SHRDLU, STRIPS, 探索木, ハノイの塔, 幅優先探索, 深さ優先探索, ブルートフォース, モンテカルロ法]
          - id: T04
            name: 知識表現とエキスパートシステム
            keywords: [Cycプロジェクト, DENDRAL, is-aの関係・has-aの関係・part-ofの関係, Question-Answering, 意味ネットワーク, イライザ (ELIZA), インタビューシステム, ウェブマイニング, オントロジー, セマンティックWeb, データマイニング, 東ロボくん, マイシン (MYCIN), ワトソン]
          - id: T05
            name: 機械学習
            keywords: [次元の呪い, スパムフィルタ, ビッグデータ, レコメンデーションエンジン, 統計的自然言語処理]
          - id: T06
            name: ディープラーニング
            keywords: [ImageNet, ILSVRC, LeNet, アルファ碁 (AlphaGo), 人間の神経回路, ネオコグニトロン, 生成AI]
      - name: 機械学習の概要
        items:
          - id: T07
            name: 教師あり学習
            keywords: [アンサンブル学習, カーネル, カーネルトリック, 回帰問題, 決定木, 勾配ブースティング, サポートベクターマシン (SVM), 線形回帰, 自己回帰モデル (ARモデル), 単回帰分析, 重回帰分析, 多クラス分類, バギング, ブースティング, ブートストラップサンプリング, 分類問題, ベクトル自己回帰モデル (VARモデル), マージン最大化, ランダムフォレスト, ロジスティック回帰]
          - id: T08
            name: 教師なし学習
            keywords: [k-means法, t-SNE, ウォード法, 協調フィルタリング, クラスタリング, コールドスタート問題, コンテンツベースフィルタリング, 次元削減, 主成分分析 (PCA), 潜在的ディリクレ配分法 (LDA), 多次元尺度構成法 (MDS), デンドログラム (樹形図), 特異値分解 (SVD), トピックモデル]
          - id: T09
            name: 強化学習
            keywords: [Actor-Critic, ε-greedy方策, REINFORCE, Q学習, UCB方策, 行動価値関数, 状態価値関数, バンディットアルゴリズム, 方策勾配法, マルコフ決定過程, 割引率, SARSA]
          - id: T10
            name: モデルの選択・評価
            keywords: [k-分割交差検証, 平均二乗誤差 (MSE), 二乗平均平方根誤差 (RMSE), 平均絶対値誤差 (MAE), ROC曲線・AUC, 赤池情報量規準 (AIC), オッカムの剃刀, 過学習, 交差検証, 偽陽性・偽陰性, 真陽性・真陰性, 混同行列, 正解率・適合率・再現率・F値, 汎化性能, ベイズ情報量規準 (BIC), ホールドアウト検証]
      - name: ディープラーニングの概要
        items:
          - id: T11
            name: ニューラルネットワークとディープラーニング
            keywords: [CPU, GPU, TPU, 隠れ層・入力層・出力層, 多層パーセプトロン, 単純パーセプトロン]
          - id: T12
            name: 活性化関数
            keywords: [Leaky ReLU関数, ReLU関数, tanh関数, シグモイド関数, ソフトマックス関数, 勾配消失問題]
          - id: T13
            name: 誤差関数
            keywords: [Contrastive Loss, Triplet Loss, カルバック・ライブラー情報量 (KL), 交差エントロピー, 平均二乗誤差関数]
          - id: T14
            name: 正則化
            keywords: [L0正則化, L1正則化, L2正則化, 正則化, ドロップアウト, ラッソ回帰, リッジ回帰]
          - id: T15
            name: 誤差逆伝播法
            keywords: [勾配消失問題, 勾配爆発問題, 信用割当問題, 連鎖律]
          - id: T16
            name: 最適化手法
            keywords: [AdaBound, AdaDelta, AdaGrad, Adam, AMSBound, RMSprop, 鞍点, イテレーション, エポック, オンライン学習, 学習率, 確率的勾配降下法 (SGD), グリッドサーチ, 勾配降下法, 局所最適解, 早期終了, 大域最適解, 二重降下現象, ノーフリーランチの定理, ハイパーパラメータ, バッチ学習, ミニバッチ学習, モーメンタム, ランダムサーチ]
      - name: ディープラーニングの要素技術
        items:
          - id: T17
            name: 全結合層
            keywords: [重み, 線形関数]
          - id: T18
            name: 畳み込み層
            keywords: [Atrous Convolution, Depthwise Separable Convolution, Dilated Convolution, カーネル, ストライド, 畳み込み操作, 畳み込みニューラルネットワーク (CNN), 特徴マップ, パディング, フィルタ]
          - id: T19
            name: 正規化層
            keywords: [グループ正規化, バッチ正規化, レイヤー正規化, インスタンス正規化]
          - id: T20
            name: プーリング層
            keywords: [グローバルアベレージプーリング (GAP), 最大値プーリング, 不変性の獲得, 平均値プーリング]
          - id: T21
            name: スキップ結合
            keywords: [ResNet]
          - id: T22
            name: 回帰結合層
            keywords: [BPTT, GRU, LSTM, エルマンネットワーク, 勾配消失問題, 勾配爆発問題, 教師強制, ゲート機構, 双方向RNN (Bidirectional RNN), 時系列データ, ジョルダンネットワーク, リカレントニューラルネットワーク (RNN)]
          - id: T23
            name: Attention
            keywords: [Attention, Multi-Head Attention, Self-Attention, Seq2Seq, Source-Target Attention, Transformer, 位置エンコーディング, キー, クエリ, バリュー]
          - id: T24
            name: オートエンコーダ
            keywords: [VQ-VAE・info VAE・β-VAE, 次元削減, 事前学習, 積層オートエンコーダ, 変分オートエンコーダ (VAE)]
          - id: T25
            name: データ拡張
            keywords: [Contrast, Brightness, Crop, CutMix, Cutout, Mixup, noising, paraphrasing, RandAugment, Random Erasing, Random Flip, Rotate]
      - name: ディープラーニングの応用例
        items:
          - id: T26
            name: 画像認識
            keywords: [AlexNet, DeepLab, DenseNet, EfficientNet, Fast R-CNN, Faster R-CNN, FCN (Fully Convolutional Network), FPN, GoogLeNet, Mask R-CNN, MnasNet, MobileNet, NAS (Neural Architecture Search), OpenPose, PSPNet, ResNet, SegNet, SENet, SSD, U-Net, VGG, Vision Transformer, Wide ResNet, YOLO, 一般物体認識, インスタンスセグメンテーション, 姿勢推定, セマンティックセグメンテーション, 物体検出, 物体識別, パノプティックセグメンテーション]
          - id: T27
            name: 自然言語処理
            keywords: [BERT, BoW (Bag-of-Words), CBOW, CEC, ELMo, fastText, GLUE, n-gram, PaLM, Seq2Seq, TF-IDF, word2vec, 感情分析, 機械翻訳, 形態素解析, 構文解析, 質問応答, 情報検索, スキップグラム, 単語埋め込み, 分散表現, 文書要約, ワンホットベクトル, 大規模言語モデル (LLM), 統計的機械翻訳]
          - id: T28
            name: 音声処理
            keywords: [A-D変換, WaveNet, 音韻, 音声合成, 音声認識, 音素, 隠れマルコフモデル, 感情分析, 高速フーリエ変換 (FFT), スペクトル包絡, パルス符号変調器 (PCM), フォルマント, フォルマント周波数, メル周波数ケプストラム係数 (MFCC), メル尺度, 話者識別, CTC]
          - id: T29
            name: 深層強化学習
            keywords: [A3C, Agent57, APE-X, DQN, OpenAI Five, PPO, Rainbow, RLHF, sim2real, アルファスター (AlphaStar), オフライン強化学習, 残差強化学習, 状態表現学習, ダブルDQN, デュエリングネットワーク, ドメインランダマイゼーション, ノイジーネットワーク, 報酬成形, マルチエージェント強化学習 (MARL), 連続値制御]
          - id: T30
            name: データ生成
            keywords: [CycleGAN, DCGAN, Diffusion Model, NeRF, Pix2Pix, 音声生成, 画像生成, 敵対的生成ネットワーク (GAN), 文章生成]
          - id: T31
            name: 転移学習・ファインチューニング
            keywords: [Few-shot, One-shot, 自己教師あり学習, 事前学習, 事前学習済みモデル, 破滅的忘却, 半教師あり学習]
          - id: T32
            name: マルチモーダル
            keywords: [CLIP, DALL-E, Flamingo, Image Captioning, Text-To-Image, Visual Question Answering, Unified-IO, Zero-shot, 基盤モデル, マルチタスク学習]
          - id: T33
            name: モデルの解釈性
            keywords: [CAM, Grad-CAM, LIME, Permutation Importance, SHAP, 説明可能AI (XAI)]
          - id: T34
            name: モデルの軽量化
            keywords: [エッジAI, 蒸留, 宝くじ仮説, プルーニング, モデル圧縮, 量子化]
      - name: AIの社会実装に向けて
        items:
          - id: T35
            name: AIプロジェクトの進め方
            keywords: [AIのビジネス活用, AIプロジェクトの進め方, BPR, CRISP-DM, CRISP-ML, Docker, Jupyter Notebook, MLOps, PoC, Python, Web API, アジャイル, ウォーターフォール, オープン・イノベーション, クラウド, 産学連携, ステークホルダーのニーズ, データサイエンティスト, 他企業や他業種との連携]
          - id: T36
            name: データの収集・加工・分析・学習
            keywords: [アノテーション, オープンデータセット, コーパス, データリーケージ]
      - name: AIに必要な数理・統計知識
        items:
          - id: T37
            name: AIに必要な数理・統計知識
            keywords: [移動平均, 確率分布, 確率変数, 確率密度, 疑似相関, 期待値, 帰無仮説, 共分散, コサイン類似度, 最小二乗法, 最頻値, 最尤法, 条件付き確率, 正規分布, 相関係数, 相互情報量, 対立仮説, 中央値, 度数分布, 二項分布, 外れ値, 標準偏差, 平均, 分散, 偏相関係数, ベルヌーイ分布, ポアソン分布, マハラノビス距離, ユークリッド距離]

  - id: law
    name: 法律・倫理分野
    categories:
      - name: AIに関する法律と契約
        items:
          - id: E01
            name: 個人情報保護法
            keywords: [GDPR, 仮名加工情報, 個人識別符号, 個人データ, 個人情報, 第三者提供, 匿名加工情報, 保有個人データ, 要配慮個人情報, 利用目的, 委託]
          - id: E02
            name: 著作権法
            keywords: [創作性, 著作物, AI生成物, 利用規約, 著作権侵害, 著作権]
          - id: E03
            name: 特許法
            keywords: [発明, 新規性, 進歩性, 知的財産権, 発明者, 職務発明, 特許権]
          - id: E04
            name: 不正競争防止法
            keywords: [営業秘密, 限定提供データ]
          - id: E05
            name: 独占禁止法
            keywords: [競争制限, 公正競争阻害性]
          - id: E06
            name: AI開発委託契約
            keywords: [AI・データの利用に関する契約ガイドライン, NDA, 請負契約, 準委任契約, 精度保証, PoC, 保守契約]
          - id: E07
            name: AIサービス提供契約
            keywords: [SaaS, データ利用権, 利用規約, 精度保証]
      - name: AI倫理・AIガバナンス
        items:
          - id: E08
            name: 国内外のガイドライン
            keywords: [AI倫理, AIガバナンス, 価値原則, ハードロー, ソフトロー, リスクベースアプローチ]
          - id: E09
            name: プライバシー
            keywords: [カメラ画像利活用ガイドブック, プライバシー・バイ・デザイン]
          - id: E10
            name: 公平性
            keywords: [アルゴリズムバイアス, 公平性の定義, サンプリングバイアス, センシティブ属性, 代理変数, データの偏り]
          - id: E11
            name: 安全性とセキュリティ
            keywords: [Adversarial Attack (Adversarial Examples), セキュリティ・バイ・デザイン, データ汚染, データ窃取, モデル窃取, モデル汚染]
          - id: E12
            name: 悪用
            keywords: [ディープフェイク, フェイクニュース]
          - id: E13
            name: 透明性
            keywords: [データの来歴, 説明可能性, ブラックボックス]
          - id: E14
            name: 民主主義
            keywords: [エコーチェンバー, フィルターバブル, フェイクニュース]
          - id: E15
            name: 環境保護
            keywords: [気候変動, モデル学習の電力消費]
          - id: E16
            name: 労働政策
            keywords: [AIとの協働, スキルの喪失, 労働力不足]
          - id: E17
            name: その他の重要な価値
            keywords: [インクルージョン, 軍事利用, 死者への敬意, 人間の自律性]
          - id: E18
            name: AIガバナンス
            keywords: [AIポリシー, ダイバーシティ, AIに対する監査, 倫理アセスメント, 人間の関与, モニタリング, 再現性, トレーサビリティ]

