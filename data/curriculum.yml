# 講義カリキュラム（全28回）
# - items にシラバス項目ID（data/syllabus.yml）を書く。その項目のキーワードは全部この回の担当になる。
# - status: planned（未作成）／ published（公開済み）。公開したら page に docs/ からの相対パスを書く。
# - minutes は「講義を読む＋確認テスト」の目安（1日30分なら minutes/30 日）。
# - 編集したら python scripts/build_tables.py を実行して、カリキュラム表と網羅チェック表を作り直す。

parts:
  - id: P1
    name: AIの全体像と歴史
  - id: P2
    name: 機械学習
  - id: P3
    name: ディープラーニングの基礎
  - id: P4
