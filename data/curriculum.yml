  - id: P5
    name: ディープラーニングの応用例
  - id: P6
    name: 社会実装と数理・統計
  - id: P7
    name: AIに関する法律と契約
  - id: P8
    name: AI倫理・AIガバナンス
  - id: P9
    name: 総仕上げ

lectures:
