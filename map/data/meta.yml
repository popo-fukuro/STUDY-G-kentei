# シラバスの版と改訂
syllabus:
  version: 第1.4版
  date: "2026年5月11日"
  appliesFrom: G2024#6（2024年11月の試験）から適用
  points:
    - 生成AIの登場を受けて、歴史的な知識とディープラーニングの知識の体系を見直した
    - 基盤モデルや言語モデルなど、生成AIに必要な技術を追加した
    - 法律・倫理は、ディープラーニングを使う人が理解しておくべき点を明確化した
  history:
    - {ver: "1.0", date: "2024-05-14", text: シラバス2024を新規作成。LLM・MSE/RMSE/MAE・Contrastive Loss・KL情報量・連鎖律・レイヤー正規化・教師強制・Multi-Head Attention・VQ-VAE・RLHF・Diffusion Model・NeRF・自己教師あり学習などを追加し、ENIAC・深層信念ネットワーク・OCR・IoTなどを削除}
    - {ver: "1.1", date: "2024-09-06", text: 特徴抽出・訓練誤差・汎化誤差・表現学習・平均絶対誤差などを削除。「正則化層」を「正規化層」に変更}
    - {ver: "1.2", date: "2024-09-20", text: Encoder-Decoder Attentionを削除。CTCを音声処理へ移動}
    - {ver: "1.3", date: "2025-05-25", text: 統計的自然言語処理・単回帰分析・SARSA・真陽性/真陰性を追加。Adaboostを削除。LLMを「生成AI」に変更}
    - {ver: "1.4", date: "2026-05-11", text: 自然言語処理からChatGPT・GPT-nを削除。「破壊的忘却」を「破滅的忘却」に変更}

