priorityMethod:
  - JDLAは大項目ごとの出題数や重点分野を示していない。そのため優先度は、次の3つの公式情報だけで判断した。出題頻度を断定するものではない。
  - ①JDLA公式の例題（20問）で、その分野が題材になっているか
  - ②シラバス2024の改訂ポイント・改訂履歴（生成AI・言語モデル、法律・倫理の明確化）にその分野が含まれるか
  - ③シラバス上のキーワード数（その分野がシラバスに占める分量。出題数の比率ではない）
  - 「高」は①〜③のうち複数がはっきり当てはまる分野。キーワード数が多い分野、改訂の中心にある分野を高くした。

readingGuide:
  - {level: 第1階層, name: 試験範囲全体, text: 中心の円。G検定の出題範囲（シラバス2024 第1.4版）の全体。}
  - {level: 第2階層, name: 大分類（17分野）, text: 円周上のカード。シラバスの項目を内容の近さで束ねたもの。6つの領域で色分けした。}
  - {level: 第3階層, name: 中分類（シラバスの55項目）, text: カードの中の一覧。拡大すると表示される。項目ID（T01など）と、学ぶ講義の回を付けた。}
  - {level: 第4階層, name: 小分類（キーワード495語）, text: シラバスの全キーワード。カードを選ぶと右のパネルに、分野別詳細タブでは樹形図で表示。各語に1文の説明を付けた。}
  - {level: バッジ, name: 補, text: シラバスのキーワードにはないが、理解のために追加した語。公式の例題に出てくる語や、改訂で削除された語。}
  - {level: 矢印, name: 分野間の関係, text: 太い実線は特に重要な7つの関係、細い破線はその他の関係。矢じりの向きが影響の向き（両端なら双方向）。}

