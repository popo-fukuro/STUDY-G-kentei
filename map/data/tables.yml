# 関係タブに載せる比較表

compare:
  title: 従来の機械学習とディープラーニングの違い
  columns: [観点, 従来の機械学習, ディープラーニング, 試験での着眼点]
  rows:
    - [特徴量の作り方, 人が設計する（特徴量エンジニアリング）, データから自動で学ぶ, 「特徴量を自動で獲得する」がディープラーニングの特徴]
    - [必要なデータ量, 比較的少なくても学習できる, 大量のデータが必要になりやすい, ビッグデータが第3次ブームの背景]
    - [計算資源, CPUでも十分なことが多い, GPU・TPUで大量の並列計算を行う, GPUが学習に向く理由（並列計算）]
    - [得意なデータ, 表形式の構造化データ, 画像・音声・文章などの非構造化データ, 画像認識・音声認識・自然言語処理での成功]
    - [解釈のしやすさ, 決定木や線形回帰などは理由を説明しやすい, ブラックボックスになりやすく、説明の手法（Grad-CAM・SHAPなど）が要る, 説明可能AI（XAI）と透明性]
    - [代表的な手法, 線形回帰・ロジスティック回帰・SVM・決定木・ランダムフォレスト・k-means法, CNN・RNN・LSTM・Transformer・GAN・VAE, 手法がどちらに属するかの区別]
    - [学習の難しさ, ハイパーパラメータが比較的少ない, 勾配消失・過学習などへの対策（正規化・正則化・最適化手法）が要る, 勾配消失問題とその対策の流れ]

pairs:
  title: 似た概念の見分け方
  items:
    - id: p-learning-types
      title: 教師あり学習／教師なし学習／強化学習
      items:
        - [教師あり学習, 正解（ラベル）つきのデータから、入力と正解の関係を学ぶ]
        - [教師なし学習, 正解のないデータから、まとまりや構造を見つける]
        - [強化学習, 試行錯誤で行動し、報酬の合計が最大になる行動の選び方を学ぶ]
      point: 正解があるか、報酬で学ぶかで区別する。顧客のグループ分けは教師なし、売上の予測は教師あり。
      fields: [ml]
    - id: p-reg-cls
      title: 回帰問題／分類問題
      items:
        - [回帰問題, 連続した数値を予測する（売上・気温）]
        - [分類問題, どのクラスに属するかを予測する（迷惑メールかどうか）]
      point: ロジスティック回帰は名前に「回帰」とあるが、分類に使う。
      fields: [ml]
    - id: p-bag-boost
      title: バギング／ブースティング
      items:
        - [バギング, 複数のモデルを並列に独立して学習し、結果を平均や多数決でまとめる（ランダムフォレスト）]
        - [ブースティング, モデルを順番に学習し、前のモデルの間違いを次のモデルが補う（勾配ブースティング）]
      point: 「並列で独立」がバギング、「順番に補う」がブースティング。
      fields: [ml]
    - id: p-cf-cb
      title: 協調フィルタリング／コンテンツベースフィルタリング
      items:
        - [協調フィルタリング, 好みが似たほかの利用者の行動の履歴から推薦する]
        - [コンテンツベースフィルタリング, 商品そのものの特徴と利用者の好みを照らし合わせて推薦する]
      point: 新しい商品や利用者で困る（コールドスタート問題）のは協調フィルタリング。
      fields: [ml]
    - id: p-qlearn-sarsa
      title: Q学習／SARSA
      items:
        - [Q学習, 次の状態で最も大きいQ値を使って更新する（方策オフ型）]
        - [SARSA, 実際に選んだ次の行動のQ値を使って更新する（方策オン型）]
      point: 更新に「最大のQ値」を使うか、「実際に選んだ行動のQ値」を使うか。
      fields: [ml]
    - id: p-precision-recall
      title: 適合率／再現率
      items:
        - [適合率, 陽性と予測したもののうち、本当に陽性だった割合]
        - [再現率, 本当に陽性のもののうち、陽性と予測できた割合]
      point: 見逃しを減らしたい（病気の検査など）なら再現率、誤検知を減らしたいなら適合率を重視する。
      fields: [eval]
    - id: p-mse-mae
      title: MSE／RMSE／MAE
      items:
        - [MSE, 誤差の2乗の平均。大きな誤差を重く見る]
        - [RMSE, MSEの平方根。元のデータと同じ単位になる]
        - [MAE, 誤差の絶対値の平均。外れ値の影響を受けにくい]
      point: 外れ値に強いのはMAE。単位をそろえたいならRMSE。
      fields: [eval]
    - id: p-cov-corr
      title: 共分散／相関係数／偏相関係数
      items:
        - [共分散, 偏差の積の平均。単位によって大きさが変わる]
        - [相関係数, 共分散を標準偏差で割り、−1〜1にそろえたもの]
        - [偏相関係数, ほかの変数の影響を取り除いた相関]
      point: 「−1〜1」なら相関係数。疑似相関を見抜くには偏相関係数。
      fields: [eval]
    - id: p-sigmoid-relu
      title: シグモイド関数／tanh関数／ReLU関数
      items:
        - [シグモイド関数, 出力0〜1、微分の最大値0.25。勾配消失が起きやすい]
        - [tanh関数, 出力−1〜1、微分の最大値1]
        - [ReLU関数, 正ならそのまま、負なら0。勾配消失が起きにくい]
      point: 微分の最大値（0.25と1）と、出力の範囲をセットで覚える。
      fields: [nn]
    - id: p-l1-l2
      title: L1正則化／L2正則化
      items:
        - [L1正則化, 重みの絶対値の和に罰。不要な重みが0になりやすい（ラッソ回帰）]
        - [L2正則化, 重みの2乗の和に罰。重み全体を小さくする（リッジ回帰）]
      point: 特徴の選択（スパース）になるのはL1。
      fields: [train]
    - id: p-epoch-iter
      title: エポック／イテレーション／バッチ学習
      items:
        - [エポック, 学習データ全体を1回使い切る単位]
        - [イテレーション, パラメータを1回更新する単位（ミニバッチ1つ分）]
        - [バッチ学習, データ全体で勾配を計算してまとめて更新する]
      point: 1000件をミニバッチ100件で学習すると、1エポック＝10イテレーション。
      fields: [train]
    - id: p-optimizers
      title: モーメンタム／AdaGrad／RMSprop／Adam
      items:
        - [モーメンタム, 前回の更新の向きを引き継いで振動を抑える]
        - [AdaGrad, よく更新されたパラメータの学習率を小さくする（小さくなりすぎる）]
        - [RMSprop, 勾配の2乗の移動平均で、AdaGradの欠点を改善する]
        - [Adam, モーメンタムとRMSpropを組み合わせる]
      point: 「何の欠点を何で直したか」の流れで覚える。
      fields: [train]
    - id: p-norms
      title: バッチ正規化／レイヤー正規化／インスタンス正規化／グループ正規化
      items:
        - [バッチ正規化, ミニバッチの中で、チャネルごとにそろえる]
        - [レイヤー正規化, 1つのデータの中で、層全体をそろえる（RNN・Transformer）]
        - [インスタンス正規化, 1つのデータの1つのチャネルごとにそろえる（スタイル変換）]
        - [グループ正規化, 1つのデータの中で、チャネルのグループごとにそろえる]
      point: 「どの範囲で平均と分散をとるか」で区別する。ミニバッチが小さいとバッチ正規化は不安定。
      fields: [cnn]
    - id: p-rnn-lstm-gru
      title: RNN／LSTM／GRU
      items:
        - [RNN, 前の時刻の情報を引き継ぐ。長い系列では勾配消失が起きやすい]
        - [LSTM, 入力・忘却・出力の3つのゲートと記憶セルで、長い期間の情報を保つ]
        - [GRU, リセットと更新の2つのゲートに簡単にしたもの]
      point: ゲートの数（LSTMは3つ、GRUは2つ）と、記憶セルの有無。
      fields: [seq]
    - id: p-attention-types
      title: Self-Attention／Source-Target Attention
      items:
        - [Self-Attention, 同じ系列の中の要素どうしの関係を計算する]
        - [Source-Target Attention, 出力側が入力側のどこに注目するかを計算する]
      point: クエリとキー・バリューが同じ系列から来るならSelf-Attention。
      fields: [seq]
    - id: p-mix-cut
      title: Cutout／Random Erasing／Mixup／CutMix
      items:
        - [Cutout, 画像の一部を四角く塗りつぶす]
        - [Random Erasing, ランダムな四角い領域をランダムな値で消す]
        - [Mixup, 2つの画像全体を重ねて、ラベルも混ぜる]
        - [CutMix, 別の画像の一部を貼り付け、ラベルも面積の割合で混ぜる]
      point: 消すだけ（Cutout・Random Erasing）か、混ぜる（Mixup・CutMix）か。
      fields: [repr]
    - id: p-segmentation
      title: 物体検出／セマンティック／インスタンス／パノプティック
      items:
        - [物体検出, 物体を四角い枠で囲み、種類を判定する]
        - [セマンティックセグメンテーション, 画素ごとに種類を付ける。同じ種類の物体は区別しない]
        - [インスタンスセグメンテーション, 物体ごとに区別して形を切り出す]
        - [パノプティックセグメンテーション, 背景も含めて、両方を組み合わせる]
      point: 「人が3人いる」を3人分に分けられるのがインスタンス。
      fields: [vision]
    - id: p-cbow-skipgram
      title: CBOW／スキップグラム
      items:
        - [CBOW, 周りの単語から、真ん中の単語を予測する]
        - [スキップグラム, 真ん中の単語から、周りの単語を予測する]
      point: どちらもword2vecの学習方法。予測の向きが逆。
      fields: [nlp]
    - id: p-gan-vae-diffusion
      title: GAN／VAE／Diffusion Model
      items:
        - [GAN, 生成器と識別器を競わせて学習する]
        - [VAE, 潜在空間の確率分布からサンプリングして生成する]
        - [Diffusion Model, ノイズを加える過程を逆にたどって、ノイズからデータを復元する]
      point: 「競わせる」がGAN、「潜在変数の分布」がVAE、「ノイズを取り除いていく」が拡散モデル。
      fields: [gen, repr]
    - id: p-pix-cycle
      title: Pix2Pix／CycleGAN
      items:
        - [Pix2Pix, 対になった画像のデータが必要]
        - [CycleGAN, 対になったデータがなくても変換できる]
      point: 「対のデータが要るか」で区別する。
      fields: [gen]
    - id: p-shot
      title: Zero-shot／One-shot／Few-shot
      items:
        - [Zero-shot, 例を1つも与えずに対応する]
        - [One-shot, 1つの例だけで対応する]
        - [Few-shot, 少しの例で対応する]
      point: 与える例の数で区別する。
      fields: [nlp, practical]
    - id: p-compress
      title: 蒸留／プルーニング／量子化
      items:
        - [蒸留, 大きなモデルの出力をまねて、小さなモデルを学習させる]
        - [プルーニング, 重要でない重みやニューロンを取り除く]
        - [量子化, 数値をより少ないビット数で表す]
      point: 「まねる」「削る」「ビットを減らす」。
      fields: [practical]
    - id: p-cam-gradcam
      title: CAM／Grad-CAM／LIME／SHAP
      items:
        - [CAM, GAPのある構造で、判断の根拠となった画像の領域を示す]
        - [Grad-CAM, 勾配を使い、より幅広いモデルで根拠の領域を示す]
        - [LIME, 1つの予測の周りを簡単なモデルで近似して説明する]
        - [SHAP, シャプレイ値で各特徴量の貢献を配分する]
      point: 画像の領域を示すのがCAM系、特徴量の貢献を示すのがLIME・SHAP。
      fields: [practical]
    - id: p-anon-pseudo
      title: 匿名加工情報／仮名加工情報
      items:
        - [匿名加工情報, 個人を識別できず、元に戻せない加工。条件を守れば同意なく第三者に提供できる]
        - [仮名加工情報, ほかの情報と照らし合わせなければ個人を識別できない加工。主に社内での分析用]
      point: 元に戻せないのが匿名加工情報。仮名加工情報は原則として第三者に提供できない。
      fields: [law]
    - id: p-contract
      title: 請負契約／準委任契約
      items:
        - [請負契約, 仕事の完成を約束する。成果物に対して報酬]
        - [準委任契約, 専門家として誠実に仕事をすることを約束する。完成の義務はない]
      point: 結果が読めないAIの開発やPoCでは、準委任契約が合うとされる。
      fields: [law]
    - id: p-hard-soft
      title: ハードロー／ソフトロー
      items:
        - [ハードロー, 法律のように拘束力があり、守らないと罰則などがある]
        - [ソフトロー, ガイドラインのように法的な拘束力はないが、守ることが期待される]
      point: 日本のAIの規律は、ガイドラインなどのソフトローを中心に進められてきた。
      fields: [ethics]
    - id: p-echo-filter
      title: エコーチェンバー／フィルターバブル
      items:
        - [エコーチェンバー, 似た意見の人どうしでやり取りし、意見が強まっていく現象]
        - [フィルターバブル, アルゴリズムによって、自分好みの情報ばかりに囲まれる状態]
      point: 人どうしのつながりが原因ならエコーチェンバー、推薦のアルゴリズムが原因ならフィルターバブル。
      fields: [society]
