id: repr
order: 9
domain: dlcore
color: "#4A3DAD"
name: オートエンコーダ（AE）とデータ拡張
short: AE・データ拡張
shortLines: [AE・, データ拡張]
priority: mid
badges: []
summary: 入力を圧縮して元に戻すことで特徴を学ぶオートエンコーダと、学習データを水増しして汎化性能を上げるデータ拡張。オートエンコーダの発展形のVAEは、生成モデルにもつながる。
themes:
  - オートエンコーダの仕組み（エンコーダとデコーダ）と次元削減
  - 積層オートエンコーダと事前学習
  - 変分オートエンコーダ（VAE）とその改良（VQ-VAE・info VAE・β-VAE）
  - 画像のデータ拡張（反転・回転・切り出し・Cutout・Mixup・CutMix・RandAugment）
  - テキストのデータ拡張（paraphrasing・noising）
keywords: [変分オートエンコーダ (VAE), 積層オートエンコーダ, 事前学習, Cutout, Mixup, CutMix, Random Erasing, RandAugment, paraphrasing]
examPoint: データ拡張の手法の名前と中身の組合せ（どれが混ぜる手法で、どれが消す手法か）を問う。
examTrap: Cutoutは塗りつぶすだけ、CutMixは別の画像を貼ってラベルも混ぜる、Mixupは画像全体を重ねて混ぜる。
priorityReason: JDLA公式の例題Q10（G2024#6、paraphrasing）が題材にしている。シラバス2024でVQ-VAE・info VAE・β-VAEが追加された。キーワード数は17語で、少なめ。
items: [T24, T25]
desc:
  "VQ-VAE・info VAE・β-VAE": VAEの改良版。潜在変数を離散的なコードにする（VQ-VAE）、潜在変数と入力の情報のつながりを保つ（info VAE）、潜在変数の各要素が独立した意味をもつよう促す（β-VAE）。
  "次元削減": オートエンコーダで、入力をより少ない次元の表現に圧縮すること。
  "事前学習": 本来の学習の前に、別の課題やデータで重みを学習しておくこと。積層オートエンコーダでは層ごとに行った。
  "積層オートエンコーダ": オートエンコーダを層ごとに順番に学習して積み重ねる方法。深いネットワークの事前学習に使われた。
  "変分オートエンコーダ (VAE)": 入力を確率分布として潜在空間に表し、そこからサンプリングして新しいデータを生成できるオートエンコーダ。
  "Contrast": 画像の明暗の差（コントラスト）を変えるデータ拡張。
  "Brightness": 画像の明るさを変えるデータ拡張。
  "Crop": 画像の一部を切り出すデータ拡張。
  "CutMix": 画像の一部を切り取って別の画像の一部を貼り付け、ラベルも面積の割合で混ぜるデータ拡張。
  "Cutout": 画像の一部の領域を、四角く塗りつぶすデータ拡張。
  "Mixup": 2つの画像とラベルを、一定の割合で重ね合わせて混ぜるデータ拡張。
  "noising": データにノイズ（雑音）を加えるデータ拡張。
  "paraphrasing": 文章の意味を変えずに、言い換えや同じ意味の語への置き換えをするテキストのデータ拡張。
  "RandAugment": 多くの変換の候補からランダムに選んで適用し、変換の数と強さの2つだけを調整するデータ拡張。
  "Random Erasing": 画像の中のランダムな四角い領域を、ランダムな値で消すデータ拡張。
  "Random Flip": 画像をランダムに左右や上下に反転させるデータ拡張。
  "Rotate": 画像を回転させるデータ拡張。
