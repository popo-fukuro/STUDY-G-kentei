id: society
order: 17
domain: moral
color: "#9C2C6C"
name: 社会への影響とAIガバナンス（民主主義・環境・労働・その他の価値・ガバナンス）
short: 社会とガバナンス
shortLines: [社会と, ガバナンス]
priority: mid
badges: [revised]
summary: AIが社会全体に与える影響（民主主義・環境・働き方など）と、組織がAIを責任をもって使うための仕組み（AIガバナンス）。シラバス2024で大きく広がった範囲。
themes:
  - 民主主義への影響（エコーチェンバー・フィルターバブル・フェイクニュース）
  - 環境保護（モデルの学習の電力消費と気候変動）
  - 労働政策（AIとの協働・スキルの喪失・労働力不足）
  - その他の重要な価値（インクルージョン・軍事利用・死者への敬意・人間の自律性）
  - AIガバナンス（AIポリシー・倫理アセスメント・人間の関与・監査・モニタリング・トレーサビリティ）
keywords: [エコーチェンバー, フィルターバブル, モデル学習の電力消費, スキルの喪失, 人間の自律性, 倫理アセスメント, 人間の関与, トレーサビリティ]
examPoint: 現象の名前と中身の組合せ（エコーチェンバーとフィルターバブルなど）や、ガバナンスの取組みとして適切なものを問う。
examTrap: エコーチェンバーは似た意見の人どうしの交流で考えが強まる現象、フィルターバブルはアルゴリズムで自分好みの情報に囲まれる状態。
priorityReason: JDLA公式の例題Q20（G2024#4、AIと地球環境）が題材にしている。シラバス2024で民主主義・環境保護・労働政策などの項目が加わった。キーワード数は22語で、少なめ。
items: [E14, E15, E16, E17, E18]
desc:
  "エコーチェンバー": 似た意見の人とばかりつながることで、同じ意見が反響するように強まっていく現象。
  "フィルターバブル": 推薦のアルゴリズムによって、自分の好みに合う情報ばかりに囲まれてしまう状態。
  "フェイクニュース": 偽の情報が広まることで、人々の判断や選挙などの民主的な仕組みがゆがめられるおそれ。
  "気候変動": 地球の気温の上昇などの、長い期間の気候の変化。AIの電力消費による温室効果ガスの排出が課題になっている。
  "モデル学習の電力消費": 大規模なモデルの学習に必要な、大量の電力。環境への負荷として問題になっている。
  "AIとの協働": 人がAIに仕事をまかせきりにするのではなく、役割を分けて一緒に働くこと。
  "スキルの喪失": AIに頼ることで、人がもともと持っていた技能や判断力が衰えてしまうこと。
  "労働力不足": 少子高齢化などで働き手が足りなくなること。AIの活用が期待される背景の一つ。
  "インクルージョン": 年齢・障害・言語などにかかわらず、誰もがAIの恩恵を受けられ、取り残されないようにすること。
  "軍事利用": AIを兵器などの軍事目的に使うこと。人の判断を通さずに攻撃する自律型の兵器が議論になっている。
  "死者への敬意": 亡くなった人の声や姿をAIで再現するときなどに、故人の尊厳や遺族の気持ちに配慮すること。
  "人間の自律性": 人が自分の意思で判断し、決められること。AIが人の判断を不当に操作しないよう配慮が求められる。
  "AIポリシー": 組織が、AIをどのような方針で開発・利用するかを定めたもの。
  "ダイバーシティ": 開発チームなどに多様な背景の人を入れ、偏った判断を防ぐこと。
  "AIに対する監査": AIのシステムが方針や規則に沿って適切に作られ、使われているかを点検すること。
  "倫理アセスメント": AIを開発・導入する前に、倫理的なリスクを洗い出して評価すること。
  "人間の関与": AIの判断の過程に人がかかわり、最終的な判断や監督を行うこと（ヒューマン・イン・ザ・ループ）。
  "モニタリング": 運用中のAIの性能や出力の偏りなどを、続けて監視すること。
  "再現性": 同じ条件で、同じ結果が得られること。AIの検証や説明に必要になる。
  "トレーサビリティ": データやモデルの作られ方、判断の過程を、後からたどれるようにすること。
