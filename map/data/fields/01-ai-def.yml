id: ai-def
order: 1
domain: hist
color: "#1B62A3"
name: 人工知能とは（定義と議論される問題）
short: AIの定義と難問
shortLines: [AIの定義, と難問]
priority: mid
badges: []
summary: 「AIとは何か」と、AIの研究で昔から議論されてきた難問を押さえる分野。フレーム問題や中国語の部屋などの思考実験は、AIの限界を説明するときの共通の言葉になる。
themes:
  - 人工知能のレベル分け（単純な制御・古典的な人工知能・機械学習・深層学習）
  - AI効果と「強いAIと弱いAI」
  - フレーム問題・シンボルグラウンディング問題・身体性
  - チューリングテストと中国語の部屋
  - ダートマス会議（「人工知能」という言葉の始まり）
keywords: [AI効果, 強いAIと弱いAI, フレーム問題, シンボルグラウンディング問題, チューリングテスト, 中国語の部屋, ダートマス会議, シンギュラリティ]
examPoint: 思考実験や問題の名前と、その中身・提唱者の組合せを問う。「この説明はどの問題か」を選ぶ形が多い。
examTrap: フレーム問題（関係することだけを選べない）とシンボルグラウンディング問題（記号と意味を結びつけられない）の取り違えに注意。
priorityReason: JDLA公式の例題Q1（G2024#4）がフレーム問題を題材にしている。シラバス2024の改訂ポイントで「人工知能の基礎となる歴史的な知識」の体系が見直された。キーワード数は18語で、全体の中では少なめ。
items: [T01, T02]
subShort:
  T02: AI分野の難問
desc:
  "AI効果": AIで実現された技術が「ただの自動化で知能ではない」とみなされ、AIと呼ばれなくなっていく現象。
  "エージェント": 環境を観測し、目的に向けて自分で行動を選ぶ主体。ソフトウェアやロボットを指す。
  "人工知能": 推論や学習など人間の知的なふるまいを、コンピュータで実現しようとする技術や研究分野。定義は専門家の間でも統一されていない。
  "機械学習": データから規則やパターンを学び、予測や判断に使えるようにする手法の総称。
  "ディープラーニング": 多層のニューラルネットワークで、特徴の取り出し方までデータから学ぶ機械学習の手法。
  "シンギュラリティ": AIが人間の知能を超え、その後の進歩を人間が予測できなくなるとされる転換点（技術的特異点）。カーツワイルは2045年と予測した。
  "シンボルグラウンディング問題": 記号（言葉）と、それが指す実世界の意味をコンピュータがどう結びつけるかという問題。ハルナッドが1990年に提起した。
  "身体性": 知能が成り立つには、身体を通じて環境とかかわる経験が必要だとする考え方。
  "ダートマス会議": 1956年に開かれ、「人工知能（Artificial Intelligence）」という言葉が初めて使われた研究集会。マッカーシーらが提案した。
  "トイ・プロブレム": 迷路やパズルのように、ルールとゴールがはっきりした簡単な問題。第1次ブームのAIはこれしか解けないと批判された。
  "知識獲得のボトルネック": 専門家の知識を聞き出してルールに書き起こす作業が膨大で難しく、エキスパートシステムの壁になった問題。
  "チューリングテスト": 人が文字だけで会話し、相手が機械か人間かを見分けられなければ機械に知能があるとみなすテスト。チューリングが1950年に提案した。
  "中国語の部屋": 規則どおりに記号を操作できても、意味を理解しているとは限らないことを示す思考実験。サールが1980年に発表し、強いAIを批判した。
  "強いAIと弱いAI": 人のように本当に心や理解をもつAI（強いAI）と、知的にふるまう道具としてのAI（弱いAI）を分ける考え方。サールが提唱した。
  "統計的機械翻訳": 大量の対訳データから単語や句の対応の確率を学び、もっともらしい訳を選ぶ機械翻訳。ニューラル機械翻訳の前に主流だった。
  "フレーム問題": 処理能力に限りがあるAIが、課題に関係することだけを選び出して考えることの難しさ。マッカーシーとヘイズが1969年に提起した。
  "ルールベース機械翻訳": 人が書いた文法の規則と辞書に基づいて訳す、初期の機械翻訳の方式。
  "ローブナーコンテスト": チューリングテストの考え方で、最も人間らしい会話をするプログラムを競う大会。1991年に始まった。
