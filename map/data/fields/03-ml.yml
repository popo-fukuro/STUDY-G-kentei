name: 機械学習の手法（教師あり・教師なし・強化学習）
short: 機械学習の手法
shortLines: [機械学習, の手法]
priority: high
badges: []
summary: 正解つきのデータから学ぶ教師あり学習、正解なしで構造を見つける教師なし学習、試行錯誤で報酬を最大にする強化学習。3つの違いと、それぞれの代表的なモデルが出発点になる。
themes:
  - 回帰問題と分類問題、代表的なモデル（線形回帰・ロジスティック回帰・SVM・決定木）
  - アンサンブル学習（バギングとブースティング、ランダムフォレスト）
  - クラスタリング・次元削減・トピックモデル
  - レコメンデーション（協調フィルタリングとコンテンツベース）
  - 強化学習の枠組み（マルコフ決定過程・価値関数・方策）とQ学習・SARSA
keywords: [回帰問題, 分類問題, ロジスティック回帰, サポートベクターマシン (SVM), ランダムフォレスト, k-means法, 主成分分析 (PCA), 協調フィルタリング, Q学習, ε-greedy方策]
examPoint: 具体的な場面（売上の予測、顧客のグループ分けなど）に合う手法を選ばせる形や、手法の名前と特徴の組合せを問う。
examTrap: ロジスティック回帰は名前に「回帰」とあるが分類のモデル。バギング（並列に学習して平均）とブースティング（順番に学習して間違いを補う）の違いにも注意。
priorityReason: JDLA公式の例題Q4（G2022#3、重回帰分析）と例題Q5（G2024#6、レコメンデーションの手法）が題材にしている。シラバス1.3版で単回帰分析・SARSAが追加され、Adaboostが削除された。キーワード数は46語で、分野の中で多い。
items: [T07, T08, T09]
desc:
  "アンサンブル学習": 複数のモデルを組み合わせ、多数決や平均で1つのモデルより精度を高める手法。
  "カーネル": データを高い次元の空間に写したときの内積を、直接計算するための関数。SVMで使う。
  "カーネルトリック": 高い次元への写像を実際には計算せず、カーネル関数だけで内積を求めて計算量を抑える工夫。
  "回帰問題": 売上や気温のように、連続した数値を予測する問題。
  "決定木": 条件による分岐を木の形に重ねて、分類や回帰を行うモデル。判断の理由がわかりやすい。
  "勾配ブースティング": 前のモデルの誤差（残差）を次の弱いモデルが補うように、順番に足し合わせていく手法。
  "サポートベクターマシン (SVM)": クラスの境界と、境界に最も近いデータ（サポートベクター）との距離を最大にする分類のモデル。
  "線形回帰": 説明変数と目的変数の関係を、直線（一次式）で表して予測する回帰のモデル。
  "自己回帰モデル (ARモデル)": 時系列データの今の値を、過去の自分自身の値の組合せで表すモデル。
  "単回帰分析": 1つの説明変数で、目的変数を予測する線形回帰。
  "重回帰分析": 2つ以上の説明変数で、目的変数を予測する線形回帰。
  "多クラス分類": 3つ以上のクラスのうち、どれに当てはまるかを予測する分類問題。
  "バギング": データからランダムに作った複数の標本で別々にモデルを学習し、結果をまとめるアンサンブル学習。
  "ブースティング": 前のモデルが間違えたデータを重視しながら、モデルを順番に学習していくアンサンブル学習。
  "ブートストラップサンプリング": 元のデータから、重複を許してランダムにデータを取り出し、新しい標本を作る方法。
  "分類問題": データがどのグループ（クラス）に属するかを予測する問題。
  "ベクトル自己回帰モデル (VARモデル)": 複数の時系列データを、互いの過去の値も使って同時に表す自己回帰モデル。
  "マージン最大化": クラスの境界と、最も近いデータとの距離をできるだけ大きくとるSVMの考え方。
  "ランダムフォレスト": 特徴量とデータをランダムに選んだ多数の決定木の多数決で予測する、バギングの手法。
  "ロジスティック回帰": 入力の重み付きの和をシグモイド関数で0〜1の確率に変える、分類のためのモデル。
  "k-means法": データを指定したk個のグループに分けるクラスタリングの手法。各グループの中心の計算と、データの割り当てを繰り返す。
  "t-SNE": 高い次元のデータの近さの関係を保ったまま、2次元や3次元に縮めて可視化する手法。
  "ウォード法": まとめたときのばらつきの増え方が最も小さい組から順に結合していく、階層的クラスタリングの手法。
  "協調フィルタリング": 好みが似ているほかの利用者の行動の履歴をもとに推薦する方法。
  "クラスタリング": 正解のラベルなしで、似たデータどうしをグループにまとめる手法。
  "コールドスタート問題": 新しい利用者や商品には履歴がないため、協調フィルタリングでは推薦が難しい問題。
  "コンテンツベースフィルタリング": 商品の特徴（ジャンルや説明文など）と利用者の好みを照らし合わせて推薦する方法。履歴の少ない商品でも推薦できる。
  "次元削減": データの情報をなるべく保ったまま、特徴量の数（次元）を減らすこと。
  "主成分分析 (PCA)": データのばらつきが最も大きい方向から順に新しい軸（主成分）をとり、少ない次元で表す手法。
  "潜在的ディリクレ配分法 (LDA)": 文書は複数のトピックが混ざったもので、トピックごとに単語の出やすさが違うと考えるトピックモデル。
  "多次元尺度構成法 (MDS)": データどうしの距離の関係をできるだけ保って、低い次元に配置する手法。
  "デンドログラム (樹形図)": 階層的クラスタリングで、データがまとまっていく順番を木の形に表した図。
  "特異値分解 (SVD)": 行列を3つの行列の積に分解する方法。次元削減や推薦に使う。
  "トピックモデル": 文書の集まりから、その背後にある話題（トピック）を推定するモデル。
  "Actor-Critic": 行動を選ぶ役（Actor）と、その行動を評価する役（Critic）を組み合わせた強化学習の手法。
  "ε-greedy方策": 確率εでランダムに行動を試し（探索）、それ以外は今いちばん良い行動を選ぶ（活用）方策。
  "REINFORCE": 得られた報酬をもとに方策のパラメータを直接更新する、方策勾配法の基本的なアルゴリズム。
  "Q学習": 行動価値（Q値）を、次の状態で最も大きいQ値を使って更新していく強化学習の手法。
  "UCB方策": これまでの平均の報酬に、試した回数が少ない行動ほど大きくなる上乗せをして行動を選ぶ方策。
  "行動価値関数": ある状態である行動をとったとき、その後に得られる報酬の合計の期待値を表す関数（Q関数）。
  "状態価値関数": ある状態から方策に従って行動したとき、得られる報酬の合計の期待値を表す関数。
  "バンディットアルゴリズム": 当たりの確率がわからない複数の選択肢から、探索と活用のバランスをとって報酬を最大にする手法。
  "方策勾配法": 方策そのものをパラメータで表し、報酬が増える方向へパラメータを更新する強化学習の手法。
  "マルコフ決定過程": 次の状態が今の状態と行動だけで決まる性質（マルコフ性）を前提にした、強化学習の問題の枠組み。
  "割引率": 将来の報酬をどれだけ割り引いて評価するかを決める、0〜1の値。
  "SARSA": 実際に選んだ次の行動のQ値を使って行動価値を更新する手法。Q学習と違い、今の方策に沿って学ぶ（方策オン型）。
