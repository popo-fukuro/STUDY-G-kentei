domain: dlcore
color: "#4752C4"
name: ニューラルネットワークの基本部品（構造・活性化関数・誤差関数・全結合層）
short: NNの基本部品
shortLines: [NNの, 基本部品]
priority: mid
badges: []
summary: ニューラルネットワークの骨組み（層とパーセプトロン）、出力を曲げる活性化関数、学習の目標を決める誤差関数。ディープラーニングのすべての技術の部品になる。
themes:
  - 単純パーセプトロンと多層パーセプトロン（線形分離の限界）
  - CPU・GPU・TPUの違いと、GPUが学習に向く理由
  - 活性化関数（シグモイド・tanh・ReLU・ソフトマックス）と勾配消失問題
  - 誤差関数（平均二乗誤差・交差エントロピー・KL情報量・Contrastive Loss・Triplet Loss）
keywords: [単純パーセプトロン, 多層パーセプトロン, GPU, ReLU関数, シグモイド関数, ソフトマックス関数, 勾配消失問題, 交差エントロピー, カルバック・ライブラー情報量 (KL)]
examPoint: 活性化関数の出力の範囲や微分の大きさ、問題の種類に合う誤差関数の組合せ（回帰なら平均二乗誤差、分類なら交差エントロピー）を問う。
examTrap: シグモイド関数の微分の最大値は0.25、tanh関数は1。KL情報量は2つの分布を入れ替えると値が変わる（対称ではない）。
priorityReason: JDLA公式の例題Q6（G2024#6、KL情報量）と例題Q7（G2022#1、勾配消失問題）が題材にしている。シラバス2024でContrastive Loss・KL情報量が追加された。キーワード数は19語で、少なめ。
items: [T11, T12, T13, T17]
subShort:
  T11: NNとディープラーニング
desc:
  "CPU": 汎用の計算装置。複雑な処理を順番にこなすのが得意で、大量の単純な計算を並列に行うのは苦手。
  "GPU": もとは画像処理用の、単純な計算を大量に並列で行える装置。行列の計算が多いディープラーニングの学習を大きく速くした。
  "TPU": Googleが開発した、ディープラーニングのテンソル計算に特化した装置。
  "隠れ層・入力層・出力層": データを受け取る層（入力層）、途中で特徴を変換する層（隠れ層）、結果を出す層（出力層）。
  "多層パーセプトロン": 入力層と出力層の間に隠れ層をもつニューラルネットワーク。線形分離できない問題も扱える。
  "単純パーセプトロン": 入力層と出力層だけの最も単純なニューラルネットワーク。線形分離できる問題しか解けない。
  "Leaky ReLU関数": 入力が負のときにもわずかな傾きをもたせたReLU関数。負の側で勾配が0になる問題を和らげる。
  "ReLU関数": 入力が正ならそのまま、負なら0を出す活性化関数。勾配消失が起きにくく、隠れ層で広く使われる。
  "tanh関数": 出力が−1〜1になる活性化関数。微分の最大値は1で、シグモイド関数より勾配が消えにくい。
  "シグモイド関数": 出力が0〜1になるS字型の活性化関数。微分の最大値が0.25と小さく、層が深いと勾配消失が起きやすい。
  "ソフトマックス関数": 複数の出力を、合計が1になる確率に変える活性化関数。多クラス分類の出力層で使う。
  "勾配消失問題": 誤差逆伝播で層をさかのぼるほど勾配が小さくなり、入力に近い層が学習できなくなる問題。微分の小さい活性化関数で起きやすい。
  "Contrastive Loss": 同じ組のデータは近く、違う組のデータは一定以上遠くなるように学習させる誤差関数。
  "Triplet Loss": 基準・同じ種類・違う種類の3つのデータを使い、同じ種類との距離が違う種類との距離より小さくなるように学習させる誤差関数。
  "カルバック・ライブラー情報量 (KL)": 2つの確率分布がどれだけ違うかを表す量。2つを入れ替えると値が変わる（非対称）。
  "交差エントロピー": 予測した確率分布と正解の分布のずれを表す量。分類問題の誤差関数として使う。
  "平均二乗誤差関数": 予測値と正解の差の2乗の平均を誤差とする関数。回帰問題で使う。
  "重み": 入力にかける係数で、学習によって調整されるパラメータ。入力の重要度を表す。
  "線形関数": 入力に重みをかけて足し、バイアスを加えるだけの一次式の関数。全結合層の計算の中身。
