id: project
order: 14
domain: social
color: "#8A5300"
name: AIの社会実装（プロジェクトの進め方とデータ）
short: プロジェクトとデータ
shortLines: [プロジェクト, とデータ]
priority: mid
badges: []
summary: AIを実際の事業に組み込むまでの進め方と、学習に使うデータの集め方・扱い方。技術だけでなく、関係者との合意やデータの品質がプロジェクトの成否を分ける。
themes:
  - AIプロジェクトの流れ（課題設定→PoC→開発→運用）とCRISP-DM・CRISP-ML
  - MLOpsと開発の環境（Python・Jupyter Notebook・Docker・クラウド・Web API）
  - 開発の進め方（アジャイルとウォーターフォール）と、外部との連携（オープン・イノベーション・産学連携）
  - データの準備（アノテーション・コーパス・オープンデータセット）とデータリーケージ
keywords: [AIプロジェクトの進め方, PoC, CRISP-DM, MLOps, アジャイル, アノテーション, オープンデータセット, データリーケージ]
examPoint: プロジェクトの各段階で何をするか、データの扱いで起きる問題（データリーケージなど）の原因と影響を問う。
examTrap: データリーケージがあると検証では精度が高く見えるが、実際に使うと精度が出ない。過学習とは原因が違う。
priorityReason: JDLA公式の例題Q14（G2022#1、データリーケージの影響）が題材にしている。キーワード数は23語。シラバスの改訂履歴で、この分野の変更はない。
items: [T35, T36]
subShort:
  T36: データの収集と加工
desc:
  "AIのビジネス活用": AIを使って、業務の効率化や新しい製品・サービスなど、事業の価値を生み出すこと。
  "AIプロジェクトの進め方": 課題の設定からデータの収集、PoC、開発、運用と改善までを段階的に進めていく流れ。
  "BPR": 業務の流れを根本から見直して、つくり直すこと（ビジネスプロセス・リエンジニアリング）。
  "CRISP-DM": ビジネスの理解から、データの理解・準備、モデルの作成、評価、展開へと進む、データ分析の標準的な進め方。
  "CRISP-ML": CRISP-DMを機械学習向けに広げ、品質の確認や運用・監視の段階も含めた進め方。
  "Docker": アプリと実行環境をコンテナにまとめて、どこでも同じように動かせるようにするツール。
  "Jupyter Notebook": コードと実行結果、説明の文章を1つのノートにまとめ、対話的に実行できるツール。
  "MLOps": 機械学習のモデルの開発から運用・監視・再学習までを、継続的に回すための仕組みと考え方。
  "PoC": 本格的な開発の前に、アイデアや技術が本当に役立つかを小さく試して確かめること（概念実証）。
  "Python": 機械学習のライブラリが充実していて、AIの開発で広く使われるプログラミング言語。
  "Web API": ネットワーク越しに、ほかのシステムの機能やデータを呼び出して使うための窓口。
  "アジャイル": 短い期間で開発と確認を繰り返し、変化に合わせながら進める開発の方法。
  "ウォーターフォール": 要件定義から設計・開発・テストへと工程を順に進め、原則として前の工程に戻らない開発の方法。
  "オープン・イノベーション": 社外の技術やアイデアを取り入れたり外部と協力したりして、新しい価値を生み出すこと。
  "クラウド": サーバや計算の資源を、インターネット経由で必要な分だけ使う仕組み。
  "産学連携": 企業と大学などの研究機関が協力して、研究開発や人材の育成を行うこと。
  "ステークホルダーのニーズ": 利用者・経営者・現場など、プロジェクトにかかわる人たちの要望。最初にすり合わせておく。
  "データサイエンティスト": データの分析や機械学習を使って、ビジネスの課題を解決する専門家。
  "他企業や他業種との連携": データや技術、ノウハウを持ち寄るために、ほかの会社やほかの業種と協力すること。
  "アノテーション": 画像や文章などのデータに、正解のラベルや情報を付ける作業。
  "オープンデータセット": 誰でも使えるように公開されているデータセット。利用の条件（ライセンス）の確認が必要。
  "コーパス": 自然言語処理のために集めて整理した、大量の文章のデータ。
  "データリーケージ": 予測のときには使えないはずの情報（正解など）が学習データに紛れ込み、検証では精度が高いのに実際には精度が出なくなること。
