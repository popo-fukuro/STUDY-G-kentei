id: cnn
order: 7
domain: dlcore
color: "#4B4FC0"
name: 畳み込みニューラルネットワークの層（畳み込み・正規化・プーリング・スキップ結合）
short: CNNの層
priority: mid
badges: []
summary: 画像の特徴を取り出すCNNを作る層。フィルタを当てる畳み込み、値をそろえる正規化、まとめて小さくするプーリング、深くしても学習できるようにするスキップ結合。
themes:
  - 畳み込み操作（フィルタ・ストライド・パディング・特徴マップ）
  - 計算を減らす・範囲を広げる畳み込み（Depthwise Separable、Dilated／Atrous）
  - 正規化の種類（バッチ・レイヤー・インスタンス・グループ）
  - プーリング（最大値・平均値・GAP）と不変性
  - スキップ結合とResNet
keywords: [畳み込みニューラルネットワーク (CNN), フィルタ, ストライド, パディング, 特徴マップ, バッチ正規化, レイヤー正規化, 最大値プーリング, グローバルアベレージプーリング (GAP), ResNet]
examPoint: パディングやストライドで出力の大きさがどう変わるか、正規化の種類ごとにどの単位でそろえるか、GAPの役割を問う。
examTrap: バッチ正規化はミニバッチ内でそろえ、レイヤー正規化は1つのデータの中でそろえる。Dilated ConvolutionとAtrous Convolutionは同じもの。
priorityReason: JDLA公式の例題Q8（G2024#4、パディング）・例題Q9（G2024#4、GAP）・例題Q3（G2022#1、スキップ結合のResNet）が題材にしている。シラバス2024でレイヤー正規化が追加され、1.1版で「正則化層」が「正規化層」に改められた。キーワード数は19語。
items: [T18, T19, T20, T21]
desc:
  "Atrous Convolution": フィルタの要素の間にすき間をあけて、計算量を増やさずに広い範囲を見る畳み込み。Dilated Convolutionと同じもの。
  "Depthwise Separable Convolution": 畳み込みを、チャネルごとの空間方向の畳み込みと1×1の畳み込みに分けて、計算量を大きく減らす方法。
  "Dilated Convolution": フィルタを間隔をあけて当て、見ている範囲（受容野）を広げる畳み込み。
  "カーネル": 畳み込みで画像に重ねて計算する、小さな重みの行列。フィルタとも呼ぶ。
  "ストライド": フィルタをずらす間隔。大きくすると、出力の特徴マップが小さくなる。
  "畳み込み操作": 画像にフィルタを重ねてずらしながら、かけ算と足し算を行って特徴を取り出す計算。
  "畳み込みニューラルネットワーク (CNN)": 畳み込み層とプーリング層を重ねて、画像などから特徴を取り出すニューラルネットワーク。
  "特徴マップ": 畳み込みの結果できる、どこにどんな特徴があるかを表した出力。
  "パディング": 入力の周りを0などで埋めて、畳み込み後の出力の大きさを調整すること。
  "フィルタ": 畳み込みで使う重みの行列。縦の線や角など、特定の特徴に強く反応する。
  "グループ正規化": チャネルをいくつかのグループに分け、グループごとに正規化する方法。ミニバッチが小さくても安定する。
  "バッチ正規化": ミニバッチの中のデータで、各チャネルの出力を平均0・分散1にそろえる方法。学習を安定させ、速くする。
  "レイヤー正規化": 1つのデータの中で、層の出力全体を正規化する方法。RNNやTransformerで使う。
  "インスタンス正規化": 1つのデータの1つのチャネルごとに正規化する方法。画像のスタイル変換で使う。
  "グローバルアベレージプーリング (GAP)": 各特徴マップ全体の平均を1つの値にまとめるプーリング。全結合層の代わりに使い、パラメータを減らす。
  "最大値プーリング": 区切った範囲の中の最大値を取り出して、特徴マップを小さくする方法。
  "不変性の獲得": プーリングによって、対象の位置が少しずれても同じ特徴として扱えるようになること。
  "平均値プーリング": 区切った範囲の中の平均値を取り出して、特徴マップを小さくする方法。
  "ResNet": 層を飛び越えて入力を足し合わせるスキップ結合で、とても深いネットワークを学習できるようにしたモデル。2015年のILSVRCで優勝した。
