id: nlp
order: 11
domain: dlapp
color: "#7A39B5"
name: 自然言語処理とマルチモーダル
short: 言語・マルチモーダル
shortLines: [言語・, マルチモーダル]
priority: high
badges: [revised]
summary: 言葉をコンピュータで扱う技術（単語の表現から大規模言語モデルまで）と、画像と文章など複数の種類のデータをまとめて扱うマルチモーダル。生成AIの中心にある分野。
themes:
  - 文章の表現の発展（ワンホット・BoW・TF-IDF→分散表現・word2vec→文脈で変わる表現・ELMo・BERT）
  - 自然言語処理の基本の処理（形態素解析・構文解析）と応用（機械翻訳・要約・質問応答・感情分析）
  - 大規模言語モデル（LLM）と評価のベンチマーク（GLUE）
  - マルチモーダルのモデル（CLIP・DALL-E・Flamingo・Unified-IO）と課題（画像の説明文・VQA・Text-To-Image）
  - 基盤モデル・Zero-shot・マルチタスク学習
keywords: [word2vec, 分散表現, TF-IDF, BERT, 大規模言語モデル (LLM), Seq2Seq, CLIP, 基盤モデル, Zero-shot, Text-To-Image]
examPoint: 手法の発展の順番や、手法と特徴の組合せ（CBOWとスキップグラムの違いなど）、マルチモーダルのモデルの課題を問う。
examTrap: CBOWは周りの語から真ん中の語を予測し、スキップグラムは真ん中の語から周りの語を予測する。ChatGPT・GPT-nはシラバス1.4版でキーワードから削除された。
priorityReason: JDLA公式の例題Q11（G2024#4、大規模言語モデルの前提となるスケーリング則）と例題Q13（G2024#6、Zero-shot）が題材にしている。シラバス2024の改訂ポイントで「基盤モデルや言語モデル」が追加され、1.4版でChatGPT・GPT-nが削除された。キーワード数は35語。
items: [T27, T32]
desc:
  "BERT": Transformerのエンコーダを使い、文の一部を隠して前後から当てる学習などで事前学習した言語モデル。2018年にGoogleが発表した。
  "BoW (Bag-of-Words)": 文章を、語順を無視して単語ごとの出現回数で表す方法。
  "CBOW": 周りの単語から真ん中の単語を予測して、単語の分散表現を学ぶword2vecの方法。
  "CEC": LSTMの記憶セルで、誤差を減らさずに長く伝える仕組み（Constant Error Carousel）。
  "ELMo": 双方向のLSTMで、文脈によって変わる単語の表現を学ぶ言語モデル。
  "fastText": 単語をさらに文字の並び（部分語）に分けて学習し、未知の単語にも対応しやすくした分散表現の手法。
  "GLUE": 文の分類や含意の判定など、複数の課題で言語モデルの理解力を総合的に評価するベンチマーク。
  "n-gram": 連続するn個の単語や文字の並び。言語を統計的に扱うときに使う。
  "PaLM": Googleが2022年に発表した、5,400億パラメータの大規模言語モデル。
  "Seq2Seq": 入力の文章を別の文章に変換する、エンコーダ・デコーダのモデル。機械翻訳や要約に使う。
  "TF-IDF": 単語の出現頻度（TF）に、多くの文書に出る語ほど小さくなる値（IDF）をかけて、その文書での単語の重要さを表す指標。
  "word2vec": 周りの単語との関係から、単語を意味が反映されたベクトル（分散表現）で表す手法。2013年に発表された。
  "感情分析": 文章が肯定的か否定的かなど、書き手の感情や評価を判定すること。
  "機械翻訳": ある言語の文章を、別の言語にコンピュータで翻訳すること。
  "形態素解析": 文章を意味をもつ最小の単位（形態素）に分け、品詞などを判定すること。
  "構文解析": 文の中の語どうしの文法的な関係（係り受けなど）を解析すること。
  "質問応答": 質問文に対して、適切な答えを返すこと。
  "情報検索": 大量の文書から、目的に合う情報を探し出すこと。
  "スキップグラム": 真ん中の単語から周りの単語を予測して、単語の分散表現を学ぶword2vecの方法。
  "単語埋め込み": 単語を、意味の近さが距離に表れる数値のベクトルに変換すること。
  "分散表現": 単語などを、多くの次元に意味が分散した密なベクトルで表す方法。
  "文書要約": 長い文章から重要な内容を取り出し、短くまとめること。
  "ワンホットベクトル": 1つの要素だけが1で、残りがすべて0のベクトル。単語を区別するだけで、意味の近さは表せない。
  "大規模言語モデル (LLM)": 大量の文章で事前学習した、とても多くのパラメータをもつ言語モデル。文章の生成・要約・質問応答などを幅広くこなす。
  "統計的機械翻訳": 対訳データから単語や句の対応の確率を学んで訳す機械翻訳。ニューラル機械翻訳が登場する前の主流。
  "CLIP": 画像とその説明文の組を大量に学び、画像と文章を同じ空間で比べられるようにしたモデル。2021年にOpenAIが発表した。
  "DALL-E": 文章の指示から画像を生成する、OpenAIのモデル。
  "Flamingo": 画像と文章を組み合わせた入力を扱う、DeepMindの視覚言語モデル。少しの例を見せるだけで新しい課題に対応する。
  "Image Captioning": 画像の内容を説明する文章を、自動で作ること。
  "Text-To-Image": 文章から画像を生成すること。
  "Visual Question Answering": 画像についての質問に、文章で答えること。
  "Unified-IO": 画像・文章などさまざまな入出力の課題を、1つのモデルで扱えるようにしたモデル。
  "Zero-shot": 学習のときに見ていないクラスや課題に、例を与えずに対応すること。
  "基盤モデル": 大量で多様なデータで事前学習され、さまざまな課題に合わせて使える大規模なモデル。
  "マルチタスク学習": 関連する複数の課題を1つのモデルで同時に学習し、性能を互いに高めること。
extra:
