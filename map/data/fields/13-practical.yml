name: 転移学習・モデルの解釈性・モデルの軽量化
short: 転移・解釈・軽量化
shortLines: [転移・解釈・, 軽量化]
priority: mid
badges: []
summary: 学習済みのモデルを使い回す転移学習、AIの判断の理由を示す解釈性、スマホなどで動かすための軽量化。ディープラーニングを実際の現場で使うための工夫が集まった分野。
themes:
  - 転移学習とファインチューニング、事前学習済みモデル
  - 少ないラベルで学ぶ方法（Few-shot・One-shot・半教師あり学習・自己教師あり学習）と破滅的忘却
  - 判断の根拠の可視化（CAM・Grad-CAM）と特徴量の重要度（LIME・SHAP・Permutation Importance）
  - モデルの軽量化（蒸留・プルーニング・量子化・宝くじ仮説）とエッジAI
keywords: [事前学習済みモデル, 自己教師あり学習, 破滅的忘却, Few-shot, Grad-CAM, LIME, SHAP, 蒸留, プルーニング, 量子化, エッジAI]
examPoint: 軽量化の手法の名前と中身（蒸留・プルーニング・量子化）、説明の手法の名前と特徴を問う。
examTrap: 蒸留は小さなモデルに学ばせる、プルーニングは重みを取り除く、量子化は数値のビット数を減らす。シラバスの表記は「破滅的忘却」（1.4版で「破壊的忘却」から変更）。
priorityReason: JDLA公式の例題Q12（G2024#4、量子化）が題材にしている。シラバス2024で自己教師あり学習・破壊的忘却が追加され、1.4版で「破滅的忘却」に改められた。キーワード数は19語。
items: [T31, T33, T34]
subShort:
  T31: 転移学習・微調整
desc:
  "Few-shot": 少しの例だけで、新しい課題に対応すること。
  "One-shot": 1つの例だけで、新しい課題に対応すること。
  "自己教師あり学習": 人がラベルを付けなくても、データ自身から作った課題（隠した部分の予測など）で学習する方法。
  "事前学習": 大量のデータで汎用的な特徴を学んでおくこと。その後のファインチューニングの土台になる。
  "事前学習済みモデル": 大量のデータですでに学習され、公開・再利用できるモデル。
  "破滅的忘却": 新しい課題を学習すると、以前に学習した課題の性能が大きく下がってしまう現象。
  "半教師あり学習": 少しのラベル付きデータと、大量のラベルなしデータを組み合わせて学習する方法。
  "CAM": 最後の畳み込み層の特徴マップと出力の重みから、画像のどこが判断の根拠になったかを示す手法。GAPのある構造で使う。
  "Grad-CAM": 勾配の情報を使って、判断の根拠となった画像の領域を示す手法。CAMより幅広いモデルに使える。
  "LIME": 説明したい1つの予測の周りを簡単なモデルで近似して、どの特徴が効いたかを示す手法。
  "Permutation Importance": ある特徴量の値をシャッフルしたときの精度の下がり方から、その特徴量の重要度を測る手法。
  "SHAP": ゲーム理論のシャプレイ値を使い、各特徴量が予測にどれだけ貢献したかを公平に配分して示す手法。
  "説明可能AI (XAI)": AIの判断の理由や根拠を、人が理解できるように示す技術や研究。
  "エッジAI": クラウドではなく、スマホやカメラなど現場の機器（エッジ）の中でAIの処理を行うこと。
  "蒸留": 大きなモデル（教師）の出力を目標に、小さなモデル（生徒）を学習させて性能を引き継ぐ方法。
  "宝くじ仮説": 大きなネットワークの中には、それだけで同じくらいの性能を出せる小さな部分ネットワークが含まれているという仮説。
  "プルーニング": 重要でない重みやニューロンを取り除いて、モデルを小さくする方法（枝刈り）。
  "モデル圧縮": 性能をなるべく落とさずに、モデルの大きさや計算量を減らす方法の総称。
  "量子化": 重みなどの数値を、より少ないビット数で表してモデルを軽くする方法。
