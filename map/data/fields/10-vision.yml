id: vision
order: 10
domain: dlapp
color: "#6A3DCB"
name: 画像認識と音声処理
short: 画像・音声
priority: high
badges: []
summary: CNNを中心にした画像認識のモデル（分類・物体検出・セグメンテーション・姿勢推定）と、音声の信号処理から音声認識・音声合成まで。モデル名と「何をするモデルか」の対応が多い分野。
themes:
  - 画像分類のモデルの発展（AlexNet→VGG・GoogLeNet→ResNet→EfficientNet・Vision Transformer）
  - 物体検出（R-CNN系の2段階型と、YOLO・SSDの1段階型）
  - セグメンテーションの種類（セマンティック・インスタンス・パノプティック）と代表モデル
  - 軽量なモデルと自動設計（MobileNet・NAS・MnasNet）、姿勢推定（OpenPose）
  - 音声のデジタル化と特徴量（A-D変換・PCM・FFT・MFCC）、音声認識・音声合成（HMM・WaveNet・CTC）
keywords: [AlexNet, ResNet, Vision Transformer, 物体検出, YOLO, Faster R-CNN, セマンティックセグメンテーション, インスタンスセグメンテーション, U-Net, メル周波数ケプストラム係数 (MFCC), WaveNet]
examPoint: モデルの名前と特徴・課題（物体検出か、セグメンテーションか）の組合せや、ILSVRCで優勝したモデルの順番を問う。
examTrap: セマンティックセグメンテーションは同じ種類の物体を区別しない、インスタンスセグメンテーションは物体ごとに区別する。Mask R-CNNはインスタンスセグメンテーション。
priorityReason: JDLA公式の例題Q3（G2022#1、ILSVRCとResNet）が題材にしている。シラバス2024で話者識別が追加され、1.2版でCTCが音声処理へ移された。キーワード数は48語で、分野の中で最も多い。
items: [T26, T28]
desc:
  "AlexNet": 2012年のILSVRCで大差をつけて優勝したCNN。ReLUやドロップアウトを使い、第3次AIブームのきっかけになった。
  "DeepLab": Atrous Convolutionで広い範囲を見る、セマンティックセグメンテーションのモデル。
  "DenseNet": 各層を、それより前のすべての層と結合するCNN。特徴を再利用してパラメータを減らす。
  "EfficientNet": 層の深さ・幅・入力画像の解像度を、バランスよく同時に大きくする方法（複合スケーリング）を使ったCNN。
  "Fast R-CNN": 画像全体を一度だけCNNに通して候補領域の特徴を取り出し、R-CNNを高速にした物体検出のモデル。
  "Faster R-CNN": 候補領域を探す部分もニューラルネットワーク（RPN）で行い、さらに速くした物体検出のモデル。
  "FCN (Fully Convolutional Network)": 全結合層を使わず、畳み込み層だけで作ったセマンティックセグメンテーションのモデル。
  "FPN": 解像度の違う特徴マップを組み合わせて、大小さまざまな物体を検出しやすくした構造。
  "GoogLeNet": 大きさの違うフィルタを並列に使うInceptionモジュールを重ねたCNN。2014年のILSVRCで優勝した。
  "Mask R-CNN": Faster R-CNNに物体の形を切り出す仕組みを加え、インスタンスセグメンテーションを行うモデル。
  "MnasNet": スマホでの実際の処理速度も考えに入れながら、NASで自動設計されたモバイル向けのCNN。
  "MobileNet": Depthwise Separable Convolutionで計算量を減らした、スマホなど向けの軽いCNN。
  "NAS (Neural Architecture Search)": ネットワークの構造そのものを、強化学習などで自動的に探す方法。
  "OpenPose": 画像の中の複数の人の関節の位置を推定し、骨格をつなぐ姿勢推定の手法。
  "PSPNet": 大きさの違う領域ごとにプーリングして、画像全体の文脈を取り込むセマンティックセグメンテーションのモデル。
  "ResNet": スキップ結合で152層もの深いネットワークを実現したCNN。2015年のILSVRCで優勝した。
  "SegNet": エンコーダとデコーダからなり、プーリングした位置を覚えておいて元の解像度に戻すセグメンテーションのモデル。
  "SENet": チャネルごとの重要度を学習して重み付けする仕組みをもつCNN。2017年のILSVRCで優勝した。
  "SSD": 大きさの違う複数の特徴マップから、1回の処理で物体の位置と種類を同時に予測する物体検出のモデル。
  "U-Net": U字型のエンコーダ・デコーダの構造で、同じ解像度の特徴を結合するセグメンテーションのモデル。医療画像で広く使われる。
  "VGG": 3×3の小さなフィルタを深く重ねた、単純な構造のCNN。2014年のILSVRCで好成績を出した。
  "Vision Transformer": 画像を小さなパッチに分け、単語の列のようにTransformerで処理する画像認識のモデル。
  "Wide ResNet": ResNetの層を深くする代わりに幅（チャネル数）を広げ、性能と学習の速さを改善したモデル。
  "YOLO": 画像全体を一度だけ見て、物体の位置と種類を同時に予測する高速な物体検出のモデル。
  "一般物体認識": 決まった物に限らず、日常のさまざまな物体を認識すること。
  "インスタンスセグメンテーション": 物体ごとに区別して、その形を画素単位で切り出すこと。
  "姿勢推定": 画像や動画から、人の関節の位置や体の向きを推定すること。
  "セマンティックセグメンテーション": 画像の画素1つ1つに、どの種類に属するかのラベルを付けること。同じ種類の物体どうしは区別しない。
  "物体検出": 画像の中の物体の位置を四角い枠で示し、その種類も判定すること。
  "物体識別": 画像に写っている物体が何かを判定すること。
  "パノプティックセグメンテーション": セマンティックとインスタンスの両方を組み合わせ、背景も含めて物体ごとに画素単位でラベルを付けること。
  "A-D変換": 音声などの連続したアナログの信号を、コンピュータで扱えるデジタルの数値に変えること。
  "WaveNet": DeepMindが2016年に発表した、音声の波形を直接生成するモデル。自然な音声合成を実現した。
  "音韻": 言語の中で意味を区別するのに使われる音の単位を、抽象的にとらえたもの。
  "音声合成": 文字や文章から、人の声のような音声を作り出すこと。
  "音声認識": 人の話し声を、コンピュータで文字に変換すること。
  "音素": 言葉の意味を区別する、音の最小の単位。
  "隠れマルコフモデル": 観測できない状態が確率的に移り変わり、そこから観測データが出ると考えるモデル。かつての音声認識の主流。
  "感情分析": 声の調子などから、話し手の感情を推定すること。
  "高速フーリエ変換 (FFT)": 信号を周波数ごとの成分に分けるフーリエ変換を、高速に計算する方法。
  "スペクトル包絡": 音声の周波数ごとの強さの、なだらかな全体の形。声の音色を決める。
  "パルス符号変調器 (PCM)": アナログの信号を一定の間隔で取り出し（標本化）、数値に置き換えて（量子化）デジタルにする方式。
  "フォルマント": 音声のスペクトルに現れる、強さの山の部分。母音の聞き分けにかかわる。
  "フォルマント周波数": フォルマントが現れる周波数。低い方から第1、第2…と呼ぶ。
  "メル周波数ケプストラム係数 (MFCC)": 人の聴覚の特性に合わせて、音声のスペクトル包絡の特徴を表した値。音声認識の特徴量として使う。
  "メル尺度": 人が感じる音の高さに合わせて、周波数を変換した尺度。
  "話者識別": 声の特徴から、話しているのが誰かを判定すること。
  "CTC": 音声の区切りと出力する文字の対応がわからなくても、系列どうしを学習できる方法。音声認識で使う。
