id: gen
order: 12
domain: dlapp
color: "#5B34AA"
name: 深層強化学習とデータ生成
short: 深層強化学習と生成
shortLines: [深層強化学習, と生成]
priority: mid
badges: [revised]
summary: 強化学習にディープラーニングを組み合わせた深層強化学習と、画像・文章・音声などを作り出す生成モデル。ゲームAIやロボット、画像生成AIの裏側にある技術。
themes:
  - DQNとその改良（ダブルDQN・デュエリングネットワーク・ノイジーネットワーク・Rainbow）
  - 分散学習と方策の学習（A3C・APE-X・PPO）、ゲームAI（AlphaStar・OpenAI Five・Agent57）
  - 現実への応用（sim2real・ドメインランダマイゼーション・オフライン強化学習・残差強化学習）
  - RLHFによる言語モデルの調整
  - 生成モデル（GAN・DCGAN・Pix2Pix・CycleGAN・Diffusion Model・NeRF）
keywords: [DQN, ダブルDQN, Rainbow, PPO, RLHF, sim2real, ドメインランダマイゼーション, 敵対的生成ネットワーク (GAN), CycleGAN, Diffusion Model, NeRF]
examPoint: 手法と改良点の組合せ（DQNの何をダブルDQNが直したか）や、生成モデルの仕組みの違いを問う。
examTrap: Pix2Pixは対になった画像が必要、CycleGANは対になったデータがなくても変換できる。
priorityReason: シラバス2024の改訂ポイントで生成AIに必要な技術としてRLHF・Diffusion Model・NeRFが追加され、1.3版でマルチエージェント強化学習（MARL）の表記が改められた。JDLA公式の例題で直接の題材になった問はない。キーワード数は29語。
items: [T29, T30]
desc:
  "A3C": 複数のエージェントが並列に環境とやり取りし、非同期にActor-Criticで学習する手法。
  "Agent57": DeepMindの深層強化学習のエージェント。2020年に、Atariの57種類すべてのゲームで人間の基準を上回った。
  "APE-X": 経験を集める役と学習する役を分け、多数のエージェントを並列に動かして大量の経験を集める分散型の深層強化学習。
  "DQN": Q学習の行動価値関数を、深層ニューラルネットワークで近似した手法。Atariのゲームで人間並みの成績を出した。
  "OpenAI Five": OpenAIが開発した、対戦ゲームDota 2で5体が協力して戦うAI。プロのチームに勝った。
  "PPO": 方策を一度に変えすぎないよう更新の幅を制限し、安定して学習できるようにした方策勾配法。RLHFでも使われる。
  "Rainbow": DQNの複数の改良（ダブルDQN・デュエリングネットワーク・ノイジーネットワークなど）を組み合わせた手法。
  "RLHF": 人の評価から報酬モデルを作り、強化学習でモデルを調整する手法。大規模言語モデルを人の好みに合わせるのに使う。
  "sim2real": シミュレーションの中で学習した方策を、現実のロボットなどに移して使うこと。
  "アルファスター (AlphaStar)": DeepMindが開発した、リアルタイム戦略ゲームStarCraft IIのAI。トップレベルのプレイヤーに勝った。
  "オフライン強化学習": 環境とやり取りせずに、あらかじめ集めたデータだけで方策を学習する強化学習。
  "残差強化学習": 従来の制御の方策に、強化学習で学んだ補正（残差）を足して動作を改善する方法。
  "状態表現学習": 画像などの観測から、強化学習に役立つ状態の表し方を学ぶこと。
  "ダブルDQN": 行動の選択と評価に別のネットワークを使い、DQNが行動価値を大きく見積もりすぎる問題を和らげた手法。
  "デュエリングネットワーク": 行動価値を、状態そのものの価値と、行動ごとの有利さに分けて推定するDQNの構造。
  "ドメインランダマイゼーション": シミュレーションの見た目や物理の条件をランダムに変えて学習し、現実との違いに強くする方法。
  "ノイジーネットワーク": ネットワークの重みにノイズを加えて、探索を促すDQNの改良。
  "報酬成形": 学習しやすくなるよう、本来の報酬に途中経過への報酬などを加えて設計し直すこと。
  "マルチエージェント強化学習 (MARL)": 複数のエージェントが同じ環境で協力したり競争したりしながら学習する強化学習。
  "連続値制御": ロボットの関節の角度のように、行動が連続した値をとる制御の問題。
  "CycleGAN": 対になったデータがなくても、2つの画像の分野（例：馬としま馬）を互いに変換できるGAN。
  "DCGAN": 生成器と識別器に畳み込みニューラルネットワークを使い、学習を安定させたGAN。
  "Diffusion Model": データにノイズを少しずつ加える過程を逆にたどり、ノイズから少しずつデータを復元して生成するモデル（拡散モデル）。
  "NeRF": いくつかの方向から撮った写真から3次元の空間をニューラルネットワークで表し、新しい視点の画像を作る手法。
  "Pix2Pix": 対になった画像のデータで学習し、線画を写真風にするなど、ある画像を別の画像に変換するGAN。
  "音声生成": 音声をAIで作り出すこと。
  "画像生成": 画像をAIで作り出すこと。
  "敵対的生成ネットワーク (GAN)": 偽物を作る生成器と、本物か偽物かを見分ける識別器を競わせて学習する生成モデル。2014年にグッドフェローらが発表した。
  "文章生成": 文章をAIで作り出すこと。
