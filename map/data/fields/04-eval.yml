domain: mlbase
color: "#0C6670"
name: モデルの評価と数理・統計
short: 評価と数理・統計
shortLines: [評価と, 数理・統計]
priority: high
badges: []
summary: 作ったモデルが本当に役に立つかを確かめる評価の方法と指標、そしてその土台になる確率・統計の知識。適合率と再現率のように、似た指標の違いをはっきりさせることが大切。
themes:
  - 混同行列と正解率・適合率・再現率・F値、ROC曲線・AUC
  - 回帰の評価指標（MSE・RMSE・MAE）
  - 過学習と汎化性能、交差検証とホールドアウト検証
  - モデル選択の基準（AIC・BIC・オッカムの剃刀）
  - 代表値・散らばり・相関、確率分布、仮説検定、距離と類似度
keywords: [混同行列, 正解率・適合率・再現率・F値, ROC曲線・AUC, 過学習, k-分割交差検証, 平均二乗誤差 (MSE), 相関係数, 期待値, 正規分布, コサイン類似度]
examPoint: 指標の定義を場面に当てはめる問題（見逃しを減らしたいなら再現率など）や、簡単な計算（期待値・分散など）が出る。
examTrap: 適合率（陽性と予測した中の正しさ）と再現率（本当の陽性をどれだけ拾えたか）の取り違え、共分散と相関係数の違いに注意。
priorityReason: JDLA公式の例題Q15（G2022#1、相関係数・偏相関係数・共分散・分散）と例題Q16（G2022#3、期待値）が題材にしている。シラバス2024でMSE・RMSE・MAEが追加され、1.3版で真陽性・真陰性が追加された。キーワード数は45語で、分野の中で多い。
items: [T10, T37]
subShort:
  T37: 数理・統計知識
desc:
  "k-分割交差検証": データをk個に分け、1つを検証用・残りを学習用にする組合せを入れ替えながら、k回評価する方法。
  "平均二乗誤差 (MSE)": 予測値と正解の差を2乗して平均した値。大きな誤差を重く評価する。
  "二乗平均平方根誤差 (RMSE)": MSEの平方根。元のデータと同じ単位で誤差の大きさを表す。
  "平均絶対値誤差 (MAE)": 予測値と正解の差の絶対値の平均。外れ値の影響を受けにくい。
  "ROC曲線・AUC": しきい値を変えたときの偽陽性率と真陽性率の関係を描いた曲線（ROC曲線）と、その下の面積（AUC）。1に近いほど性能が良い。
  "赤池情報量規準 (AIC)": モデルの当てはまりの良さと、パラメータの多さ（複雑さ）の両方からモデルを選ぶための指標。小さいほど良い。
  "オッカムの剃刀": 同じくらいうまく説明できるなら、より単純なモデルを選ぶべきだという考え方。
  "過学習": 学習データに合わせすぎて、未知のデータでの性能が下がる状態。
  "交差検証": データを学習用と検証用に分け、学習に使っていないデータで性能を確かめる方法の総称。
  "偽陽性・偽陰性": 本当は陰性なのに陽性と予測すること（偽陽性）と、本当は陽性なのに陰性と予測すること（偽陰性）。
  "真陽性・真陰性": 陽性を正しく陽性と予測すること（真陽性）と、陰性を正しく陰性と予測すること（真陰性）。
  "混同行列": 予測と正解の組合せ（真陽性・偽陽性・偽陰性・真陰性）の件数をまとめた表。
  "正解率・適合率・再現率・F値": 全体のうち当たった割合（正解率）、陽性と予測した中で本当に陽性の割合（適合率）、本当の陽性のうち見つけられた割合（再現率）、適合率と再現率の調和平均（F値）。
  "汎化性能": 学習に使っていない未知のデータに対しても、正しく予測できる力。
  "ベイズ情報量規準 (BIC)": AICと同じくモデルの良さと複雑さを比べる指標。データが多いほど複雑さへの罰が強くなる。
  "ホールドアウト検証": データを学習用と検証用に一度だけ分けて評価する、最も単純な検証方法。
  "移動平均": 時系列データで、一定の期間の平均を少しずつずらしながら計算し、変動をならす方法。
  "確率分布": 確率変数がどの値をどのくらいの確率でとるかを表したもの。
  "確率変数": サイコロの目のように、確率に従っていろいろな値をとる変数。
  "確率密度": 連続した値をとる確率変数で、その値の近くになりやすさを表す量。範囲で積分すると確率になる。
  "疑似相関": 2つの変数に因果関係がないのに、別の要因などによって相関があるように見えること。
  "期待値": 確率変数がとる値に、その確率をかけて足し合わせた平均的な値。
  "帰無仮説": 仮説検定で、否定されることを期待して立てる「差がない・効果がない」という仮説。
  "共分散": 2つの変数の偏差の積の平均。一緒に増えるか減るかの傾向を表すが、大きさは単位に左右される。
  "コサイン類似度": 2つのベクトルの向きがどれだけ近いかを、なす角のコサインで表した指標。文書や単語の似ている度合いに使う。
  "最小二乗法": 予測と実測の差の2乗の合計が最も小さくなるように、モデルのパラメータを決める方法。
  "最頻値": データの中で最も多く現れる値。
  "最尤法": 観測されたデータが得られる確率（尤度）が最も大きくなるように、パラメータを決める方法。
  "条件付き確率": ある出来事が起きたという条件のもとで、別の出来事が起きる確率。
  "正規分布": 平均を中心に左右対称の釣り鐘型をした確率分布。多くの自然現象に見られる。
  "相関係数": 2つの変数の直線的な関係の強さを、−1〜1で表した指標。共分散をそれぞれの標準偏差で割って求める。
  "相互情報量": 一方の変数を知ることで、もう一方の不確かさがどれだけ減るかを表す量。
  "対立仮説": 仮説検定で、帰無仮説が否定されたときに採用する「差がある・効果がある」という仮説。
  "中央値": データを小さい順に並べたとき、真ん中にくる値。外れ値の影響を受けにくい。
  "度数分布": データを区間に分け、それぞれの区間に入る個数を数えて整理したもの。ヒストグラムで表す。
  "二項分布": 成功の確率がpの試行をn回繰り返したときの、成功の回数の確率分布。
  "外れ値": ほかのデータから大きく離れた値。平均などの統計量や学習の結果をゆがめることがある。
  "標準偏差": 分散の平方根。データのばらつきを、元の単位で表す。
  "平均": データの値をすべて足して、個数で割った値。
  "分散": 各データと平均との差（偏差）を2乗して平均した値。ばらつきの大きさを表す。
  "偏相関係数": ほかの変数の影響を取り除いたうえで、2つの変数の相関の強さを表す指標。
  "ベルヌーイ分布": 成功（1）か失敗（0）かの、1回だけの試行の結果を表す確率分布。
  "ポアソン分布": 一定の時間や範囲の中で、まれな出来事が起きる回数の確率分布。
  "マハラノビス距離": データのばらつきや、変数どうしの相関を考えに入れた距離。異常の検知に使う。
  "ユークリッド距離": 2点を結ぶ直線の長さで表す、いちばん普通の距離。
