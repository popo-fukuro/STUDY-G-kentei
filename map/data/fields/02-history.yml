name: 人工知能をめぐる動向（AIブームの歴史）
short: AIブームの歴史
shortLines: [AIブーム, の歴史]
priority: mid
badges: []
summary: 探索・推論（第1次ブーム）、知識表現とエキスパートシステム（第2次ブーム）、機械学習とディープラーニング（第3次ブーム）と続くAIの歴史。各時代の代表的なシステムと、ブームが終わった理由をセットで覚える。
themes:
  - 第1次ブーム：探索・推論（探索木、Mini-Max法、SHRDLU、STRIPS）
  - 第2次ブーム：知識表現とエキスパートシステム（MYCIN、DENDRAL、知識獲得のボトルネック）
  - 機械学習が注目された背景（ビッグデータ、次元の呪い）
  - 第3次ブーム：ILSVRC 2012、AlphaGo、生成AI
keywords: [幅優先探索, 深さ優先探索, αβ法, マイシン (MYCIN), オントロジー, ワトソン, ILSVRC, ネオコグニトロン, アルファ碁 (AlphaGo)]
examPoint: 年代・人物・システム名の組合せと、各ブームの特徴（何ができて何が壁になったか）を問う。
examTrap: 幅優先探索（最短の解が見つかる・メモリを多く使う）と深さ優先探索（メモリが少ない・最短とは限らない）の特徴の入れ替えに注意。
priorityReason: JDLA公式の例題Q2（G2022#1、エキスパートシステム）と例題Q3（G2022#1、ILSVRCとResNet）が題材にしている。シラバス1.3版で項目「ディープラーニング」のLLMが「生成AI」に変わり、統計的自然言語処理が追加された。キーワード数は36語。
items: [T03, T04, T05, T06]
subShort:
  T04: 知識表現・専門家システム
desc:
  "αβ法": Mini-Max法で、結果に影響しない枝の探索を打ち切って（枝刈り）計算を減らす手法。
  "Mini-Max法": 自分は得点を最大に、相手は最小にする手を選ぶと考えて、ゲームの最善手を探す方法。
  "SHRDLU": 積み木の世界で、英語の指示を理解して積み木を動かすシステム。ウィノグラードが1970年ごろに開発した。
  "STRIPS": 「前提条件・行動・結果」で行動を記述し、計画を自動で立てるプランニングの代表的な手法。1971年に発表された。
  "探索木": 問題の状態を節、状態の移り変わりを枝として、木の形に表したもの。
  "ハノイの塔": 円盤を決まった規則で別の柱へ移すパズル。探索で解く問題の代表例。
  "幅優先探索": 出発点に近い節から順に、同じ深さを全部調べてから次の深さへ進む探索。最短の解が見つかるがメモリを多く使う。
  "深さ優先探索": 1本の枝を行けるところまで深く進み、行き止まりなら戻って別の枝を調べる探索。メモリは少なくて済むが最短の解とは限らない。
  "ブルートフォース": 考えられるすべての組合せを、総当たりで調べる方法。
  "モンテカルロ法": ランダムなシミュレーション（プレイアウト）を何度も行い、その結果から手のよさを評価する方法。囲碁AIで使われた。
  "Cycプロジェクト": 人間の一般常識をすべて知識ベースに書き込もうとするプロジェクト。レナートが1984年に始めた。
  "DENDRAL": 化合物の質量分析のデータから分子の構造を推定する、最初期のエキスパートシステム。1960年代にスタンフォード大学で開発された。
  "is-aの関係・has-aの関係・part-ofの関係": 概念のつながりを表す関係。「〜は〜の一種」「〜は〜を持つ」「〜は〜の一部」。
  "Question-Answering": 自然文の質問に対して、知識ベースや文書から答えを見つけて返す技術。
  "意味ネットワーク": 概念を節、概念どうしの関係を矢印で結び、知識を網の目のように表す方法。
  "イライザ (ELIZA)": 決まったパターンに当てはめて相手の言葉を言い換えて返す、初期の対話プログラム。ワイゼンバウムが1966年に発表した。
  "インタビューシステム": 専門家への聞き取りを支援し、知識を引き出してエキスパートシステムに取り込むための仕組み。
  "ウェブマイニング": Webページの文章やリンク、利用の履歴などから役に立つ知識を取り出すこと。
  "オントロジー": ある分野の概念と、その関係を体系的に定義したもの。知識を共有・再利用するための「概念の辞書」。
  "セマンティックWeb": Webの情報に意味を表すデータ（メタデータ）を付け、コンピュータが内容を理解して処理できるようにする構想。
  "データマイニング": 大量のデータから、規則性や関係などの役に立つ知識を掘り起こすこと。
  "東ロボくん": 東京大学の入試合格を目標にした、国立情報学研究所のAIプロジェクト（2011年開始）。文章の読解の難しさが明らかになった。
  "マイシン (MYCIN)": 血液の感染症の患者に合う抗生物質を推薦するエキスパートシステム。1970年代にスタンフォード大学で開発された。
  "ワトソン": IBMの質問応答システム。2011年にアメリカのクイズ番組で人間のチャンピオンに勝った。
  "次元の呪い": 特徴量の次元が増えると、必要なデータ量や計算量が急激に増え、学習がうまくいかなくなる現象。
  "スパムフィルタ": 迷惑メールかどうかを、過去のメールから学習して自動で振り分ける仕組み。機械学習の代表的な応用。
  "ビッグデータ": 量がとても多く、種類も多様で、次々に生まれるデータ。機械学習が実用になった背景の一つ。
  "レコメンデーションエンジン": 利用者の行動の履歴などから、好みに合いそうな商品やコンテンツを推薦する仕組み。
  "統計的自然言語処理": 大量の文章データから確率や統計を使って言語を扱う手法。人が規則を書く方法に代わって主流になった。
  "ImageNet": 1,400万枚を超える画像に物体の名前のラベルを付けた、大規模なデータセット。画像認識の研究を大きく進めた。
  "ILSVRC": ImageNetを使った画像認識の国際コンテスト。2012年にディープラーニングのAlexNetが大差で優勝した。
  "LeNet": ルカンらが開発した初期の畳み込みニューラルネットワーク。手書きの数字の認識に使われた。
  "アルファ碁 (AlphaGo)": DeepMindが開発した囲碁のAI。2016年にトップ棋士のイ・セドルに勝った。
  "人間の神経回路": ニューラルネットワークの発想のもとになった、脳の神経細胞（ニューロン）のつながり。
  "ネオコグニトロン": 福島邦彦が1979年に発表した、視覚の仕組みをまねた多層のネットワーク。CNNの原型とされる。
  "生成AI": 学習したデータをもとに、文章・画像・音声などの新しいコンテンツを作り出すAI。
