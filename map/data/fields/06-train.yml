id: train
order: 6
domain: dlcore
color: "#3A44A6"
name: 学習の仕組みと最適化（正則化・誤差逆伝播法・最適化手法）
short: 学習と最適化
shortLines: [学習と, 最適化]
priority: mid
badges: []
summary: ニューラルネットワークが重みを少しずつ直していく仕組み。誤差逆伝播法で勾配を求め、最適化手法で重みを更新し、正則化で過学習を防ぐ。
themes:
  - 誤差逆伝播法と連鎖律、勾配消失問題・勾配爆発問題
  - 勾配降下法の種類（バッチ・ミニバッチ・オンライン、SGD）
  - 最適化手法の発展（モーメンタム→AdaGrad→RMSprop・AdaDelta→Adam→AdaBound・AMSBound）
  - 局所最適解・鞍点、学習率とハイパーパラメータの探索
  - 正則化（L1・L2、ドロップアウト）と早期終了
keywords: [誤差逆伝播法, 連鎖律, 確率的勾配降下法 (SGD), Adam, 学習率, 局所最適解, 鞍点, L1正則化, L2正則化, ドロップアウト, 早期終了]
examPoint: 最適化手法の改良の流れ（何を何で改善したか）や、正則化の効果の違い、エポックとイテレーションの区別を問う。
examTrap: L1正則化は不要な重みを0にしやすく（特徴の選択）、L2正則化は重み全体を小さくする。ラッソ回帰がL1、リッジ回帰がL2。
priorityReason: JDLA公式の例題Q7（G2022#1、勾配消失問題）が題材にしている。シラバス2024で連鎖律が追加された。キーワード数は35語。
items: [T14, T15, T16]
desc:
  "L0正則化": 0でないパラメータの個数に罰を与える正則化。計算が難しいため、L1正則化で代わりに近づけることが多い。
  "L1正則化": パラメータの絶対値の和に罰を与える正則化。不要な重みが0になりやすく、特徴を選ぶ効果がある。
  "L2正則化": パラメータの2乗の和に罰を与える正則化。重みを全体に小さくして、なめらかなモデルにする。
  "正則化": 誤差関数に罰則の項を加えるなどして、モデルが複雑になりすぎないようにし、過学習を防ぐ方法の総称。
  "ドロップアウト": 学習のたびに一部のニューロンをランダムに無効にして、過学習を防ぐ方法。
  "ラッソ回帰": L1正則化を加えた線形回帰。
  "リッジ回帰": L2正則化を加えた線形回帰。
  "勾配消失問題": 入力側の層ほど勾配が小さくなり、学習が進まなくなる問題。活性化関数の微分を何度もかけ合わせるために起きる。
  "勾配爆発問題": 層をさかのぼるにつれて勾配が大きくなりすぎ、学習が不安定になる問題。
  "信用割当問題": 出力の誤差に対して、どのパラメータにどれだけ責任があるかを決める問題。誤差逆伝播法はこれを解く方法になった。
  "連鎖律": 合成関数の微分は、それぞれの関数の微分のかけ算で求められるという法則。誤差逆伝播法の土台。
  "AdaBound": 学習の初めはAdamのように動き、学習率に上限と下限を設けて、だんだんSGDに近づける最適化手法。
  "AdaDelta": AdaGradで学習率が小さくなりすぎる問題を、直近の勾配の情報だけを使うことで改善した最適化手法。
  "AdaGrad": よく更新されたパラメータほど学習率を小さくする最適化手法。学習が進むと学習率が小さくなりすぎることがある。
  "Adam": モーメンタムとRMSpropの考え方を組み合わせた、広く使われる最適化手法。
  "AMSBound": AMSGradに学習率の上限と下限を加え、だんだんSGDに近づける最適化手法。
  "RMSprop": 勾配の2乗の移動平均で学習率を調整し、AdaGradの学習率が小さくなりすぎる問題を改善した最適化手法。
  "鞍点": ある方向では最小、別の方向では最大になっている点。勾配が0になるため学習が止まりやすい。
  "イテレーション": パラメータを1回更新すること。ミニバッチ1つ分の学習にあたる。
  "エポック": 学習データ全体を1回使い切ること。
  "オンライン学習": データを1件ずつ使って、そのつどパラメータを更新する学習方法。
  "学習率": 1回の更新でパラメータをどれだけ動かすかを決めるハイパーパラメータ。
  "確率的勾配降下法 (SGD)": ランダムに選んだ一部のデータで勾配を計算し、パラメータを更新する方法。
  "グリッドサーチ": ハイパーパラメータの候補の組合せを、格子状にすべて試して最良を選ぶ方法。
  "勾配降下法": 誤差関数の勾配（傾き）の逆向きにパラメータを少しずつ動かして、誤差を最小にする方法。
  "局所最適解": 周りと比べれば最小だが、全体では最小ではない解。
  "早期終了": 検証データでの誤差が下がらなくなった時点で学習を止め、過学習を防ぐ方法。
  "大域最適解": 全体の中で、本当に誤差が最小になる解。
  "二重降下現象": モデルを大きくしたり学習を続けたりすると、テストでの誤差がいったん悪化したあと再び下がる現象。
  "ノーフリーランチの定理": あらゆる問題に対して、ほかより常に優れた万能のアルゴリズムは存在しないという定理。
  "ハイパーパラメータ": 学習率や層の数など、学習の前に人が決めておく設定値。
  "バッチ学習": 学習データ全体を使って勾配を計算し、まとめてパラメータを更新する学習方法。
  "ミニバッチ学習": データを小さなまとまり（ミニバッチ）に分け、まとまりごとにパラメータを更新する学習方法。
  "モーメンタム": 前回の更新の向きを慣性のように引き継ぎ、学習の振動を抑えて速く進める工夫。
  "ランダムサーチ": ハイパーパラメータをランダムに選んで試し、最良を探す方法。
