id: law
order: 15
domain: social
color: "#9A450A"
name: AIに関する法律と契約
short: 法律と契約
priority: high
badges: [revised]
summary: AIの開発と利用にかかわる法律（個人情報・著作権・特許・営業秘密・独占禁止）と、AIの開発やサービスの契約の考え方。データを集める・学習させる・提供するそれぞれの場面で、何に気をつけるかを押さえる。
themes:
  - 個人情報保護法（個人情報・個人データ・保有個人データの違い、要配慮個人情報、匿名加工情報と仮名加工情報、第三者提供と委託）とGDPR
  - 著作権法（著作物の要件、AI生成物の扱い、著作権侵害の判断）
  - 特許法（発明の要件、発明者、職務発明）
  - 不正競争防止法（営業秘密の3要件、限定提供データ）と独占禁止法
  - AI開発の契約（AI・データの利用に関する契約ガイドライン、請負と準委任、PoC、精度保証）とAIサービスの契約
keywords: [個人情報, 要配慮個人情報, 匿名加工情報, 仮名加工情報, 第三者提供, 著作物, AI生成物, 営業秘密, 準委任契約, AI・データの利用に関する契約ガイドライン]
examPoint: 具体的な事例が法律の対象になるか、どの契約の形が合うかを判断させる問題が多い。「最も不適切なものを選べ」の形に注意。
examTrap: 匿名加工情報は元に戻せない加工、仮名加工情報はほかの情報と照らし合わせれば個人を識別できる加工。請負は完成の義務あり、準委任は完成の義務なし。
priorityReason: JDLA公式の例題Q17（G2022#2、個人情報保護法）と例題Q18（G2023#4、AI開発契約）が題材にしている。シラバス2024の改訂ポイントで、法律・倫理は「理解しておくべきポイントを明確化」された。キーワード数は40語。
items: [E01, E02, E03, E04, E05, E06, E07]
desc:
  "GDPR": EUの一般データ保護規則。EU域内の個人データの扱いを厳しく定め、域外の事業者に適用されることもある。2018年に適用が始まった。
  "仮名加工情報": ほかの情報と照らし合わせない限り、特定の個人を識別できないように加工した情報。社内での分析などに使いやすい。
  "個人識別符号": 指紋や顔の特徴のデータ、マイナンバーや旅券の番号など、それだけで特定の個人を識別できる符号。
  "個人データ": 個人情報をデータベースなどに整理したもののうち、それを構成する個人情報。
  "個人情報": 生きている個人に関する情報で、氏名などで特定の個人を識別できるもの、または個人識別符号を含むもの。
  "第三者提供": 個人データを、本人や委託先などではないほかの人に渡すこと。原則として本人の同意が必要。
  "匿名加工情報": 特定の個人を識別できず、元の個人情報に戻せないように加工した情報。一定の条件を守れば本人の同意なく第三者に提供できる。
  "保有個人データ": 事業者が、本人からの開示・訂正・利用停止などの求めに応じる権限をもつ個人データ。
  "要配慮個人情報": 人種・信条・病歴・犯罪の経歴など、不当な差別や偏見が生じないよう特に配慮が必要な個人情報。取得には原則として本人の同意が要る。
  "利用目的": 個人情報を何のために使うか。できるだけ具体的に決め、本人に知らせるか公表する必要がある。
  "委託": 個人データの取扱いを外部に任せること。第三者提供には当たらないが、委託先を監督する義務がある。
  "創作性": 作った人の個性が表れていること。著作物として保護されるための要件の一つ。
  "著作物": 思想や感情を創作的に表現したもので、文芸・学術・美術・音楽の範囲に属するもの。
  "AI生成物": AIが作った文章や画像など。人の創作的な関与がなければ、著作物とは認められにくいと考えられている。
  "E02:利用規約": サービスやデータを使うときの条件を定めた取り決め。学習に使うデータや、生成物の扱いを確かめる必要がある。
  "著作権侵害": 他人の著作物を、許可なく複製・公開などして権利を侵すこと。似ていること（類似性）と、元の作品をもとにしたこと（依拠性）が判断の要素になる。
  "著作権": 著作物を作った人がもつ、複製や公開などを独占的に行える権利。登録しなくても、創作した時点で発生する。
  "発明": 自然法則を利用した技術的な思想の創作のうち、高度なもの。
  "新規性": 出願の前に、世の中に知られていないこと。特許を受けるための要件の一つ。
  "進歩性": その分野の専門家が、すでにある技術から簡単には思いつけないこと。特許を受けるための要件の一つ。
  "知的財産権": 特許権・著作権・商標権など、人の知的な創作の成果を守る権利の総称。
  "発明者": 発明を実際に生み出した人。日本では人に限られ、AIは発明者になれないとされている。
  "職務発明": 従業員が仕事として行った発明。契約や社内の規則で、会社が特許を受ける権利を取得できる。
  "特許権": 発明を一定の期間（原則として出願から20年）、独占的に実施できる権利。
  "営業秘密": 秘密として管理され（秘密管理性）、事業に役立ち（有用性）、世の中に知られていない（非公知性）情報。
  "限定提供データ": 特定の相手に限って提供される、電子的に管理された大量のデータ。不正な取得や使用が禁じられる。
  "競争制限": 事業者が取り決めなどによって、市場での自由な競争を妨げること。
  "公正競争阻害性": ある行為が、公正な競争を妨げるおそれがあること。不公正な取引方法に当たるかを判断するときの要素。
  "AI・データの利用に関する契約ガイドライン": 経済産業省が作った、AIの開発やデータの利用の契約の考え方とモデル契約をまとめた指針。開発をアセスメント・PoC・開発・追加学習の段階に分ける。
  "NDA": 取引の中で知った秘密の情報を、外部に漏らさないことを約束する契約（秘密保持契約）。
  "請負契約": 仕事の完成を約束し、その成果に対して報酬が支払われる契約。
  "準委任契約": 専門家として注意を尽くして仕事をすること（善管注意義務）を約束する契約。完成の義務はない。
  "E06:精度保証": AIの精度をあらかじめ保証すること。学習してみないと精度がわからないため、開発の契約で保証するのは難しい。
  "PoC": 本開発の前に、技術的に実現できるかを確かめる段階。ガイドラインでは準委任契約が合うとされる。
  "保守契約": 開発したあとのシステムやモデルの保守・運用について決める契約。再学習の扱いなども決めておく。
  "SaaS": ソフトウェアを、インターネット経由のサービスとして提供する形。
  "データ利用権": 契約に基づいて、データを使える範囲や条件を定めた権限。
  "E07:利用規約": AIサービスの使い方や、入力したデータ・出力の扱い、責任の範囲などを定めた取り決め。
  "E07:精度保証": AIサービスの出力の精度を保証すること。利用規約では保証しないと定めることが多い。
