id: ethics
order: 16
domain: moral
color: "#B0305C"
name: AI倫理の原則とリスク（ガイドライン・プライバシー・公平性・安全性・悪用・透明性）
short: 倫理の原則とリスク
shortLines: [倫理の原則, とリスク]
priority: high
badges: [revised]
summary: AIを使うときに守るべき原則と、AIが引き起こしうるリスク。法律で決まっていないことも、ガイドライン（ソフトロー）や設計の工夫で対処する考え方を押さえる。
themes:
  - ハードローとソフトロー、リスクベースアプローチ、AI倫理の価値原則
  - プライバシー（プライバシー・バイ・デザイン、カメラ画像利活用ガイドブック）
  - 公平性（データの偏り、サンプリングバイアス、センシティブ属性と代理変数）
  - 安全性とセキュリティ（敵対的攻撃、データ汚染、モデル窃取）
  - 悪用（ディープフェイク、フェイクニュース）と透明性（説明可能性、データの来歴）
keywords: [ソフトロー, リスクベースアプローチ, プライバシー・バイ・デザイン, アルゴリズムバイアス, センシティブ属性, 代理変数, Adversarial Attack (Adversarial Examples), データ汚染, ディープフェイク, 説明可能性]
examPoint: 事例を示して、どの倫理的な問題に当たるか・どう対処すべきかを問う。「最も不適切なものを選べ」の形が多い。
examTrap: センシティブ属性を学習データから外しても、代理変数を通じて差別が起きることがある。ソフトローは法的な拘束力がない。
priorityReason: JDLA公式の例題Q19（G2022#1、顔認識技術の倫理的な問題）が題材にしている。シラバス2024の改訂ポイントで法律・倫理が明確化され、AI倫理・AIガバナンスは11項目に増えた。キーワード数は25語。
items: [E08, E09, E10, E11, E12, E13]
desc:
  "AI倫理": AIを開発・利用するときに守るべき価値観や原則。人権・公平性・透明性などを含む。
  "AIガバナンス": AIのリスクを適切に管理しながら価値を引き出すための、組織や社会のルールと仕組み。
  "価値原則": 人間中心・公平性・プライバシーなど、AIの開発や利用で大切にすべき基本的な価値をまとめたもの。
  "ハードロー": 法律のように、守らなければ罰則などがある、拘束力のある決まり。
  "ソフトロー": ガイドラインや業界の自主的な基準のように、法的な拘束力はないが守ることが期待される決まり。
  "リスクベースアプローチ": AIのリスクの大きさに応じて、求める対策や規制の強さを変える考え方。EUのAI法などで採られている。
  "カメラ画像利活用ガイドブック": カメラの画像を使う事業者が、生活者のプライバシーに配慮するための考え方をまとめた指針。経済産業省と総務省が作った。
  "プライバシー・バイ・デザイン": 企画・設計の段階から、プライバシーの保護を組み込んでおく考え方。
  "アルゴリズムバイアス": アルゴリズムやデータの偏りによって、特定の集団に不公平な結果が出ること。
  "公平性の定義": 何をもって公平とするかの基準。集団ごとの結果をそろえる、条件が同じなら扱いをそろえるなど複数あり、同時には満たせないこともある。
  "サンプリングバイアス": データを集める段階の偏りで、集めたデータが本来の対象全体を正しく代表していないこと。
  "センシティブ属性": 性別・人種・宗教など、差別につながるおそれがあり、扱いに注意が必要な属性。
  "代理変数": センシティブ属性と強く関係する別の変数（住んでいる地域など）。直接使わなくても、これを通じて差別が生じることがある。
  "データの偏り": 学習データの中身が、一部の集団や状況にかたよっていること。AIの判断の偏りの原因になる。
  "Adversarial Attack (Adversarial Examples)": 人にはわからないほど小さな細工を入力に加えて、AIに誤った判断をさせる攻撃（敵対的攻撃）。
  "セキュリティ・バイ・デザイン": 企画・設計の段階から、セキュリティの対策を組み込んでおく考え方。
  "データ汚染": 学習データに不正なデータを混ぜて、AIの判断をゆがめる攻撃。
  "データ窃取": AIの出力を分析するなどして、学習に使われたデータを盗み出す攻撃。
  "モデル窃取": AIへの問い合わせとその答えを大量に集めて、元のモデルと同じようにふるまうモデルを作る攻撃。
  "モデル汚染": 学習済みのモデルそのものに細工をして、特定の条件で誤った動作をさせる攻撃。
  "ディープフェイク": ディープラーニングで作った、本物と見分けにくい偽の映像や音声。
  "フェイクニュース": 事実でない情報を、ニュースのように装って広めるもの。生成AIで大量に作られるおそれがある。
  "データの来歴": データがどこで、どのように作られ、どう加工されてきたかの記録。
  "説明可能性": AIがなぜその結果を出したのかを、人が理解できるように説明できること。
  "ブラックボックス": 内部の仕組みが複雑で、なぜその判断になったのかが外からわからない状態。
